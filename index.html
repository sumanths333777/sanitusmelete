<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>SANITAS MELETE AI</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:'Inter',sans-serif;
  background:#f7f2e8;
  overflow:hidden;
  color:#06163a;
}

/* MAIN SCREEN */

.hero{
  width:100%;
  height:100vh;
  position:relative;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  background:
  radial-gradient(circle at center,
  rgba(255,255,255,0.9),
  rgba(247,242,232,1) 70%);
}

/* TOP LEFT LOGO */

.brand{
  position:absolute;
  top:35px;
  left:40px;
  font-size:15px;
  font-weight:700;
  letter-spacing:4px;
  line-height:1.4;
}

/* GLOW CIRCLE */

.glow-ring{
  width:420px;
  height:420px;
  border-radius:50%;
  background:rgba(255,255,255,0.55);
  backdrop-filter:blur(8px);
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  box-shadow:
  0 0 80px rgba(255,255,255,0.9),
  inset 0 0 30px rgba(255,255,255,0.8);

  animation:pulse 5s ease-in-out infinite;
}

/* OUTER RINGS */

.glow-ring::before,
.glow-ring::after{
  content:'';
  position:absolute;
  border-radius:50%;
  border:1px solid rgba(218,190,140,0.18);
}

.glow-ring::before{
  width:520px;
  height:520px;
}

.glow-ring::after{
  width:650px;
  height:650px;
}

/* LOGO */

.logo{
  font-size:170px;
  font-weight:800;
  color:#001d63;
  letter-spacing:-12px;
}

/* TITLE */

.title{
  margin-top:70px;
  font-size:92px;
  font-weight:800;
  letter-spacing:-5px;
}

.title span{
  color:#d9a441;
}

/* TAGLINE */

.tagline{
  margin-top:14px;
  font-size:20px;
  color:#5b6475;
  font-weight:500;
}

/* INPUT BOX */

.input-area{
  position:absolute;
  bottom:40px;
  width:90%;
  max-width:850px;
}

.input-box{
  width:100%;
  height:75px;
  border:none;
  outline:none;
  border-radius:30px;
  padding:0 30px;
  font-size:17px;
  background:rgba(255,255,255,0.6);
  backdrop-filter:blur(15px);

  box-shadow:
  0 10px 40px rgba(0,0,0,0.05),
  inset 0 1px 1px rgba(255,255,255,0.8);

  color:#06163a;
}

/* SEND BUTTON */

.send-btn{
  position:absolute;
  right:14px;
  top:50%;
  transform:translateY(-50%);
  width:52px;
  height:52px;
  border-radius:50%;
  border:none;
  cursor:pointer;
  background:#001d63;
  color:white;
  font-size:20px;
  transition:0.3s;
}

.send-btn:hover{
  transform:translateY(-50%) scale(1.08);
}

/* ANIMATION */

@keyframes pulse{
  0%{
    transform:scale(1);
  }

  50%{
    transform:scale(1.02);
  }

  100%{
    transform:scale(1);
  }
}

/* MOBILE */

@media(max-width:768px){

  .glow-ring{
    width:280px;
    height:280px;
  }

  .glow-ring::before{
    width:360px;
    height:360px;
  }

  .glow-ring::after{
    width:440px;
    height:440px;
  }

  .logo{
    font-size:110px;
  }

  .title{
    font-size:58px;
    text-align:center;
    line-height:1;
  }

  .tagline{
    text-align:center;
    padding:0 20px;
    font-size:16px;
  }

  .brand{
    font-size:12px;
    left:20px;
  }

}

</style>
</head>

<body>

<div class="hero">

  <!-- TOP LEFT -->
  <div class="brand">
    SANITAS<br>
    MELETE AI
  </div>

  <!-- CENTER -->
  <div class="glow-ring">
    <div class="logo">∞</div>
  </div>

  <!-- TITLE -->
  <div class="title">
    Hi, I'm <span>MEBI</span>
  </div>

  <!-- TAGLINE -->
  <div class="tagline">
    Your AI Study Companion for NEET & JEE
  </div>

  <!-- INPUT -->
  <div class="input-area">

    <input
      class="input-box"
      type="text"
      placeholder="Ask anything about NEET, Physics, Biology..."
    />

    <button class="send-btn">
      ➜
    </button>

  </div>

</div>

</body>
</html>
