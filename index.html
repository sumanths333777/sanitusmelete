<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sanitas Melete AI</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    min-height:100%;
}

body{
    background:#f8f1e8;
    font-family:'Poppins',sans-serif;
    color:#0b2c74;
    overflow-x:hidden;
}

/* SOFT GLOW */

body::before{
    content:"";
    position:fixed;
    inset:0;

    background:
    radial-gradient(circle at top left, rgba(255,255,255,0.72), transparent 35%),
    radial-gradient(circle at bottom right, rgba(255,255,255,0.45), transparent 35%);

    z-index:-1;
}

/* TOPBAR */

.topbar{
    position:fixed;

    top:0;
    left:0;
    right:0;

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:24px 28px;

    z-index:1000;
}

.left-top{
    display:flex;
    align-items:center;
    gap:18px;
}

/* ORIGINAL BUTTON STYLE */

.top-btn{
    width:68px;
    height:68px;

    border-radius:50%;

    background:rgba(255,255,255,0.28);

    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);

    border:1px solid rgba(255,255,255,0.55);

    display:flex;
    align-items:center;
    justify-content:center;

    box-shadow:
    inset 0 1px 1px rgba(255,255,255,0.8),
    0 8px 25px rgba(0,0,0,0.04);

    color:#0b2c74;

    cursor:pointer;

    transition:0.25s ease;
}

.top-btn:hover{
    transform:scale(1.04);
}

.menu-icon{
    font-size:30px;
}

.logo-icon{
    font-size:34px;
}

.brand{
    font-size:34px;

    font-family:'Cormorant Garamond',serif;
    font-weight:600;
}

/* HERO */

.hero{
    width:100%;
    min-height:100vh;

    display:flex;
    flex-direction:column;

    justify-content:center;
    align-items:center;

    text-align:center;

    padding:120px 20px 60px;
}

.hero-logo-circle{
    width:min(30vw,360px);
    height:min(30vw,360px);

    border-radius:50%;

    background:rgba(255,255,255,0.18);

    border:1px solid rgba(255,255,255,0.5);

    display:flex;
    align-items:center;
    justify-content:center;

    margin-bottom:34px;

    box-shadow:
    inset 0 1px 1px rgba(255,255,255,0.75),
    0 18px 50px rgba(0,0,0,0.03);
}

.hero-logo{
    font-size:min(9vw,110px);
}

.hero h1{
    font-size:min(5vw,78px);

    font-family:'Cormorant Garamond',serif;

    font-weight:700;

    margin-bottom:10px;
}

.hero-line{
    display:flex;
    align-items:center;
    gap:16px;

    color:#c79c36;

    margin-bottom:12px;
}

.hero-line span{
    width:min(8vw,100px);
    height:1px;

    background:#c79c36;
}

.hero p{
    font-size:min(1.7vw,24px);

    color:#b48a2f;
}

/* CHAT */

#chatContainer{
    width:100%;

    display:flex;
    flex-direction:column;

    gap:22px;

    padding:20px 30px 160px;
}

.message{
    width:fit-content;
    max-width:700px;

    padding:20px 26px;

    border-radius:30px;

    font-size:20px;

    line-height:1.7;
}

.user{
    align-self:flex-end;

    background:#0b2c74;
    color:white;
}

.ai{
    align-self:flex-start;

    background:rgba(255,255,255,0.42);

    backdrop-filter:blur(18px);

    border:1px solid rgba(255,255,255,0.55);

    color:#0b2c74;
}

/* INPUT */

.input-area{
    position:fixed;

    left:22px;
    right:22px;
    bottom:18px;

    height:82px;

    background:rgba(255,255,255,0.42);

    backdrop-filter:blur(18px);

    border:1px solid rgba(255,255,255,0.55);

    border-radius:45px;

    display:flex;
    align-items:center;

    padding:0 14px;

    z-index:1000;

    box-shadow:
    inset 0 1px 1px rgba(255,255,255,0.7),
    0 10px 30px rgba(0,0,0,0.04);
}

.left-icon{
    width:52px;
    height:52px;

    border-radius:50%;

    background:rgba(255,255,255,0.65);

    display:flex;
    align-items:center;
    justify-content:center;

    color:#c79c36;

    font-size:26px;

    margin-right:12px;
}

#userInput{
    flex:1;

    border:none;
    outline:none;

    background:transparent;

    font-size:20px;

    color:#555;
}

#sendBtn{
    width:54px;
    height:54px;

    border:none;
    border-radius:50%;

    background:white;

    color:#b48a2f;

    font-size:28px;

    cursor:pointer;
}

/* POPUPS */

.popup{
    position:fixed;

    top:100px;

    background:rgba(255,255,255,0.42);

    backdrop-filter:blur(22px);

    border:1px solid rgba(255,255,255,0.55);

    border-radius:28px;

    padding:22px;

    z-index:2000;

    opacity:0;
    visibility:hidden;

    transition:0.3s ease;

    box-shadow:
    0 18px 40px rgba(0,0,0,0.06);
}

.popup.active{
    opacity:1;
    visibility:visible;
}

#menuPopup{
    left:28px;
    width:240px;
}

#logoPopup{
    right:28px;
    width:260px;
    text-align:center;
}

#menuPopup a{
    display:block;

    text-decoration:none;

    color:#0b2c74;

    font-size:18px;

    margin-bottom:18px;
}

#menuPopup a:last-child{
    margin-bottom:0;
}

#logoPopup h3{
    font-size:32px;

    margin-bottom:10px;

    font-family:'Cormorant Garamond',serif;
}

#logoPopup p{
    color:#7c6f5b;
    line-height:1.6;
}

/* MOBILE */

@media(max-width:768px){

    .topbar{
        padding:18px;
    }

    .top-btn{
        width:58px;
        height:58px;
    }

    .menu-icon{
        font-size:26px;
    }

    .logo-icon{
        font-size:30px;
    }

    .brand{
        font-size:22px;
    }

    .hero-logo-circle{
        width:240px;
        height:240px;
    }

    .hero-logo{
        font-size:84px;
    }

    .hero h1{
        font-size:52px;
    }

    .hero-line span{
        width:70px;
    }

    .hero p{
        font-size:19px;
    }

    #chatContainer{
        padding:20px 18px 150px;
    }

    .message{
        max-width:85%;

        font-size:17px;

        padding:18px 20px;
    }

    .input-area{
        left:16px;
        right:16px;
        bottom:16px;

        height:76px;
    }

    .left-icon,
    #sendBtn{
        width:50px;
        height:50px;
    }

    #userInput{
        font-size:18px;
    }

    #menuPopup,
    #logoPopup{
        width:calc(100% - 32px);
        left:16px;
        right:16px;
    }

}

</style>
</head>

<body>

<!-- POPUPS -->

<div class="popup" id="menuPopup">
    <a href="#">Home</a>
    <a href="about.html">About</a>
    <a href="#">Features</a>
    <a href="#">Contact</a>
</div>

<div class="popup" id="logoPopup">
    <h3>Sanitas Melete</h3>

    <p>
        Calm AI study experience for NEET, JEE and competitive exam students.
    </p>
</div>

<!-- TOPBAR -->

<div class="topbar">

    <div class="left-top">

        <div class="top-btn" id="menuBtn">
            <span class="menu-icon">☰</span>
        </div>

        <div class="brand">
            Sanitas Melete
        </div>

    </div>

    <div class="top-btn" id="logoBtn">
        <span class="logo-icon">∞</span>
    </div>

</div>

<!-- HERO -->

<section class="hero">

    <div class="hero-logo-circle">
        <div class="hero-logo">∞</div>
    </div>

    <h1>Hi iam mebi</h1>

    <div class="hero-line">
        <span></span>
        ✦
        <span></span>
    </div>

    <p>your study buddy</p>

</section>

<!-- CHAT -->

<section id="chatContainer"></section>

<!-- INPUT -->

<div class="input-area">

    <div class="left-icon">
        ⌘
    </div>

    <input
        type="text"
        id="userInput"
        placeholder="type your questions here"
    >

    <button id="sendBtn">
        ↑
    </button>

</div>

<script>

const userInput = document.getElementById("userInput");
const sendBtn = document.getElementById("sendBtn");
const chatContainer = document.getElementById("chatContainer");

const menuBtn = document.getElementById("menuBtn");
const logoBtn = document.getElementById("logoBtn");

const menuPopup = document.getElementById("menuPopup");
const logoPopup = document.getElementById("logoPopup");

/* CHAT */

function addMessage(text,type){

    const msg = document.createElement("div");

    msg.classList.add("message");
    msg.classList.add(type);

    msg.innerText = text;

    chatContainer.appendChild(msg);

    window.scrollTo({
        top:document.body.scrollHeight,
        behavior:"smooth"
    });
}

function sendMessage(){

    const text = userInput.value.trim();

    if(text === "") return;

    addMessage(text,"user");

    userInput.value = "";

    setTimeout(()=>{

        addMessage(
`Hello there! 😊

I am MEBI, your study buddy.
How can I help you today?`,
        "ai");

    },700);
}

sendBtn.addEventListener("click",sendMessage);

userInput.addEventListener("keypress",function(e){

    if(e.key === "Enter"){
        sendMessage();
    }

});

/* MENU */

menuBtn.addEventListener("click",()=>{

    menuPopup.classList.toggle("active");

    logoPopup.classList.remove("active");

});

logoBtn.addEventListener("click",()=>{

    logoPopup.classList.toggle("active");

    menuPopup.classList.remove("active");

});

/* OUTSIDE CLICK */

document.addEventListener("click",(e)=>{

    if(
        !menuBtn.contains(e.target) &&
        !menuPopup.contains(e.target)
    ){
        menuPopup.classList.remove("active");
    }

    if(
        !logoBtn.contains(e.target) &&
        !logoPopup.contains(e.target)
    ){
        logoPopup.classList.remove("active");
    }

});

</script>

</body>
</html>
