<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Sanitas Melete</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#f3e7da;
  overflow:hidden;

  font-family:
  -apple-system,
  BlinkMacSystemFont,
  "SF Pro Display",
  sans-serif;
}

/* APP */

.app{
  width:100%;
  height:100vh;

  background:
  radial-gradient(circle at top,
  #f7ede3 0%,
  #f3e7da 55%,
  #efe2d5 100%);

  position:relative;

  overflow:hidden;
}

/* LIGHT */

.app::before{
  content:"";

  position:absolute;

  width:420px;
  height:420px;

  border-radius:50%;

  background:rgba(255,255,255,0.16);

  filter:blur(90px);

  left:50%;
  top:130px;

  transform:translateX(-50%);
}

/* TOPBAR */

.topbar{
  height:90px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 32px;

  position:relative;
  z-index:10;
}

/* BUTTONS */

.glass-btn{
  width:52px;
  height:52px;

  border:none;

  border-radius:50%;

  background:
  linear-gradient(
  180deg,
  rgba(255,255,255,0.82),
  rgba(255,255,255,0.42));

  border:1px solid rgba(255,255,255,0.75);

  backdrop-filter:blur(20px);

  box-shadow:
  0 8px 24px rgba(190,160,120,0.12),
  inset 0 2px 4px rgba(255,255,255,0.95);

  color:#082b67;

  font-size:22px;

  display:flex;
  align-items:center;
  justify-content:center;

  cursor:pointer;
}

/* BRAND */

.brand{
  position:absolute;

  left:50%;
  transform:translateX(-50%);

  font-family:Georgia,serif;

  font-size:18px;

  font-weight:600;

  color:#082b67;
}

/* HERO */

.hero{
  height:calc(100vh - 90px);

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  padding-bottom:90px;

  position:relative;
  z-index:5;
}

/* LOGO */

.logo-wrapper{
  position:relative;

  width:260px;
  height:260px;

  display:flex;
  align-items:center;
  justify-content:center;
}

/* RINGS */

.ring{
  position:absolute;

  border-radius:50%;

  border:1px solid rgba(255,255,255,0.12);
}

.ring1{
  width:220px;
  height:220px;
}

.ring2{
  width:270px;
  height:270px;
}

.ring3{
  width:320px;
  height:320px;
}

/* ORB */

.logo-orb{
  width:170px;
  height:170px;

  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  background:
  linear-gradient(
  180deg,
  rgba(255,255,255,0.88),
  rgba(255,255,255,0.46));

  border:1px solid rgba(255,255,255,0.82);

  backdrop-filter:blur(25px);

  box-shadow:
  0 0 40px rgba(255,255,255,0.45),
  0 14px 40px rgba(214,184,146,0.10),
  inset 0 2px 10px rgba(255,255,255,0.95);

  position:relative;

  overflow:hidden;
}

/* REFLECTION */

.logo-orb::before{
  content:"";

  position:absolute;

  width:90px;
  height:180px;

  background:rgba(255,255,255,0.14);

  left:-5px;
  top:-20px;

  transform:rotate(18deg);

  filter:blur(10px);
}

/* INFINITY */

.infinity{
  font-size:92px;

  font-weight:700;

  color:#082b67;
}

/* TITLE */

.title{
  margin-top:-6px;

  font-size:38px;

  line-height:1;

  font-family:Georgia,serif;

  font-weight:700;

  color:#082b67;

  letter-spacing:-0.04em;
}

.spark{
  color:#d4aa5c;
}

/* DIVIDER */

.divider{
  margin-top:16px;

  display:flex;
  align-items:center;
  gap:12px;
}

.line{
  width:70px;
  height:1px;

  background:#d4aa5c;

  opacity:0.45;
}

.small-star{
  color:#d4aa5c;

  font-size:16px;
}

/* SUBTITLE */

.subtitle{
  margin-top:10px;

  font-size:18px;

  font-family:Georgia,serif;

  color:#b58b45;
}

/* BOTTOM BAR */

.bottom-bar{
  position:absolute;

  left:18px;
  right:18px;
  bottom:18px;

  z-index:10;
}

/* INPUT BOX */

.input-box{
  height:72px;

  border-radius:999px;

  background:
  linear-gradient(
  180deg,
  rgba(255,255,255,0.82),
  rgba(255,255,255,0.42));

  border:1px solid rgba(255,255,255,0.82);

  backdrop-filter:blur(24px);

  box-shadow:
  0 14px 35px rgba(190,160,120,0.12),
  inset 0 1px 3px rgba(255,255,255,0.95);

  display:flex;
  align-items:center;

  padding:0 12px;

  gap:10px;

  position:relative;

  overflow:hidden;
}

/* REFLECTION */

.input-box::before{
  content:"";

  position:absolute;

  width:120px;
  height:200px;

  background:rgba(255,255,255,0.14);

  left:60px;
  top:-30px;

  transform:rotate(18deg);

  filter:blur(10px);
}

/* BUTTONS */

.attach-btn,
.send-btn{
  width:46px;
  height:46px;

  border:none;

  border-radius:50%;

  flex-shrink:0;

  cursor:pointer;
}

/* ATTACH */

.attach-btn{
  background:
  linear-gradient(
  180deg,
  rgba(255,255,255,0.9),
  rgba(255,255,255,0.5));

  color:#b58b45;

  font-size:20px;

  box-shadow:
  0 6px 16px rgba(181,139,69,0.10);

  z-index:2;
}

/* SEND */

.send-btn{
  background:
  linear-gradient(
  180deg,
  #f0d5a2,
  #e5bf78);

  color:#8a5f1c;

  font-size:22px;

  box-shadow:
  0 8px 18px rgba(181,139,69,0.16);

  z-index:2;
}

/* INPUT */

.input-box input{
  flex:1;

  border:none;
  outline:none;

  background:transparent;

  font-size:15px;

  color:#7d7268;

  z-index:2;
}

.input-box input::placeholder{
  color:#8f847a;
}

</style>
</head>

<body>

<div class="app">

  <header class="topbar">

    <button class="glass-btn">
      ☰
    </button>

    <div class="brand">
      Sanitas Melete
    </div>

    <button class="glass-btn">
      ∞
    </button>

  </header>

  <section class="hero">

    <div class="logo-wrapper">

      <div class="ring ring1"></div>
      <div class="ring ring2"></div>
      <div class="ring ring3"></div>

      <div class="logo-orb">
        <div class="infinity">∞</div>
      </div>

    </div>

    <div class="title">
      Hi iam mebi<span class="spark">✦</span>
    </div>

    <div class="divider">

      <div class="line"></div>

      <div class="small-star">
        ✦
      </div>

      <div class="line"></div>

    </div>

    <div class="subtitle">
      your study buddy
    </div>

  </section>

  <div class="bottom-bar">

    <div class="input-box">

      <button class="attach-btn">
        ⎋
      </button>

      <input
      type="text"
      placeholder="Put your documents or photos..."
      >

      <button class="send-btn">
        ↑
      </button>

    </div>

  </div>

</div>

</body>
</html>
