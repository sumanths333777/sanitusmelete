<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta
  name="viewport"
  content="width=device-width, initial-scale=1, maximum-scale=1"
/>

<title>Sanitas Melete AI</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#efe1d2;
  overflow:hidden;
  font-family:'Poppins',sans-serif;
}

/* MAIN APP */

.app{
  width:100%;
  height:100vh;
  overflow:hidden;
  position:relative;

  background:
  radial-gradient(circle at top,
  #f8eee2 0%,
  #efe1d2 45%,
  #eadbc9 100%);
}

/* TOP BAR */

.top-bar{
  width:100%;
  display:flex;
  justify-content:space-between;
  align-items:center;

  padding:24px 20px 0;
}

.left-top{
  display:flex;
  align-items:center;
  gap:14px;
}

/* PREMIUM GLASS BUTTON */

.glass-btn{
  width:46px;
  height:46px;
  border-radius:50%;

  background:
  linear-gradient(
  145deg,
  rgba(255,255,255,0.72),
  rgba(255,255,255,0.18)
  );

  border:1px solid rgba(255,255,255,0.65);

  backdrop-filter:blur(10px);

  box-shadow:
  inset 0 1px 1px rgba(255,255,255,0.8),
  0 8px 20px rgba(180,140,100,0.10);

  display:flex;
  align-items:center;
  justify-content:center;

  flex-shrink:0;
}

.glass-btn i{
  color:#062d71;
  font-style:normal;
  font-size:21px;
  font-weight:600;
}

/* BRAND */

.brand{
  color:#062d71;
  font-size:15px;
  font-family:'Cormorant Garamond',serif;
  font-weight:600;
  line-height:1;
}

/* CENTER AREA */

.center{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);

  width:100%;
  text-align:center;
  padding:0 22px;
}

/* LOGO RING */

.logo-ring{
  width:210px;
  height:210px;
  margin:auto;
  border-radius:50%;

  background:
  linear-gradient(
  145deg,
  rgba(255,255,255,0.24),
  rgba(255,255,255,0.06)
  );

  border:1px solid rgba(255,255,255,0.45);

  position:relative;

  display:flex;
  align-items:center;
  justify-content:center;

  box-shadow:
  inset 0 0 16px rgba(255,255,255,0.22),
  0 0 40px rgba(255,255,255,0.08);
}

.logo-ring::before{
  content:'';
  position:absolute;

  width:260px;
  height:260px;

  border-radius:50%;

  background:rgba(255,255,255,0.05);

  filter:blur(2px);
}

/* INFINITY */

.infinity{
  font-size:100px;
  color:#062d71;
  z-index:2;
}

/* TITLE */

.hero-title{
  margin-top:26px;

  color:#062d71;

  font-size:29px;

  font-family:'Cormorant Garamond',serif;

  font-weight:700;

  line-height:1;
}

.spark{
  color:#c79a3d;
}

/* DIVIDER */

.divider{
  width:170px;

  margin:10px auto;

  display:flex;
  align-items:center;
  justify-content:center;

  gap:10px;
}

.divider span{
  width:56px;
  height:1px;
  background:#c79a3d;
}

.divider p{
  color:#c79a3d;
  font-size:15px;
}

/* SUBTEXT */

.sub{
  color:#b78633;

  font-size:17px;

  font-family:'Cormorant Garamond',serif;

  line-height:1;
}

/* SEARCH BAR */

.search-wrap{
  position:absolute;

  bottom:12px;
  left:50%;

  transform:translateX(-50%);

  width:92%;
  height:74px;

  border-radius:28px;

  padding:0 14px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  background:
  linear-gradient(
  145deg,
  rgba(255,255,255,0.55),
  rgba(255,255,255,0.18)
  );

  border:1px solid rgba(255,255,255,0.7);

  backdrop-filter:blur(14px);

  box-shadow:
  inset 0 0 10px rgba(255,255,255,0.45),
  0 12px 24px rgba(180,140,100,0.12);
}

.search-left{
  display:flex;
  align-items:center;
  gap:12px;
}

/* SEARCH BUTTONS */

.circle-btn{
  width:46px;
  height:46px;

  border-radius:50%;

  background:
  linear-gradient(
  145deg,
  rgba(255,255,255,0.72),
  rgba(255,255,255,0.22)
  );

  border:1px solid rgba(255,255,255,0.7);

  display:flex;
  align-items:center;
  justify-content:center;

  flex-shrink:0;

  box-shadow:
  inset 0 0 8px rgba(255,255,255,0.55),
  0 6px 18px rgba(180,140,100,0.10);
}

.circle-btn span{
  font-size:24px;
  color:#b8862e;
}

/* PLACEHOLDER */

.placeholder{
  color:#7c746c;
  font-size:14px;
  white-space:nowrap;
}

</style>
</head>

<body>

<div class="app">

  <!-- TOP BAR -->

  <div class="top-bar">

    <div class="left-top">

      <div class="glass-btn">
        <i>☰</i>
      </div>

      <div class="brand">
        Sanitas Melete
      </div>

    </div>

    <div class="glass-btn">
      <i>∞</i>
    </div>

  </div>

  <!-- CENTER -->

  <div class="center">

    <div class="logo-ring">
      <div class="infinity">∞</div>
    </div>

    <div class="hero-title">
      Hi iam mebi<span class="spark">✦</span>
    </div>

    <div class="divider">
      <span></span>
      <p>✦</p>
      <span></span>
    </div>

    <div class="sub">
      your study buddy
    </div>

  </div>

  <!-- SEARCH BAR -->

  <div class="search-wrap">

    <div class="search-left">

      <div class="circle-btn">
        <span>⌘</span>
      </div>

      <div class="placeholder">
        type your questions here
      </div>

    </div>

    <div class="circle-btn">
      <span>↑</span>
    </div>

  </div>

</div>

</body>
</html>
