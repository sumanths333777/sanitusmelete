<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>SANITAS MELETE – MEBI AI</title>

<link rel="icon" href="favicon.ico"/>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:
-apple-system,
BlinkMacSystemFont,
"Segoe UI",
sans-serif;

background:
linear-gradient(
180deg,
#f8f4ed 0%,
#f4ede4 100%
);

display:flex;
justify-content:center;

color:#111827;

overflow:hidden;
}

/* APP */

.app{

width:100%;
max-width:430px;

height:100vh;

position:relative;

overflow:hidden;

background:
linear-gradient(
180deg,
#fbf7f1 0%,
#f6efe6 100%
);
}

/* SOFT GLOW */

.app::before{

content:"";

position:absolute;
inset:0;

background:

radial-gradient(circle at 20% 20%,
rgba(255,255,255,.9),
transparent 15%),

radial-gradient(circle at 80% 30%,
rgba(255,255,255,.5),
transparent 18%),

radial-gradient(circle at 85% 80%,
rgba(255,255,255,.4),
transparent 20%);

pointer-events:none;
}

/* TOPBAR */

.topbar{

height:88px;

margin:16px;

padding:0 18px;

display:flex;
align-items:center;
justify-content:space-between;

background:
rgba(255,255,255,.5);

backdrop-filter:blur(24px);

border-radius:32px;

border:
1px solid rgba(255,255,255,.7);

box-shadow:
0 12px 30px rgba(0,0,0,.04);

position:relative;
z-index:10;
}

.top-left{

display:flex;
align-items:center;
gap:14px;
}

.icon-btn{

border:none;
background:transparent;

font-size:28px;

cursor:pointer;

color:#111827;
}

.logo-row{

display:flex;
align-items:center;
gap:12px;
}

.logo-small{

font-size:46px;
font-weight:800;

color:#082b83;
}

.brand-text{

font-size:16px;
font-weight:800;

line-height:1.1;

letter-spacing:.08em;

color:#0f172a;
}

.profile{

padding:16px 18px;

border-radius:22px;

background:
rgba(255,255,255,.65);

font-size:15px;
font-weight:700;

box-shadow:
0 6px 20px rgba(0,0,0,.04);
}

/* MAIN */

.main{

padding:10px 18px 120px;

display:flex;
flex-direction:column;
align-items:center;

overflow-y:auto;
overflow-x:hidden;

height:calc(100vh - 90px);

position:relative;
z-index:2;
}

/* BIG LOGO */

.logo-big{

width:120px;
height:120px;

border-radius:50%;

display:flex;
align-items:center;
justify-content:center;

font-size:58px;
font-weight:800;

color:#082b83;

background:
rgba(255,255,255,.5);

backdrop-filter:blur(20px);

border:
1px solid rgba(255,255,255,.75);

box-shadow:
0 18px 40px rgba(0,0,0,.06);

margin-top:8px;

animation:floatInfinity 4s ease-in-out infinite;
}

@keyframes floatInfinity{

0%{
transform:translateY(0);
}

50%{
transform:translateY(-7px);
}

100%{
transform:translateY(0);
}
}

/* HELLO */

.hello{

margin-top:28px;

font-size:56px;
font-weight:800;

letter-spacing:-3px;

line-height:1.05;

text-align:center;

color:#071133;
}

.hello span{

background:
linear-gradient(
90deg,
#d6a63b,
#f0d27c
);

-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.sub{

margin-top:10px;

font-size:18px;

color:#6b7280;

text-align:center;

line-height:1.5;
}

/* CHAT */

.chat-area{

width:100%;

margin-top:24px;
}

.bubble.bot{

width:100%;

background:
rgba(255,255,255,.52);

backdrop-filter:blur(18px);

border-radius:28px;

padding:20px;

font-size:16px;

line-height:1.7;

border:
1px solid rgba(255,255,255,.75);

box-shadow:
0 10px 30px rgba(0,0,0,.04);

color:#111827;
}

/* TRY */

.quick-title{

width:100%;

margin-top:26px;
margin-bottom:16px;

font-size:20px;
font-weight:700;

color:#7c6752;
}

/* GRID */

.quick-grid{

width:100%;

display:grid;

grid-template-columns:
repeat(2,minmax(0,1fr));

gap:14px;
}

/* CARDS */

.quick-card{

width:100%;

min-width:0;

height:170px;

padding:18px;

border-radius:28px;

background:
rgba(255,255,255,.52);

backdrop-filter:blur(20px);

border:
1px solid rgba(255,255,255,.75);

display:flex;
flex-direction:column;
justify-content:space-between;

box-shadow:
0 10px 25px rgba(0,0,0,.04);

overflow:hidden;
}

.card-icon{

width:52px;
height:52px;

border-radius:18px;

display:flex;
align-items:center;
justify-content:center;

font-size:24px;
}

.yellow{
background:#fff0cb;
}

.purple{
background:#efd9ff;
}

.green{
background:#ebffd9;
}

.blue{
background:#dce8ff;
}

.quick-card h3{

font-size:18px;

line-height:1.4;

font-weight:700;
}

.quick-card span{

font-size:30px;
}

/* INPUT */

.bottombar{

position:absolute;

bottom:16px;

width:100%;

padding:0 18px;
}

.input-row{

height:74px;

background:
rgba(255,255,255,.65);

backdrop-filter:blur(24px);

border-radius:999px;

display:flex;
align-items:center;

padding:0 10px 0 18px;

border:
1px solid rgba(255,255,255,.75);

box-shadow:
0 12px 30px rgba(0,0,0,.05);
}

.upload-btn{

border:none;
background:transparent;

font-size:24px;

margin-right:10px;

cursor:pointer;
}

.input-row input{

flex:1;

border:none;
outline:none;

background:transparent;

font-size:16px;

color:#6b7280;
}

.mic-btn{

border:none;
background:transparent;

font-size:22px;

margin-right:10px;

cursor:pointer;
}

.send-btn{

width:58px;
height:58px;

border-radius:50%;

border:none;

background:#082b83;

color:white;

font-size:22px;

cursor:pointer;

box-shadow:
0 10px 24px rgba(8,43,131,.3);
}

/* MOBILE */

@media(max-width:480px){

.hello{
font-size:50px;
}

.logo-big{

width:110px;
height:110px;

font-size:52px;
}

.quick-card{

height:160px;
}

.quick-card h3{

font-size:16px;
}
}

</style>
</head>

<body>

<div class="app">

<header class="topbar">

<div class="top-left">

<button class="icon-btn">☰</button>

<div class="logo-row">

<div class="logo-small">∞</div>

<div class="brand-text">
SANITAS<br>
MELETE AI
</div>

</div>

</div>

<div class="profile">SK</div>

</header>

<main class="main">

<div class="logo-big">∞</div>

<div class="hello">
Hi, I'm <span>MEBI</span> 👋
</div>

<div class="sub">
Your AI study buddy for NEET & JEE ✨
</div>

<div class="chat-area">

<div class="bubble bot">
I’m MEBI, your study buddy.<br>
Ask doubts, request MCQs, or send images.
</div>

</div>

<div class="quick-title">
✨ Try asking me
</div>

<div class="quick-grid">

<div class="quick-card">

<div class="card-icon yellow">❓</div>

<h3>Explain this concept</h3>

<span>→</span>

</div>

<div class="quick-card">

<div class="card-icon purple">📄</div>

<h3>Generate MCQs</h3>

<span>→</span>

</div>

<div class="quick-card">

<div class="card-icon green">⚛️</div>

<h3>Solve this problem</h3>

<span>→</span>

</div>

<div class="quick-card">

<div class="card-icon blue">☁️</div>

<h3>Upload image</h3>

<span>→</span>

</div>

</div>

</main>

<footer class="bottombar">

<div class="input-row">

<button class="upload-btn">📎</button>

<input
type="text"
placeholder="Type your question here..."
/>

<button class="send-btn">➤</button>

</div>

</footer>

</div>

</body>
</html>
