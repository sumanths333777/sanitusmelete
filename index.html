<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>SANITAS MELETE – MEBI AI</title>

<link rel="icon" href="favicon.ico"/>

<style>

/* RESET */

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html,body{
min-height:100%;
overflow-x:hidden;
}

body{

font-family:
-apple-system,
BlinkMacSystemFont,
"Segoe UI",
sans-serif;

background:
linear-gradient(
180deg,
#faf6ef 0%,
#f2ebe2 100%
);

display:flex;
justify-content:center;

color:#111827;
}

/* APP */

.app{

width:100%;
max-width:430px;

min-height:100vh;

position:relative;

overflow:hidden;

padding-bottom:90px;

background:
linear-gradient(
180deg,
#faf6ef 0%,
#f2ebe2 100%
);
}

/* GLOW */

.app::before{

content:"";

position:absolute;
inset:0;

background:

radial-gradient(circle at 20% 20%,
rgba(255,255,255,.95),
transparent 12%),

radial-gradient(circle at 80% 30%,
rgba(255,255,255,.55),
transparent 16%),

radial-gradient(circle at 85% 75%,
rgba(255,255,255,.45),
transparent 18%);

pointer-events:none;
opacity:.8;
}

/* DESKTOP */

@media(min-width:900px){

body{
padding:24px;
align-items:center;
}

.app{

max-width:430px;

min-height:95vh;

border-radius:42px;

overflow:hidden;

box-shadow:
0 30px 80px rgba(0,0,0,.12);

border:
1px solid rgba(255,255,255,.7);
}
}

/* TOPBAR */

.topbar{

height:74px;

margin:14px 16px;

padding:0 18px;

display:flex;
align-items:center;
justify-content:space-between;

background:
rgba(255,255,255,.42);

backdrop-filter:blur(24px);

border-radius:28px;

border:
1px solid rgba(255,255,255,.75);

box-shadow:
0 8px 24px rgba(0,0,0,.04);

position:relative;
z-index:10;
}

.top-left{

display:flex;
align-items:center;
gap:14px;
}

.icon-btn{

border:none;
background:transparent;

font-size:28px;

cursor:pointer;

color:#111827;
}

.brand{

display:flex;
align-items:center;
gap:10px;
}

.logo-small{

font-size:42px;
font-weight:800;

color:#082b83;
}

.brand-text{

font-size:13px;
font-weight:800;

line-height:1.15;

letter-spacing:1px;
}

/* RIGHT */

.top-right{

display:flex;
align-items:center;
gap:10px;
}

.profile{

width:72px;
height:46px;

border-radius:999px;

display:flex;
align-items:center;
justify-content:center;

background:
rgba(255,255,255,.72);

font-size:15px;
font-weight:700;

box-shadow:
0 4px 12px rgba(0,0,0,.03);
}

/* MAIN */

.main{

padding:0 20px 92px;

display:flex;
flex-direction:column;
align-items:center;

gap:14px;

position:relative;
z-index:2;
}

/* BIG LOGO */

.logo-big{

width:190px;
height:190px;

margin-top:34px;

border-radius:50%;

display:flex;
align-items:center;
justify-content:center;

font-size:96px;
font-weight:800;

color:#082b83;

background:
rgba(255,255,255,.40);

backdrop-filter:blur(20px);

border:
1px solid rgba(255,255,255,.8);

box-shadow:
0 18px 45px rgba(0,0,0,.05),
inset 0 1px 1px rgba(255,255,255,.9);

animation:floaty 4s ease-in-out infinite;
}

@keyframes floaty{

0%{
transform:translateY(0);
}

50%{
transform:translateY(-6px);
}

100%{
transform:translateY(0);
}
}

/* HELLO */

.hello{

font-size:52px;

font-weight:800;

letter-spacing:-2px;

line-height:1.02;

text-align:center;

color:#071133;

margin-top:10px;
}

.hello span{

background:
linear-gradient(
90deg,
#d6a63b,
#f3d882
);

-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

/* SUB */

.sub{

font-size:17px;

color:#6b7280;

text-align:center;

margin-top:-2px;
}

/* CHAT */

.chat-area{

width:100%;

margin-top:18px;
}

.bubble.bot{

width:100%;

background:
rgba(255,255,255,.42);

backdrop-filter:blur(20px);

border-radius:24px;

padding:16px;

display:flex;
gap:14px;

border:
1px solid rgba(255,255,255,.75);

box-shadow:
0 10px 25px rgba(0,0,0,.04);
}

.bot-icon{

width:48px;
height:48px;

border-radius:16px;

background:#fff2d5;

display:flex;
align-items:center;
justify-content:center;

font-size:22px;
}

.bot-content h3{

font-size:16px;

margin-bottom:6px;
}

.bot-content p{

font-size:14px;

line-height:1.6;

color:#4b5563;
}

/* TRY */

.quick-title{

width:100%;

margin-top:18px;
margin-bottom:8px;

font-size:21px;
font-weight:700;

color:#7c6752;
}

/* GRID */

.quick-grid{

width:100%;

display:grid;

grid-template-columns:
repeat(4,1fr);

gap:10px;
}

/* CARD */

.quick-card{

height:112px;

padding:14px;

border-radius:22px;

background:
rgba(255,255,255,.42);

backdrop-filter:blur(20px);

border:
1px solid rgba(255,255,255,.75);

display:flex;
flex-direction:column;
justify-content:space-between;

box-shadow:
0 10px 25px rgba(0,0,0,.04);
}

.card-icon{

width:42px;
height:42px;

border-radius:14px;

display:flex;
align-items:center;
justify-content:center;

font-size:18px;
}

.yellow{
background:#fff0cd;
}

.purple{
background:#efd8ff;
}

.green{
background:#ecffd7;
}

.blue{
background:#dce6ff;
}

.quick-card h3{

font-size:13px;

line-height:1.3;
}

.quick-card span{

font-size:22px;
}

/* INPUT */

.bottombar{

position:fixed;

bottom:10px;

width:100%;
max-width:430px;

padding:0 16px;

z-index:100;
}

.input-row{

height:62px;

background:
rgba(255,255,255,.52);

backdrop-filter:blur(22px);

border-radius:999px;

display:flex;
align-items:center;

padding:0 10px 0 16px;

border:
1px solid rgba(255,255,255,.75);

box-shadow:
0 12px 30px rgba(0,0,0,.05);
}

.upload-btn{

border:none;
background:transparent;

font-size:24px;

margin-right:8px;

cursor:pointer;
}

.input-row input{

flex:1;

border:none;
outline:none;

background:transparent;

font-size:15px;

color:#6b7280;
}

.send-btn{

width:46px;
height:46px;

border-radius:50%;

border:none;

background:#082b83;

color:white;

font-size:18px;

cursor:pointer;

box-shadow:
0 12px 24px rgba(8,43,131,.3);
}

/* MOBILE */

@media(max-width:480px){

.main{
padding:0 16px 92px;
}

.quick-grid{
grid-template-columns:
repeat(4,1fr);
}
}

</style>
</head>

<body>

<div class="app">

<header class="topbar">

<div class="top-left">

<button class="icon-btn">☰</button>

<div class="brand">

<div class="logo-small">∞</div>

<div class="brand-text">
SANITAS<br>
MELETE AI
</div>

</div>

</div>

<div class="top-right">

<div class="profile">SK∞</div>

</div>

</header>

<main class="main">

<div class="logo-big">∞</div>

<div class="hello">
Hi, I'm <span>MEBI</span> 👋
</div>

<div class="sub">
Your AI study buddy for NEET & JEE ✨
</div>

<div class="chat-area">

<div class="bubble bot">

<div class="bot-icon">✨</div>

<div class="bot-content">

<h3>I’m MEBI, your study buddy.</h3>

<p>
Ask doubts, request MCQs, or send images.
</p>

</div>

</div>

</div>

<div class="quick-title">
✨ Try asking me
</div>

<div class="quick-grid">

<div class="quick-card">

<div class="card-icon yellow">❓</div>

<h3>Explain this concept</h3>

<span>→</span>

</div>

<div class="quick-card">

<div class="card-icon purple">📄</div>

<h3>Generate MCQs</h3>

<span>→</span>

</div>

<div class="quick-card">

<div class="card-icon green">⚛️</div>

<h3>Solve this problem</h3>

<span>→</span>

</div>

<div class="quick-card">

<div class="card-icon blue">☁️</div>

<h3>Upload image</h3>

<span>→</span>

</div>

</div>

</main>

<footer class="bottombar">

<div class="input-row">

<button class="upload-btn">📎</button>

<input
type="text"
placeholder="Type your question here..."
/>

<button class="send-btn">➤</button>

</div>

</footer>

</div>

</body>
</html>
