<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Sanitas Melete AI</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

html,body{
width:100%;
height:100%;
overflow:hidden;
font-family:'Poppins',sans-serif;
}

body{
background:#efe3d6;
}

/* MAIN */

.app{
width:100%;
height:100dvh;
position:relative;
overflow:hidden;

background:
radial-gradient(circle at top,
#f8eee4 0%,
#efe3d6 45%,
#eadccd 100%);
}

/* TOP BAR */

.top-bar{
width:100%;
display:flex;
justify-content:space-between;
align-items:center;

padding:22px 18px 0;

position:fixed;
top:0;
left:0;
z-index:100;
}

/* LEFT */

.left-top{
display:flex;
align-items:center;
gap:14px;
}

/* BUTTON */

.glass-btn{
width:46px;
height:46px;

border-radius:50%;

display:flex;
align-items:center;
justify-content:center;

background:
linear-gradient(
145deg,
rgba(255,255,255,0.75),
rgba(255,255,255,0.18)
);

border:1px solid rgba(255,255,255,0.72);

backdrop-filter:blur(18px);

box-shadow:
inset 0 1px 1px rgba(255,255,255,0.8),
0 8px 22px rgba(180,140,100,0.10);

cursor:pointer;
}

.glass-btn i{
font-style:normal;
color:#062d71;
font-size:20px;
}

/* BRAND */

.brand{
color:#062d71;
font-size:15px;
font-family:'Cormorant Garamond',serif;
font-weight:600;
}

/* HERO */

.center{
position:absolute;

top:48%;
left:50%;

transform:translate(-50%,-50%);

width:100%;

text-align:center;

transition:.4s ease;
z-index:5;
}

/* HIDE HERO */

.center.hide{
opacity:0;
pointer-events:none;
transform:
translate(-50%,-55%);
}

/* LOGO */

.logo-ring{
width:190px;
height:190px;

margin:auto;

border-radius:50%;

position:relative;

display:flex;
align-items:center;
justify-content:center;

background:
linear-gradient(
145deg,
rgba(255,255,255,0.24),
rgba(255,255,255,0.05)
);

border:1px solid rgba(255,255,255,0.48);

box-shadow:
inset 0 0 18px rgba(255,255,255,0.25),
0 0 45px rgba(255,255,255,0.08);
}

.logo-ring::before{
content:'';

position:absolute;

width:240px;
height:240px;

border-radius:50%;

background:rgba(255,255,255,0.05);

filter:blur(2px);
}

.infinity{
font-size:92px;
color:#062d71;
z-index:2;
}

/* TITLE */

.hero-title{
margin-top:24px;

color:#062d71;

font-size:32px;

font-family:'Cormorant Garamond',serif;

font-weight:700;
}

.spark{
color:#c79a3d;
}

/* DIVIDER */

.divider{
width:170px;

margin:12px auto;

display:flex;
align-items:center;
justify-content:center;

gap:10px;
}

.divider span{
width:55px;
height:1px;
background:#c79a3d;
}

.divider p{
color:#c79a3d;
font-size:14px;
}

/* SUB */

.sub{
color:#b78633;

font-size:18px;

font-family:'Cormorant Garamond',serif;
}

/* CHAT SCREEN */

.chat-screen{
position:absolute;

top:92px;
left:0;

width:100%;
height:calc(100dvh - 180px);

overflow-y:auto;

padding:
20px 16px
50px;

scroll-behavior:smooth;
}

.chat-screen::-webkit-scrollbar{
width:0;
}

/* MESSAGES */

.messages{
width:100%;

display:flex;
flex-direction:column;

gap:18px;

padding-top:420px;
padding-bottom:30px;
}

/* MESSAGE */

.msg{
max-width:84%;

padding:16px 18px;

border-radius:24px;

font-size:15px;

line-height:1.7;

animation:fadeUp .3s ease;

word-wrap:break-word;
}

/* USER */

.user-msg{
align-self:flex-end;

background:#062d71;

color:white;

border-bottom-right-radius:8px;

box-shadow:
0 10px 24px rgba(6,45,113,0.16);
}

/* AI */

.ai-msg{
align-self:flex-start;

background:
linear-gradient(
145deg,
rgba(255,255,255,0.72),
rgba(255,255,255,0.22)
);

border:1px solid rgba(255,255,255,0.65);

backdrop-filter:blur(18px);

color:#222;

border-bottom-left-radius:8px;

box-shadow:
inset 0 0 8px rgba(255,255,255,0.4),
0 8px 24px rgba(0,0,0,0.04);
}

/* SEARCH BAR */

.search-wrap{
position:fixed;

left:50%;
bottom:12px;

transform:translateX(-50%);

width:93%;
height:72px;

border-radius:28px;

padding:0 12px;

display:flex;
align-items:center;
justify-content:space-between;

z-index:200;

background:
linear-gradient(
145deg,
rgba(255,255,255,0.58),
rgba(255,255,255,0.18)
);

border:1px solid rgba(255,255,255,0.72);

backdrop-filter:blur(18px);

box-shadow:
inset 0 0 12px rgba(255,255,255,0.4),
0 12px 28px rgba(180,140,100,0.10);
}

/* LEFT */

.search-left{
display:flex;
align-items:center;
gap:12px;
flex:1;
}

/* CIRCLE */

.circle-btn{
width:48px;
height:48px;

border-radius:50%;

display:flex;
align-items:center;
justify-content:center;

background:
linear-gradient(
145deg,
rgba(255,255,255,0.72),
rgba(255,255,255,0.20)
);

border:1px solid rgba(255,255,255,0.7);

box-shadow:
inset 0 0 8px rgba(255,255,255,0.5),
0 5px 16px rgba(180,140,100,0.10);

cursor:pointer;
}

.circle-btn span{
color:#b8862e;
font-size:22px;
}

/* INPUT */

.search-left input{
width:100%;

border:none;
outline:none;

background:transparent;

font-size:15px;

color:#333;

font-family:'Poppins',sans-serif;
}

.search-left input::placeholder{
color:#7d756e;
}

/* MENU */

.menu-overlay{
position:fixed;
inset:0;

background:rgba(0,0,0,0.08);

backdrop-filter:blur(8px);

opacity:0;
visibility:hidden;

transition:.35s ease;

z-index:999;
}

.menu-overlay.active{
opacity:1;
visibility:visible;
}

.side-menu{
position:fixed;

top:0;
left:0;

width:285px;
max-width:82%;

height:100dvh;

padding:18px 14px;

background:
linear-gradient(
145deg,
rgba(255,255,255,0.75),
rgba(255,255,255,0.25)
);

border-right:1px solid rgba(255,255,255,0.7);

backdrop-filter:blur(24px);

box-shadow:
0 10px 40px rgba(0,0,0,0.08);

transform:translateX(-100%);

transition:transform .35s ease;

z-index:1000;

overflow-y:auto;
}

.side-menu.active{
transform:translateX(0);
}

/* PROFILE */

.menu-profile{
display:flex;
justify-content:space-between;
align-items:center;

padding:14px;

border-radius:22px;

background:
linear-gradient(
145deg,
rgba(255,255,255,0.72),
rgba(255,255,255,0.20)
);

border:1px solid rgba(255,255,255,0.7);

margin-bottom:16px;
}

.profile-left{
display:flex;
align-items:center;
gap:10px;
}

.profile-icon{
width:52px;
height:52px;

border-radius:50%;

display:flex;
align-items:center;
justify-content:center;

background:#f5dfba;

font-size:24px;
}

.menu-profile h2{
color:#062d71;

font-size:26px;

font-family:'Cormorant Garamond',serif;
}

.menu-profile p{
color:#b8862e;

font-size:14px;
}

.profile-star{
color:#d4a54f;
font-size:20px;
}

/* ITEMS */

.menu-items{
display:flex;
flex-direction:column;
gap:10px;
}

.menu-item{
height:60px;

padding:0 16px;

border-radius:18px;

display:flex;
align-items:center;

background:
linear-gradient(
145deg,
rgba(255,255,255,0.72),
rgba(255,255,255,0.20)
);

border:1px solid rgba(255,255,255,0.65);

cursor:pointer;
}

.menu-item span{
font-size:20px;
color:#8d847c;
}

.menu-item p{
margin-left:14px;

color:#222;

font-size:16px;

font-family:'Cormorant Garamond',serif;

flex:1;
}

.menu-item i{
font-style:normal;
color:#999;
font-size:22px;
}

/* ANIMATION */

@keyframes fadeUp{

from{
opacity:0;
transform:translateY(20px);
}

to{
opacity:1;
transform:translateY(0);
}

}

</style>
</head>

<body>

<div class="app">

<!-- MENU OVERLAY -->

<div class="menu-overlay" id="menuOverlay" onclick="closeMenu()"></div>

<!-- SIDE MENU -->

<div class="side-menu" id="sideMenu">

<div class="menu-profile">

<div class="profile-left">

<div class="profile-icon">👤</div>

<div>
<h2>SK</h2>
<p>Premium User</p>
</div>

</div>

<div class="profile-star">✦</div>

</div>

<div class="menu-items">

<div class="menu-item">
<span>☷</span>
<p>Dashboard</p>
<i>›</i>
</div>

<div class="menu-item">
<span>💬</span>
<p>My Chats</p>
<i>›</i>
</div>

<div class="menu-item">
<span>📄</span>
<p>My Documents</p>
<i>›</i>
</div>

<div class="menu-item">
<span>🔖</span>
<p>Saved Answers</p>
<i>›</i>
</div>

</div>

</div>

<!-- TOP BAR -->

<div class="top-bar">

<div class="left-top">

<div class="glass-btn" onclick="openMenu()">
<i>☰</i>
</div>

<div class="brand">
Sanitas Melete
</div>

</div>

<div class="glass-btn">
<i>∞</i>
</div>

</div>

<!-- HERO -->

<div class="center" id="hero">

<div class="logo-ring">
<div class="infinity">∞</div>
</div>

<div class="hero-title">
Hi iam mebi<span class="spark">✦</span>
</div>

<div class="divider">
<span></span>
<p>✦</p>
<span></span>
</div>

<div class="sub">
your study buddy
</div>

</div>

<!-- CHAT -->

<div class="chat-screen" id="chatScreen">

<div class="messages" id="messages"></div>

</div>

<!-- SEARCH -->

<div class="search-wrap">

<div class="search-left">

<div class="circle-btn">
<span>⌘</span>
</div>

<input
type="text"
id="prompt"
placeholder="type your questions here"
/>

</div>

<div
class="circle-btn"
onclick="sendMessage()"
>
<span>↑</span>
</div>

</div>

</div>

<script>

/* API KEY */

const API_KEY = "YOUR_GEMINI_API_KEY";

/* ELEMENTS */

const promptInput =
document.getElementById("prompt");

const messages =
document.getElementById("messages");

const hero =
document.getElementById("hero");

const chatScreen =
document.getElementById("chatScreen");

/* SEND */

async function sendMessage(){

const text =
promptInput.value.trim();

if(!text) return;

/* HIDE HERO */

hero.classList.add("hide");

/* USER MESSAGE */

appendMessage(
text,
"user-msg"
);

promptInput.value = "";

/* LOADING */

const loading =
appendMessage(
"Typing...",
"ai-msg"
);

try{

const response =
await fetch(
`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${API_KEY}`,
{
method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

contents:[
{
parts:[
{
text:text
}
]
}
]

})

}
);

const data =
await response.json();

loading.remove();

const reply =
data?.candidates?.[0]
?.content?.parts?.[0]
?.text
||
"No response.";

/* AI MESSAGE */

appendMessage(
reply,
"ai-msg"
);

}catch(error){

loading.innerText =
"Error loading response.";

}

/* AUTO SCROLL */

chatScreen.scrollTop =
chatScreen.scrollHeight;

}

/* APPEND */

function appendMessage(
text,
className
){

const div =
document.createElement("div");

div.className =
`msg ${className}`;

div.innerText = text;

messages.appendChild(div);

chatScreen.scrollTop =
chatScreen.scrollHeight;

return div;

}

/* ENTER */

promptInput.addEventListener(
"keypress",
function(e){

if(e.key === "Enter"){
sendMessage();
}

}
);

/* MENU */

const sideMenu =
document.getElementById("sideMenu");

const menuOverlay =
document.getElementById("menuOverlay");

function openMenu(){

sideMenu.classList.add("active");

menuOverlay.classList.add("active");

}

function closeMenu(){

sideMenu.classList.remove("active");

menuOverlay.classList.remove("active");

}

/* SWIPE */

let startX = 0;

document.addEventListener(
"touchstart",
e=>{

startX =
e.touches[0].clientX;

}
);

document.addEventListener(
"touchmove",
e=>{

let moveX =
e.touches[0].clientX;

if(startX < 30 && moveX > 100){
openMenu();
}

if(startX > 250 && moveX < 120){
closeMenu();
}

}
);

</script>

</body>
</html>
