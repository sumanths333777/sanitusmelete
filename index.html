<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Sanitas Melete</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:
  -apple-system,
  BlinkMacSystemFont,
  "SF Pro Display",
  "Segoe UI",
  sans-serif;

  background:#f3e7da;

  overflow:hidden;
}

/* ========================= */
/* APP */
/* ========================= */

.app{
  width:100%;
  height:100vh;

  background:
  radial-gradient(circle at top,#f7ede3 0%,#f3e7da 55%,#efe2d5 100%);

  position:relative;

  overflow:hidden;
}

/* SOFT LIGHT */

.app::before{
  content:"";

  position:absolute;
  top:120px;
  left:50%;

  transform:translateX(-50%);

  width:420px;
  height:420px;

  border-radius:50%;

  background:rgba(255,255,255,0.18);

  filter:blur(80px);

  pointer-events:none;
}

/* ========================= */
/* TOPBAR */
/* ========================= */

.topbar{
  height:92px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 22px;

  position:relative;
  z-index:5;
}

.top-left{
  display:flex;
  align-items:center;
  gap:14px;
}

/* BUTTONS */

.icon-btn{
  width:58px;
  height:58px;

  border:none;

  border-radius:50%;

  color:#082b67;

  font-size:24px;

  background:
  linear-gradient(
  180deg,
  rgba(255,255,255,0.82),
  rgba(255,255,255,0.42));

  backdrop-filter:blur(20px);

  border:1px solid rgba(255,255,255,0.7);

  box-shadow:
  0 10px 30px rgba(190,160,120,0.18),
  inset 0 2px 4px rgba(255,255,255,0.95);

  cursor:pointer;
}

/* TITLE */

.brand-text{
  font-family:Georgia,serif;

  font-size:20px;

  font-weight:600;

  color:#082b67;

  letter-spacing:-0.03em;
}

/* ========================= */
/* MAIN */
/* ========================= */

.main{
  height:calc(100vh - 92px);

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  padding-bottom:120px;

  position:relative;
}

/* ========================= */
/* LOGO */
/* ========================= */

.logo-wrapper{
  position:relative;

  width:340px;
  height:340px;

  display:flex;
  align-items:center;
  justify-content:center;

  margin-top:-10px;
}

/* RINGS */

.ring{
  position:absolute;

  border-radius:50%;

  border:1px solid rgba(255,255,255,0.16);
}

.ring1{
  width:240px;
  height:240px;
}

.ring2{
  width:300px;
  height:300px;
}

.ring3{
  width:360px;
  height:360px;
}

/* ORB */

.logo-orb{
  width:220px;
  height:220px;

  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  background:
  linear-gradient(
  180deg,
  rgba(255,255,255,0.92),
  rgba(255,255,255,0.52));

  border:1px solid rgba(255,255,255,0.85);

  backdrop-filter:blur(25px);

  box-shadow:
  0 0 60px rgba(255,255,255,0.7),
  0 20px 60px rgba(214,184,146,0.18),
  inset 0 2px 10px rgba(255,255,255,0.95);

  overflow:hidden;

  position:relative;
}

/* REFLECTION */

.logo-orb::before{
  content:"";

  position:absolute;

  width:120px;
  height:240px;

  background:rgba(255,255,255,0.22);

  top:-20px;
  left:-5px;

  transform:rotate(18deg);

  filter:blur(10px);
}

/* INFINITY */

.infinity{
  font-size:120px;

  font-weight:700;

  color:#082b67;

  filter:
  drop-shadow(
  0 6px 14px rgba(11,43,103,0.14));
}

/* ========================= */
/* TEXTS */
/* ========================= */

.hello{
  margin-top:10px;

  font-size:62px;

  line-height:1;

  font-family:Georgia,serif;

  font-weight:700;

  letter-spacing:-0.05em;

  color:#082b67;
}

.spark{
  color:#d4aa5c;
}

/* DIVIDER */

.divider{
  display:flex;
  align-items:center;
  gap:14px;

  margin-top:20px;
}

.line{
  width:90px;
  height:1px;

  background:#d4aa5c;

  opacity:0.5;
}

.small-star{
  color:#d4aa5c;
}

/* SUB */

.sub{
  margin-top:14px;

  font-size:26px;

  font-family:Georgia,serif;

  color:#b88d49;
}

/* ========================= */
/* INPUT BAR */
/* ========================= */

.bottombar{
  position:absolute;

  bottom:24px;
  left:18px;
  right:18px;
}

/* INPUT */

.input-row{
  height:84px;

  border-radius:999px;

  background:
  linear-gradient(
  180deg,
  rgba(255,255,255,0.82),
  rgba(255,255,255,0.42));

  backdrop-filter:blur(25px);

  border:1px solid rgba(255,255,255,0.82);

  box-shadow:
  0 20px 45px rgba(190,160,120,0.18),
  inset 0 1px 3px rgba(255,255,255,0.95);

  padding:0 14px;

  display:flex;
  align-items:center;
  gap:12px;

  overflow:hidden;

  position:relative;
}

/* REFLECTION */

.input-row::before{
  content:"";

  position:absolute;

  width:150px;
  height:220px;

  background:rgba(255,255,255,0.22);

  left:75px;
  top:-40px;

  transform:rotate(18deg);

  filter:blur(12px);
}

/* BUTTONS */

.upload-btn,
.send-btn{
  width:52px;
  height:52px;

  border:none;

  border-radius:50%;

  flex-shrink:0;

  cursor:pointer;
}

/* UPLOAD */

.upload-btn{
  background:
  linear-gradient(
  180deg,
  rgba(255,255,255,0.9),
  rgba(255,255,255,0.5));

  color:#b58b45;

  font-size:22px;

  box-shadow:
  0 8px 20px rgba(181,139,69,0.12);

  z-index:2;
}

/* SEND */

.send-btn{
  background:
  linear-gradient(
  180deg,
  #f0d5a2,
  #e5bf78);

  color:#8a5f1c;

  font-size:22px;

  box-shadow:
  0 10px 25px rgba(181,139,69,0.25);

  z-index:2;
}

/* INPUT FIELD */

.input-row input{
  flex:1;

  border:none;
  outline:none;

  background:transparent;

  font-size:16px;

  color:#7d7268;

  z-index:2;
}

.input-row input::placeholder{
  color:#8f847a;
}

/* ========================= */
/* MOBILE */
/* ========================= */

@media(max-width:480px){

  .brand-text{
    font-size:18px;
  }

  .logo-wrapper{
    transform:scale(0.92);
  }

  .hello{
    font-size:56px;
  }

  .sub{
    font-size:22px;
  }

}

</style>
</head>

<body>

<div class="app">

  <!-- TOPBAR -->

  <header class="topbar">

    <div class="top-left">

      <button class="icon-btn">
        ☰
      </button>

      <div class="brand-text">
        Sanitas Melete
      </div>

    </div>

    <button class="icon-btn">
      ∞
    </button>

  </header>

  <!-- MAIN -->

  <main class="main">

    <div class="logo-wrapper">

      <div class="ring ring1"></div>
      <div class="ring ring2"></div>
      <div class="ring ring3"></div>

      <div class="logo-orb">

        <div class="infinity">
          ∞
        </div>

      </div>

    </div>

    <div class="hello">
      Hi iam mebi<span class="spark">✦</span>
    </div>

    <div class="divider">

      <div class="line"></div>

      <div class="small-star">
        ✦
      </div>

      <div class="line"></div>

    </div>

    <div class="sub">
      your study buddy
    </div>

  </main>

  <!-- INPUT BAR -->

  <footer class="bottombar">

    <div class="input-row">

      <button class="upload-btn">
        ⎋
      </button>

      <input
      type="text"
      placeholder="Put your documents or photos..."
      >

      <button class="send-btn">
        ↑
      </button>

    </div>

  </footer>

</div>

</body>
</html>
