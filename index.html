<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sanitas Melete - Mebi</title>
    <style>
        :root {
            --bg-color: #f5eadd;
            --accent-color: #0d1b3e;
            --glass-bg: rgba(255, 255, 255, 0.3);
            --border-glow: rgba(255, 255, 255, 0.6);
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Georgia', serif;
            background: radial-gradient(circle at center, #fcf6ef 0%, #f5eadd 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(---accent-color);
        }

        .container {
            width: 100%;
            max-width: 400px;
            height: 90vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 40px 20px;
            box-sizing: border-box;
            position: relative;
        }

        /* Top Navigation */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .menu-btn, .infinity-small {
            width: 45px;
            height: 45px;
            background: var(--glass-bg);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05), inset 0 0 10px var(--border-glow);
            border: 1px solid var(--border-glow);
            cursor: pointer;
        }

        .logo-text {
            font-weight: bold;
            font-size: 1.2rem;
            letter-spacing: 0.5px;
        }

        /* Main Content Area */
        .main-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .infinity-circle {
            width: 200px;
            height: 200px;
            background: transparent;
            border-radius: 50%;
            border: 2px solid var(--border-glow);
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 30px rgba(255,255,255,0.8), inset 0 0 20px rgba(255,255,255,0.5);
            margin-bottom: 40px;
        }

        .infinity-symbol {
            font-size: 80px;
            color: var(--accent-color);
        }

        .greeting {
            font-size: 2.2rem;
            margin: 0;
            font-weight: 600;
        }

        .divider {
            width: 100px;
            height: 1px;
            background: linear-gradient(to right, transparent, #c5a880, transparent);
            margin: 15px 0;
            position: relative;
        }

        .divider::after {
            content: '✦';
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 12px;
            color: #c5a880;
        }

        .subtitle {
            color: #c5a880;
            font-style: italic;
            font-size: 1.1rem;
        }

        /* Input Section */
        .input-wrapper {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-glow);
            border-radius: 50px;
            padding: 10px 15px;
            display: flex;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }

        .paperclip {
            background: #fff9f0;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.2rem;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.1);
        }

        input {
            background: transparent;
            border: none;
            padding: 10px 15px;
            flex-grow: 1;
            font-family: 'Georgia', serif;
            font-size: 0.9rem;
            color: #8a7a6a;
        }

        input:focus { outline: none; }

        .send-btn {
            background: #f1dfc4;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            border: none;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <div class="container">
        <header class="header">
            <div class="menu-btn">☰</div>
            <div class="logo-text">Sanitas Melete</div>
            <div class="infinity-small">∞</div>
        </header>

        <main class="main-content">
            <div class="infinity-circle">
                <span class="infinity-symbol">∞</span>
            </div>
            <h1 class="greeting">Hi iam mebi ✨</h1>
            <div class="divider"></div>
            <p class="subtitle">your study buddy</p>
        </main>

        <footer class="input-section">
            <div class="input-wrapper">
                <div class="paperclip">📎</div>
                <input type="text" placeholder="Put your documents or photos...">
                <button class="send-btn">↑</button>
            </div>
        </footer>
    </div>

</body>
</html>
