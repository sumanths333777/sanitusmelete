<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Sanitas Melete AI</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:'Poppins',sans-serif;
}

body{
  background:#efe3d6;
}

.app{
  width:100%;
  height:100dvh;
  position:relative;
  overflow:hidden;

  background:
  radial-gradient(circle at top,
  #f8eee4 0%,
  #efe3d6 45%,
  #eadccd 100%);
}

/* TOP BAR */

.top-bar{
  width:100%;
  display:flex;
  justify-content:space-between;
  align-items:center;

  padding:22px 18px 0;

  position:relative;
  z-index:100;
}

.left-top{
  display:flex;
  align-items:center;
  gap:12px;
}

.glass-btn{
  width:44px;
  height:44px;

  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  background:
  linear-gradient(
  145deg,
  rgba(255,255,255,0.75),
  rgba(255,255,255,0.18)
  );

  border:1px solid rgba(255,255,255,0.72);

  backdrop-filter:blur(18px);

  box-shadow:
  inset 0 1px 1px rgba(255,255,255,0.8),
  0 8px 22px rgba(180,140,100,0.10);

  cursor:pointer;
}

.glass-btn i{
  font-style:normal;
  color:#062d71;
  font-size:20px;
}

.brand{
  color:#062d71;

  font-size:15px;

  font-family:'Cormorant Garamond',serif;

  font-weight:600;
}

/* HERO */

.center{
  position:absolute;

  top:50%;
  left:50%;

  transform:translate(-50%,-50%);

  width:100%;

  text-align:center;

  transition:0.45s ease;

  z-index:10;
}

.center.hide{
  opacity:0;

  transform:
  translate(-50%,-55%);

  pointer-events:none;
}

.logo-ring{
  width:190px;
  height:190px;

  margin:auto;

  border-radius:50%;

  position:relative;

  display:flex;
  align-items:center;
  justify-content:center;

  background:
  linear-gradient(
  145deg,
  rgba(255,255,255,0.24),
  rgba(255,255,255,0.05)
  );

  border:1px solid rgba(255,255,255,0.48);

  box-shadow:
  inset 0 0 18px rgba(255,255,255,0.25),
  0 0 45px rgba(255,255,255,0.08);
}

.logo-ring::before{
  content:'';

  position:absolute;

  width:240px;
  height:240px;

  border-radius:50%;

  background:rgba(255,255,255,0.05);

  filter:blur(2px);
}

.infinity{
  font-size:92px;
  color:#062d71;
  z-index:2;
}

.hero-title{
  margin-top:24px;

  color:#062d71;

  font-size:30px;

  font-family:'Cormorant Garamond',serif;

  font-weight:700;
}

.spark{
  color:#c79a3d;
}

.divider{
  width:170px;

  margin:12px auto;

  display:flex;
  align-items:center;
  justify-content:center;

  gap:10px;
}

.divider span{
  width:55px;
  height:1px;
  background:#c79a3d;
}

.divider p{
  color:#c79a3d;
  font-size:14px;
}

.sub{
  color:#b78633;

  font-size:18px;

  font-family:'Cormorant Garamond',serif;
}

/* CHAT AREA */

.chat-area{
  position:absolute;

  top:90px;
  left:0;

  width:100%;
  height:calc(100dvh - 190px);

  overflow-y:auto;

  padding:20px;

  padding-bottom:120px;

  display:flex;
  flex-direction:column;

  gap:14px;

  z-index:20;
}

.chat-area::-webkit-scrollbar{
  width:0;
}

.bubble{
  max-width:82%;

  padding:14px 18px;

  border-radius:24px;

  line-height:1.7;

  white-space:pre-wrap;

  animation:fadeUp 0.3s ease;
}

.user{
  align-self:flex-end;

  background:#062d71;
  color:white;

  border-bottom-right-radius:8px;
}

.bot{
  align-self:flex-start;

  background:
  linear-gradient(
  145deg,
  rgba(255,255,255,0.72),
  rgba(255,255,255,0.20)
  );

  border:1px solid rgba(255,255,255,0.6);

  backdrop-filter:blur(18px);

  color:#062d71;

  border-bottom-left-radius:8px;
}

/* SEARCH */

.search-wrap{
  position:absolute;

  left:50%;
  bottom:12px;

  transform:translateX(-50%);

  width:93%;
  height:72px;

  border-radius:28px;

  padding:0 12px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  background:
  linear-gradient(
  145deg,
  rgba(255,255,255,0.58),
  rgba(255,255,255,0.18)
  );

  border:1px solid rgba(255,255,255,0.72);

  backdrop-filter:blur(18px);

  box-shadow:
  inset 0 0 12px rgba(255,255,255,0.4),
  0 12px 28px rgba(180,140,100,0.10);

  z-index:100;
}

.search-left{
  display:flex;
  align-items:center;
  gap:10px;

  width:100%;
}

.circle-btn{
  width:44px;
  height:44px;

  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  background:
  linear-gradient(
  145deg,
  rgba(255,255,255,0.72),
  rgba(255,255,255,0.20)
  );

  border:1px solid rgba(255,255,255,0.7);

  box-shadow:
  inset 0 0 8px rgba(255,255,255,0.5),
  0 5px 16px rgba(180,140,100,0.10);

  cursor:pointer;
}

.circle-btn span{
  color:#b8862e;
  font-size:22px;
}

.ai-input{
  width:100%;

  border:none;
  outline:none;

  background:transparent;

  font-size:14px;

  color:#444;

  font-family:'Poppins',sans-serif;
}

.ai-input::placeholder{
  color:#7d756e;
}

/* TYPING */

.typing{
  position:absolute;

  bottom:120px;

  left:20px;

  color:#000;

  font-size:16px;

  z-index:100;
}

.hidden{
  display:none;
}

#uploadPreview{
  position:absolute;

  bottom:92px;
  left:26px;

  color:#8b6f45;

  font-size:13px;

  z-index:100;
}

@keyframes fadeUp{
  from{
    opacity:0;
    transform:translateY(10px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }
}

</style>
</head>

<body>

<div class="app">

<!-- TOP -->

<div class="top-bar">

<div class="left-top">

<div class="glass-btn">
<i>☰</i>
</div>

<div class="brand">
Sanitas Melete
</div>

</div>

<div class="glass-btn">
<i>∞</i>
</div>

</div>

<!-- HERO -->

<div class="center" id="heroSection">

<div class="logo-ring">
<div class="infinity">∞</div>
</div>

<div class="hero-title">
Hi iam mebi<span class="spark">✦</span>
</div>

<div class="divider">
<span></span>
<p>✦</p>
<span></span>
</div>

<div class="sub">
your study buddy
</div>

</div>

<!-- CHAT -->

<div id="chat" class="chat-area"></div>

<div id="typing" class="typing hidden">
MEBI is thinking✨
</div>

<div id="uploadPreview"></div>

<!-- SEARCH -->

<div class="search-wrap">

<div class="search-left">

<div
class="circle-btn"
onclick="document.getElementById('fileInput').click()"
>
<span>⌘</span>
</div>

<input
type="text"
id="user-input"
placeholder="type your questions here"
class="ai-input"
/>

</div>

<input
type="file"
id="fileInput"
accept="image/*"
hidden
/>

<div class="circle-btn" onclick="sendMessage()">
<span>↑</span>
</div>

</div>

</div>

<script src="script.js"></script>

</body>
</html>
