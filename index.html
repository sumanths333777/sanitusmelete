<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Sanitas Melete AI</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html,body{
width:100%;
height:100%;
overflow:hidden;
font-family:'Poppins',sans-serif;
}

body{
background:#efe3d6;
}

.app{
width:100%;
height:100dvh;
position:relative;
overflow:hidden;

background:
radial-gradient(circle at top,
#f8eee4 0%,
#efe3d6 45%,
#eadccd 100%);
}

/* SEARCH */

.search-wrap{
position:fixed;

left:50%;
bottom:20px;

transform:translateX(-50%);

width:92%;
height:78px;

border-radius:32px;

padding:0 16px;

display:flex;
align-items:center;
justify-content:space-between;

background:
linear-gradient(
145deg,
rgba(255,255,255,0.58),
rgba(255,255,255,0.18)
);

border:1px solid rgba(255,255,255,0.72);

backdrop-filter:blur(18px);
-webkit-backdrop-filter:blur(18px);

box-shadow:
inset 0 0 12px rgba(255,255,255,0.4),
0 12px 28px rgba(180,140,100,0.10);

z-index:100;
}

.search-left{
display:flex;
align-items:center;
gap:14px;
width:100%;
}

.circle-btn{
width:50px;
height:50px;

border-radius:50%;

display:flex;
align-items:center;
justify-content:center;

background:
linear-gradient(
145deg,
rgba(255,255,255,0.72),
rgba(255,255,255,0.20)
);

border:1px solid rgba(255,255,255,0.7);

box-shadow:
inset 0 0 8px rgba(255,255,255,0.5),
0 5px 16px rgba(180,140,100,0.10);

cursor:pointer;
}

.circle-btn span{
color:#b8862e;
font-size:24px;
}

.search-input{
width:100%;

border:none;
outline:none;

background:transparent;

color:#7d756e;

font-size:17px;

font-family:'Poppins',sans-serif;
}

.search-input::placeholder{
color:#7d756e;
}

.chat-area{
padding:20px;
margin-bottom:120px;
overflow-y:auto;
height:100vh;
}

.message{
padding:14px 18px;
margin-bottom:10px;
border-radius:20px;
max-width:80%;
}

.user-message{
background:#062d71;
color:white;
margin-left:auto;
}

.ai-message{
background:white;
color:#222;
}

</style>
</head>

<body>

<div class="app">

<div class="chat-area" id="chatArea"></div>

<!-- SEARCH -->

<div class="search-wrap">

<div class="search-left">

<label for="fileUpload" class="circle-btn">
<span>＋</span>
</label>

<input
type="file"
id="fileUpload"
hidden
multiple
accept=".pdf,.doc,.docx,.txt,image/*"
/>

<input
type="text"
class="search-input"
placeholder="type your questions here"
/>

</div>

<div class="circle-btn send-btn">
<span>↑</span>
</div>

</div>

</div>

<script>

const input =
document.querySelector(".search-input");

const sendBtn =
document.querySelector(".send-btn");

const chatArea =
document.getElementById("chatArea");

/* CHAT MESSAGE */

function addMessage(text,type){

const msg =
document.createElement("div");

msg.classList.add("message");

if(type === "user"){

msg.classList.add("user-message");

}else{

msg.classList.add("ai-message");

}

msg.innerText = text;

chatArea.appendChild(msg);

chatArea.scrollTop =
chatArea.scrollHeight;

}

/* SEND MESSAGE */

function sendMessage(){

const text =
input.value.trim();

if(!text) return;

addMessage(text,"user");

input.value = "";

setTimeout(()=>{

addMessage(
"Message received 😇",
"ai"
);

},700);

}

sendBtn.addEventListener(
"click",
sendMessage
);

input.addEventListener(
"keypress",
e=>{

if(e.key === "Enter"){

sendMessage();

}

}
);

/* FILE UPLOAD */

const fileUpload =
document.getElementById("fileUpload");

fileUpload.addEventListener(
"change",
e=>{

const files = e.target.files;

if(files.length > 0){

for(let file of files){

addMessage(
"Uploaded: " + file.name,
"user"
);

}

}

}
);

</script>

</body>
</html>
