<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sanitas Melete</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  min-height:100vh;

  display:flex;
  justify-content:center;

  background:
  radial-gradient(circle at top left,#fff6ec 0%,#f4e8dc 45%,#ecdfd2 100%);

  overflow:hidden;

  font-family:
  "SF Pro Display",
  -apple-system,
  BlinkMacSystemFont,
  sans-serif;
}

/* APP */

.app{
  width:100%;
  max-width:480px;
  min-height:100vh;

  position:relative;

  padding:28px 24px 40px;

  display:flex;
  flex-direction:column;
}

/* PREMIUM LIGHTS */

.bg-light{
  position:absolute;

  width:280px;
  height:280px;

  border-radius:50%;

  background:rgba(255,255,255,0.26);

  filter:blur(80px);

  z-index:0;
}

.light1{
  top:-80px;
  left:-60px;
}

.light2{
  right:-100px;
  bottom:180px;
}

/* TOPBAR */

.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;

  position:relative;
  z-index:10;
}

/* GLASS BUTTON */

.glass-btn{
  width:58px;
  height:58px;

  border:none;
  outline:none;

  border-radius:50%;

  background:
  linear-gradient(
  180deg,
  rgba(255,255,255,0.82),
  rgba(255,255,255,0.45));

  backdrop-filter:blur(20px);

  border:1px solid rgba(255,255,255,0.75);

  box-shadow:
  0 10px 30px rgba(199,170,134,0.18),
  inset 0 2px 4px rgba(255,255,255,0.95);

  color:#082b67;

  font-size:24px;

  display:flex;
  align-items:center;
  justify-content:center;

  cursor:pointer;
}

/* BRAND */

.brand{
  position:absolute;
  left:50%;
  transform:translateX(-50%);

  font-size:20px;

  font-family:Georgia,serif;

  font-weight:600;

  color:#082b67;

  letter-spacing:-0.02em;
}

/* HERO */

.hero{
  flex:1;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  position:relative;
  z-index:5;
}

/* LOGO WRAPPER */

.logo-wrapper{
  position:relative;

  width:360px;
  height:360px;

  display:flex;
  align-items:center;
  justify-content:center;
}

/* RINGS */

.ring{
  position:absolute;

  border-radius:50%;

  border:1px solid rgba(255,255,255,0.18);
}

.ring1{
  width:250px;
  height:250px;
}

.ring2{
  width:310px;
  height:310px;
}

.ring3{
  width:380px;
  height:380px;
}

/* MAIN ORB */

.logo-orb{
  width:220px;
  height:220px;

  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  background:
  linear-gradient(
  180deg,
  rgba(255,255,255,0.88),
  rgba(255,255,255,0.45));

  backdrop-filter:blur(24px);

  border:1px solid rgba(255,255,255,0.75);

  box-shadow:
  0 0 60px rgba(255,255,255,0.7),
  0 25px 60px rgba(199,170,134,0.18),
  inset 0 2px 10px rgba(255,255,255,0.95);

  overflow:hidden;

  position:relative;
}

/* REFLECTION */

.logo-orb::before{
  content:"";

  position:absolute;

  width:120px;
  height:260px;

  background:rgba(255,255,255,0.24);

  left:-10px;
  top:-30px;

  transform:rotate(18deg);

  filter:blur(12px);
}

/* INFINITY */

.infinity{
  font-size:120px;

  font-weight:600;

  color:#082b67;

  filter:
  drop-shadow(
  0 10px 18px rgba(15,45,107,0.15));
}

/* TITLE */

.title{
  margin-top:28px;

  font-size:58px;

  font-family:Georgia,serif;

  font-weight:700;

  color:#082b67;

  letter-spacing:-0.04em;

  text-align:center;
}

/* STAR */

.star{
  color:#d4aa5c;
}

/* DIVIDER */

.divider{
  margin-top:18px;

  display:flex;
  align-items:center;
  gap:14px;
}

.line{
  width:90px;
  height:1px;

  background:#d4aa5c;

  opacity:0.6;
}

.small-star{
  color:#d4aa5c;
  font-size:18px;
}

/* SUB */

.subtitle{
  margin-top:16px;

  font-size:28px;

  font-family:Georgia,serif;

  color:#b58b45;
}

/* INPUT AREA */

.bottom{
  position:relative;
  z-index:10;
}

/* INPUT CONTAINER */

.input-box{
  height:88px;

  border-radius:999px;

  background:
  linear-gradient(
  180deg,
  rgba(255,255,255,0.78),
  rgba(255,255,255,0.4));

  backdrop-filter:blur(24px);

  border:1px solid rgba(255,255,255,0.82);

  display:flex;
  align-items:center;

  padding:0 14px;

  box-shadow:
  0 20px 50px rgba(199,170,134,0.16),
  inset 0 1px 3px rgba(255,255,255,0.95);

  overflow:hidden;

  position:relative;
}

/* INPUT REFLECTION */

.input-box::before{
  content:"";

  position:absolute;

  width:160px;
  height:220px;

  background:rgba(255,255,255,0.22);

  left:70px;
  top:-40px;

  transform:rotate(18deg);

  filter:blur(12px);
}

/* ATTACH */

.attach-btn{
  width:58px;
  height:58px;

  border:none;

  border-radius:50%;

  background:
  linear-gradient(
  180deg,
  rgba(255,255,255,0.88),
  rgba(255,255,255,0.45));

  box-shadow:
  0 8px 20px rgba(181,139,69,0.12);

  color:#b58b45;

  font-size:24px;

  z-index:2;

  cursor:pointer;
}

/* INPUT */

.input-box input{
  flex:1;

  border:none;
  outline:none;

  background:transparent;

  padding:0 18px;

  font-size:20px;

  color:#6f665d;

  z-index:2;
}

.input-box input::placeholder{
  color:#8b8178;
}

/* SEND */

.send-btn{
  width:58px;
  height:58px;

  border:none;

  border-radius:50%;

  background:
  linear-gradient(
  180deg,
  #f2d9ab,
  #e5bf78);

  color:#8a5f1c;

  font-size:28px;

  box-shadow:
  0 10px 25px rgba(181,139,69,0.28);

  z-index:2;

  cursor:pointer;
}

/* MOBILE */

@media(max-width:768px){

  .brand{
    font-size:18px;
  }

  .logo-wrapper{
    width:280px;
    height:280px;
  }

  .logo-orb{
    width:190px;
    height:190px;
  }

  .infinity{
    font-size:100px;
  }

  .title{
    font-size:48px;
  }

  .subtitle{
    font-size:22px;
  }

  .input-box{
    height:78px;
  }

  .input-box input{
    font-size:16px;
  }

}

</style>
</head>

<body>

<div class="app">

  <!-- LIGHTS -->

  <div class="bg-light light1"></div>
  <div class="bg-light light2"></div>

  <!-- TOPBAR -->

  <div class="topbar">

    <button class="glass-btn">
      ☰
    </button>

    <div class="brand">
      Sanitas Melete
    </div>

    <button class="glass-btn">
      ∞
    </button>

  </div>

  <!-- HERO -->

  <div class="hero">

    <div class="logo-wrapper">

      <div class="ring ring1"></div>
      <div class="ring ring2"></div>
      <div class="ring ring3"></div>

      <div class="logo-orb">
        <div class="infinity">∞</div>
      </div>

    </div>

    <div class="title">
      Hi iam mebi<span class="star">✦</span>
    </div>

    <div class="divider">
      <div class="line"></div>
      <div class="small-star">✦</div>
      <div class="line"></div>
    </div>

    <div class="subtitle">
      your study buddy
    </div>

  </div>

  <!-- INPUT -->

  <div class="bottom">

    <div class="input-box">

      <button class="attach-btn">
        ⎋
      </button>

      <input
      type="text"
      placeholder="Put your documents or photos..."
      >

      <button class="send-btn">
        ↑
      </button>

    </div>

  </div>

</div>

</body>
</html>
