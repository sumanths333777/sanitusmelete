<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
/>

<title>Sanitas Melete AI</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:'Poppins',sans-serif;
  background:#efe1d2;
}

/* APP */

.app{
  width:100%;
  min-height:100dvh;

  position:relative;
  overflow:hidden;

  display:flex;
  flex-direction:column;

  background:
  radial-gradient(circle at top,
  #f8eee2 0%,
  #efe1d2 45%,
  #eadbc9 100%);
}

/* TOP BAR */

.top-bar{
  width:100%;

  display:flex;
  justify-content:space-between;
  align-items:center;

  padding:28px 34px 0;
}

.left-top{
  display:flex;
  align-items:center;
  gap:16px;
}

/* GLASS BUTTON */

.glass-btn{
  width:58px;
  height:58px;

  border-radius:50%;

  background:
  linear-gradient(
  145deg,
  rgba(255,255,255,0.75),
  rgba(255,255,255,0.18)
  );

  border:1px solid rgba(255,255,255,0.65);

  backdrop-filter:blur(12px);

  box-shadow:
  inset 0 1px 1px rgba(255,255,255,0.7),
  0 8px 22px rgba(180,140,100,0.10);

  display:flex;
  align-items:center;
  justify-content:center;
}

.glass-btn i{
  font-style:normal;
  color:#062d71;
  font-size:26px;
}

/* BRAND */

.brand{
  color:#062d71;

  font-size:30px;

  font-family:'Cormorant Garamond',serif;

  font-weight:600;
}

/* CENTER */

.center{
  flex:1;

  display:flex;
  flex-direction:column;

  align-items:center;
  justify-content:center;

  text-align:center;

  padding:20px;
}

/* LOGO */

.logo-ring{
  width:330px;
  height:330px;

  border-radius:50%;

  position:relative;

  display:flex;
  align-items:center;
  justify-content:center;

  background:
  linear-gradient(
  145deg,
  rgba(255,255,255,0.25),
  rgba(255,255,255,0.05)
  );

  border:1px solid rgba(255,255,255,0.45);

  box-shadow:
  inset 0 0 18px rgba(255,255,255,0.25),
  0 0 45px rgba(255,255,255,0.08);
}

.logo-ring::before{
  content:'';

  position:absolute;

  width:420px;
  height:420px;

  border-radius:50%;

  background:rgba(255,255,255,0.05);

  filter:blur(2px);
}

.infinity{
  font-size:155px;
  color:#062d71;
  z-index:2;
}

/* TITLE */

.hero-title{
  margin-top:42px;

  color:#062d71;

  font-size:62px;

  font-family:'Cormorant Garamond',serif;

  font-weight:700;

  line-height:1;
}

.spark{
  color:#c79a3d;
}

/* DIVIDER */

.divider{
  width:280px;

  margin:18px auto;

  display:flex;
  align-items:center;
  justify-content:center;

  gap:14px;
}

.divider span{
  width:95px;
  height:1px;
  background:#c79a3d;
}

.divider p{
  color:#c79a3d;
  font-size:18px;
}

/* SUBTEXT */

.sub{
  color:#b78633;

  font-size:32px;

  font-family:'Cormorant Garamond',serif;
}

/* SEARCH BAR */

.search-wrap{
  position:absolute;

  left:50%;
  bottom:20px;

  transform:translateX(-50%);

  width:94%;
  height:92px;

  border-radius:36px;

  padding:0 18px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  background:
  linear-gradient(
  145deg,
  rgba(255,255,255,0.58),
  rgba(255,255,255,0.18)
  );

  border:1px solid rgba(255,255,255,0.72);

  backdrop-filter:blur(16px);

  box-shadow:
  inset 0 0 12px rgba(255,255,255,0.4),
  0 12px 28px rgba(180,140,100,0.10);
}

.search-left{
  display:flex;
  align-items:center;
  gap:14px;
}

/* BUTTONS */

.circle-btn{
  width:58px;
  height:58px;

  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  flex-shrink:0;

  background:
  linear-gradient(
  145deg,
  rgba(255,255,255,0.72),
  rgba(255,255,255,0.20)
  );

  border:1px solid rgba(255,255,255,0.7);

  box-shadow:
  inset 0 0 8px rgba(255,255,255,0.5),
  0 5px 16px rgba(180,140,100,0.10);
}

.circle-btn span{
  color:#b8862e;
  font-size:26px;
}

/* PLACEHOLDER */

.placeholder{
  color:#7d756e;
  font-size:18px;
}

/* ================= MOBILE ================= */

@media (max-width:768px){

  .top-bar{
    padding:22px 18px 0;
  }

  .left-top{
    gap:12px;
  }

  .brand{
    font-size:15px;
  }

  .glass-btn{
    width:44px;
    height:44px;
  }

  .glass-btn i{
    font-size:20px;
  }

  .center{
    margin-top:-10px;
  }

  .logo-ring{
    width:190px;
    height:190px;
  }

  .logo-ring::before{
    width:240px;
    height:240px;
  }

  .infinity{
    font-size:92px;
  }

  .hero-title{
    margin-top:24px;
    font-size:30px;
  }

  .divider{
    width:170px;
    margin:12px auto;
    gap:10px;
  }

  .divider span{
    width:55px;
  }

  .divider p{
    font-size:14px;
  }

  .sub{
    font-size:18px;
  }

  .search-wrap{
    width:93%;
    height:72px;
    bottom:12px;
    border-radius:28px;
    padding:0 12px;
  }

  .search-left{
    gap:10px;
  }

  .circle-btn{
    width:44px;
    height:44px;
  }

  .circle-btn span{
    font-size:22px;
  }

  .placeholder{
    font-size:14px;
  }

}

</style>
</head>

<body>

<div class="app">

  <!-- TOP -->

  <div class="top-bar">

    <div class="left-top">

      <div class="glass-btn">
        <i>☰</i>
      </div>

      <div class="brand">
        Sanitas Melete
      </div>

    </div>

    <div class="glass-btn">
      <i>∞</i>
    </div>

  </div>

  <!-- CENTER -->

  <div class="center">

    <div class="logo-ring">
      <div class="infinity">∞</div>
    </div>

    <div class="hero-title">
      Hi iam mebi<span class="spark">✦</span>
    </div>

    <div class="divider">
      <span></span>
      <p>✦</p>
      <span></span>
    </div>

    <div class="sub">
      your study buddy
    </div>

  </div>

  <!-- SEARCH -->

  <div class="search-wrap">

    <div class="search-left">

      <div class="circle-btn">
        <span>⌘</span>
      </div>

      <div class="placeholder">
        type your questions here
      </div>

    </div>

    <div class="circle-btn">
      <span>↑</span>
    </div>

  </div>

</div>

</body>
</html>
