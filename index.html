<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>SANITAS MELETE – MEBI AI</title>

<link rel="icon" href="favicon.ico"/>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html,body{
height:100%;
overflow:hidden;
}

body{

font-family:
system-ui,
-apple-system,
BlinkMacSystemFont,
"Segoe UI",
sans-serif;

background:
linear-gradient(
180deg,
#f9f4ec 0%,
#f5ede2 100%
);

display:flex;
justify-content:center;
align-items:center;

color:#111827;
}

/* APP */

.app{

width:100%;
max-width:430px;

height:100vh;

background:
linear-gradient(
180deg,
#fbf7f1 0%,
#f6efe5 100%
);

position:relative;

overflow:hidden;
}

/* DESKTOP */

@media(min-width:900px){

body{
padding:24px;
}

.app{

max-width:520px;

height:94vh;

border-radius:38px;

box-shadow:
0 30px 80px rgba(0,0,0,.12);

border:
1px solid rgba(255,255,255,.7);
}
}

/* SOFT GLOW */

.app::before{

content:"";

position:absolute;
inset:0;

background:

radial-gradient(circle at 15% 25%,
rgba(255,255,255,.95),
transparent 12%),

radial-gradient(circle at 90% 15%,
rgba(255,255,255,.6),
transparent 18%),

radial-gradient(circle at 80% 80%,
rgba(255,255,255,.45),
transparent 20%);

pointer-events:none;
}

/* TOPBAR */

.topbar{

height:78px;

margin:16px;

padding:0 18px;

border-radius:28px;

background:
rgba(255,255,255,.52);

backdrop-filter:blur(24px);

border:
1px solid rgba(255,255,255,.7);

display:flex;
align-items:center;
justify-content:space-between;

box-shadow:
0 10px 30px rgba(0,0,0,.04);

position:relative;
z-index:10;
}

.top-left{

display:flex;
align-items:center;
gap:14px;
}

.icon-btn{

border:none;
background:transparent;

font-size:26px;

cursor:pointer;

color:#111827;
}

.brand-text{

font-size:17px;
font-weight:800;

letter-spacing:.08em;

color:#0f172a;
}

/* MAIN */

.main{

padding:
0 20px 115px;

display:flex;
flex-direction:column;
align-items:center;

overflow:hidden;

height:100%;
}

/* LOGO */

.logo-big{

width:125px;
height:125px;

border-radius:50%;

display:flex;
align-items:center;
justify-content:center;

font-size:62px;
font-weight:800;

color:#082b83;

background:
rgba(255,255,255,.48);

backdrop-filter:blur(20px);

border:
1px solid rgba(255,255,255,.75);

box-shadow:
0 18px 40px rgba(0,0,0,.06);

margin-top:4px;

animation:floatInfinity 4s ease-in-out infinite;
}

@keyframes floatInfinity{

0%{
transform:translateY(0);
}

50%{
transform:translateY(-7px);
}

100%{
transform:translateY(0);
}
}

/* HELLO */

.hello{

margin-top:18px;

font-size:38px;
font-weight:800;

letter-spacing:-2px;

text-align:center;

color:#071133;
}

.hello span{

background:
linear-gradient(
90deg,
#d9ab43,
#f0d37d
);

-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.sub{

margin-top:8px;

font-size:15px;

color:#6b7280;

text-align:center;
}

/* CHAT CARD */

.chat-area{

width:100%;

margin-top:20px;
}

.bubble.bot{

background:
rgba(255,255,255,.5);

backdrop-filter:blur(18px);

border-radius:26px;

padding:18px;

font-size:15px;

line-height:1.7;

border:
1px solid rgba(255,255,255,.75);

box-shadow:
0 10px 30px rgba(0,0,0,.04);

color:#111827;
}

/* TRY */

.quick-title{

width:100%;

margin-top:22px;
margin-bottom:14px;

font-size:22px;
font-weight:700;

color:#7c6752;
}

/* GRID */

.quick-grid{

width:100%;

display:grid;

grid-template-columns:
repeat(2,1fr);

gap:12px;
}

/* CARDS */

.quick-card{

height:126px;

padding:16px;

border-radius:26px;

background:
rgba(255,255,255,.48);

backdrop-filter:blur(18px);

border:
1px solid rgba(255,255,255,.75);

display:flex;
flex-direction:column;
justify-content:space-between;

box-shadow:
0 10px 25px rgba(0,0,0,.04);

transition:.25s ease;
}

.quick-card:hover{

transform:
translateY(-4px);
}

.card-icon{

width:46px;
height:46px;

border-radius:16px;

display:flex;
align-items:center;
justify-content:center;

font-size:20px;
}

.yellow{
background:#fff1cb;
}

.purple{
background:#edd8ff;
}

.green{
background:#e9ffd8;
}

.blue{
background:#dce8ff;
}

.quick-card h3{

font-size:15px;

line-height:1.45;

font-weight:700;
}

.quick-card span{

font-size:24px;
}

/* INPUT */

.bottombar{

position:absolute;

bottom:18px;

width:100%;

padding:0 18px;
}

.input-row{

height:70px;

background:
rgba(255,255,255,.6);

backdrop-filter:blur(24px);

border-radius:999px;

display:flex;
align-items:center;

padding:0 10px 0 18px;

border:
1px solid rgba(255,255,255,.75);

box-shadow:
0 12px 30px rgba(0,0,0,.05);
}

.upload-btn{

border:none;
background:transparent;

font-size:24px;

cursor:pointer;

margin-right:8px;
}

.input-row input{

flex:1;

border:none;
outline:none;

background:transparent;

font-size:16px;

color:#6b7280;
}

.send-btn{

width:52px;
height:52px;

border-radius:50%;

border:none;

background:#082b83;

color:white;

font-size:20px;

cursor:pointer;

box-shadow:
0 10px 24px rgba(8,43,131,.3);
}

/* MOBILE */

@media(max-width:480px){

.hello{
font-size:34px;
}

.logo-big{

width:115px;
height:115px;

font-size:58px;
}

.quick-card{

height:120px;
}

.quick-card h3{

font-size:14px;
}

}

</style>
</head>

<body>

<div class="app">

<header class="topbar">

<div class="top-left">

<button class="icon-btn">☰</button>

<div class="brand-text">
SANITAS MELETE
</div>

</div>

<button class="icon-btn">⋮</button>

</header>

<main class="main">

<div class="logo-big">∞</div>

<div class="hello">
Hi, I'm <span>MEBI</span> 👋
</div>

<div class="sub">
Your AI study buddy for NEET & JEE ✨
</div>

<div class="chat-area">

<div class="bubble bot">
I’m MEBI, your study buddy. Ask doubts, request MCQs, or send images.
</div>

</div>

<div class="quick-title">
✨ Try asking me
</div>

<div class="quick-grid">

<div class="quick-card">

<div class="card-icon yellow">❓</div>

<h3>Explain this concept</h3>

<span>→</span>

</div>

<div class="quick-card">

<div class="card-icon purple">📄</div>

<h3>Generate MCQs</h3>

<span>→</span>

</div>

<div class="quick-card">

<div class="card-icon green">⚛️</div>

<h3>Solve this problem</h3>

<span>→</span>

</div>

<div class="quick-card">

<div class="card-icon blue">☁️</div>

<h3>Upload image</h3>

<span>→</span>

</div>

</div>

</main>

<footer class="bottombar">

<div class="input-row">

<button class="upload-btn">📎</button>

<input
type="text"
placeholder="Type your question here..."
/>

<button class="send-btn">➤</button>

</div>

</footer>

</div>

</body>
</html>
