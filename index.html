<style>

/* =========================================================
   ROOT
========================================================= */

:root{
  --navy:#0b3268;
  --navy-deep:#082b5d;
  --blue:#376eaf;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,
body{
  width:100%;
  height:100%;
  overflow:hidden;
}

body{
  font-family:"DM Sans",sans-serif;
  background:#071526;
}


/* =========================================================
   RESPONSIVE VIEWPORT

   IMPORTANT:
   1024 x 1536 reference ratio = 2 / 3

   The canvas fills mobile perfectly and scales correctly
   on desktop without cropping.
========================================================= */

.viewport{
  width:100vw;
  height:100vh;

  display:flex;
  align-items:center;
  justify-content:center;

  overflow:hidden;

  background:#071526;
}


/* =========================================================
   MASTER CANVAS
========================================================= */

.app-stage{
  position:relative;

  width:min(100vw, calc(100vh * 2 / 3));
  height:min(100vh, calc(100vw * 3 / 2));

  aspect-ratio:2 / 3;

  overflow:hidden;

  background:#9bbddd;
}


/* =========================================================
   ACTUAL DESIGN CANVAS

   Internal design remains 1024 x 1536.
========================================================= */

.app{
  position:absolute;
  inset:0;

  width:1024px;
  height:1536px;

  transform-origin:top left;

  background-color:#9bbddd;

  background-image:
    linear-gradient(
      180deg,
      rgba(218,233,247,.16) 0%,
      rgba(160,195,226,.05) 45%,
      rgba(115,157,194,.10) 100%
    ),
    url("https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=1800&q=95");

  background-size:cover;
  background-position:center;
}


/* =========================================================
   RESPONSIVE SCALE
========================================================= */

@media (max-aspect-ratio:2/3){

  .app{
    transform:scale(calc(100vw / 1024));
  }

}

@media (min-aspect-ratio:2/3){

  .app{
    transform:scale(calc(100vh / 1536));
  }

}


/* =========================================================
   ATMOSPHERIC OVERLAY
========================================================= */

.app::before{
  content:"";

  position:absolute;
  inset:0;

  background:
    linear-gradient(
      180deg,
      rgba(232,242,252,.20) 0%,
      rgba(190,215,239,.04) 35%,
      rgba(33,78,123,.07) 70%,
      rgba(230,240,248,.16) 100%
    );

  pointer-events:none;
  z-index:1;
}


/* =========================================================
   BOTTOM FOG
========================================================= */

.app::after{
  content:"";

  position:absolute;

  left:-10%;
  bottom:-10%;

  width:120%;
  height:35%;

  background:
    radial-gradient(
      ellipse,
      rgba(235,245,255,.48) 0%,
      rgba(220,235,248,.18) 45%,
      transparent 75%
    );

  filter:blur(30px);

  pointer-events:none;
  z-index:2;
}


/* =========================================================
   TOP NAVIGATION
========================================================= */

.top-bar{
  position:absolute;

  top:55px;
  left:52px;
  right:52px;

  height:130px;

  display:flex;
  justify-content:space-between;
  align-items:flex-start;

  z-index:20;
}


/* =========================================================
   GLASS BUTTON
========================================================= */

.glass-btn{
  width:124px;
  height:124px;

  border-radius:50%;

  border:2px solid rgba(255,255,255,.65);

  background:

      145deg,
      rgba(240,247,255,.48),
      rgba(195,220,242,.25)
    );

  backdrop-filter:blur(24px);
  -webkit-backdrop-filter:blur(24px);

  box-shadow:
    inset 0 2px 4px rgba(255,255,255,.50),
    0 10px 35px rgba(20,55,95,.08);

  display:flex;
  align-items:center;
  justify-content:center;

  cursor:pointer;

  color:var(--navy);

  transition:.2s ease;
}

.glass-btn:active{
  transform:scale(.94);
}


/* =========================================================
   MENU ICON
========================================================= */

========================================================= */
