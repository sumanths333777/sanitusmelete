<!DOCTYPE html>
<html lang="en">
<head>

<meta name="author" content="SK">
<meta name="creator" content="SK">
<meta name="publisher" content="Sanitas Melete AI">

<meta name="description"
content="Sanitas Melete AI is a premium AI-powered educational platform for NEET and JEE students, created by SK.">

<meta name="keywords"
content="SK, Sanitas Melete AI, NEET AI, JEE AI, AI study platform">

<meta property="og:title" content="Sanitas Melete AI">
<meta property="og:description"
content="Premium AI learning platform for NEET and JEE students, created by SK.">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sanitas Melete AI</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

/* =========================
   GLOBAL
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:'Poppins',sans-serif;
}

body{
    background:#f3f8ff;
}


/* =========================
   COLOR SYSTEM
========================= */

:root{

    --blue:#063B8F;
    --blue-dark:#032A68;
    --blue-light:#0B5ED7;
    --blue-soft:#EAF2FF;

    --text:#17345f;
    --muted:#7183a0;

    --white:rgba(255,255,255,0.82);

    --border:rgba(255,255,255,0.9);

    --shadow:rgba(6,59,143,0.12);
}


/* =========================
   APP
========================= */

.app{
    width:100%;
    height:100dvh;

    position:relative;

    overflow:visible;

    background:
        radial-gradient(
            circle at 50% 0%,
            #ffffff 0%,
            #f4f8ff 38%,
            #eaf2ff 100%
        );
}


/* =========================
   TOP BAR
========================= */

.top-bar{

    width:100%;

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:28px 38px 0;

    position:fixed;

    top:0;
    left:0;

    z-index:100000;

    transition:0.25s ease;
}

.left-top{

    display:flex;
    align-items:center;

    gap:16px;
}


/* GLASS BUTTON */

.glass-btn{

    width:58px;
    height:58px;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,0.92),
            rgba(225,237,255,0.55)
        );

    border:1px solid rgba(255,255,255,0.95);

    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);

    box-shadow:
        inset 0 1px 2px rgba(255,255,255,1),
        0 8px 24px var(--shadow);

    cursor:pointer;

    flex-shrink:0;

    transition:0.25s ease;
}

.glass-btn:hover{

    transform:translateY(-2px);

    box-shadow:
        inset 0 1px 2px rgba(255,255,255,1),
        0 12px 28px rgba(6,59,143,0.18);
}

.glass-btn i{

    font-style:normal;

    color:var(--blue);

    font-size:26px;
}


/* BRAND */

.brand{

    color:var(--blue);

    font-size:30px;

    font-family:'Cormorant Garamond',serif;

    font-weight:700;

    white-space:nowrap;
}


/* =========================
   LOGO
========================= */

.logo-mark{

    width:125px;
    height:125px;

    position:relative;

    display:flex;
    align-items:center;
    justify-content:center;

    margin:auto;

    color:var(--blue);

    filter:
        drop-shadow(
            0 12px 24px
            rgba(6,59,143,0.12)
        );
}

.logo-mark svg{

    width:100%;
    height:100%;
}


/* =========================
   HERO
========================= */

.center{

    position:fixed;

    top:48%;
    left:50%;

    transform:translate(-50%,-50%);

    width:100%;

    text-align:center;

    pointer-events:none;

    z-index:1;
}


/* HERO TITLE */

.hero-title{

    margin-top:28px;

    color:var(--blue);

    font-size:64px;

    font-family:'Cormorant Garamond',serif;

    font-weight:700;

    line-height:1;
}

.spark{

    color:var(--blue-light);

    margin-left:5px;
}


/* DIVIDER */

.divider{

    width:260px;

    margin:18px auto;

    display:flex;

    align-items:center;

    justify-content:center;

    gap:14px;
}

.divider span{

    width:90px;

    height:1px;

    background:
        linear-gradient(
            90deg,
            transparent,
            var(--blue)
        );
}

.divider span:last-child{

    background:
        linear-gradient(
            90deg,
            var(--blue),
            transparent
        );
}

.divider p{

    color:var(--blue);

    font-size:18px;
}


/* SUBTITLE */

.sub{

    color:#52709e;

    font-size:30px;

    font-family:'Cormorant Garamond',serif;

    font-weight:500;
}


/* =========================
   CHAT
========================= */

.chat-area{

    position:absolute;

    top:0;
    left:0;

    width:100%;
    height:100dvh;

    overflow-y:auto;

    padding-top:95vh;

    padding-left:20px;
    padding-right:20px;

    padding-bottom:190px;

    display:flex;

    flex-direction:column;

    gap:14px;

    z-index:5;

    scroll-behavior:smooth;
}

.chat-area::-webkit-scrollbar{
    display:none;
}


/* MESSAGE */

.message{

    max-width:78%;

    padding:15px 18px;

    border-radius:24px;

    font-size:15px;

    line-height:1.6;

    word-wrap:break-word;

    animation:fadeUp .25s ease;
}


/* USER */

.user-message{

    align-self:flex-end;

    background:
        linear-gradient(
            135deg,
            var(--blue),
            var(--blue-light)
        );

    color:white;

    border-bottom-right-radius:8px;

    box-shadow:
        0 8px 20px rgba(6,59,143,0.18);
}


/* AI */

.ai-message{

    align-self:flex-start;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,0.92),
            rgba(237,245,255,0.68)
        );

    border:1px solid rgba(255,255,255,0.95);

    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);

    color:#263f66;

    border-bottom-left-radius:8px;

    box-shadow:
        0 8px 24px rgba(6,59,143,0.08);
}


/* ANIMATION */

@keyframes fadeUp{

    from{
        opacity:0;
        transform:translateY(20px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}


/* =========================
   SEARCH
========================= */

.search-wrap{

    position:fixed;

    left:50%;
    bottom:20px;

    transform:translateX(-50%);

    width:92%;
    height:78px;

    border-radius:32px;

    padding:0 16px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,0.90),
            rgba(231,241,255,0.68)
        );

    border:1px solid rgba(255,255,255,0.95);

    backdrop-filter:blur(22px);
    -webkit-backdrop-filter:blur(22px);

    box-shadow:

        inset 0 0 12px
        rgba(255,255,255,0.8),

        0 14px 32px
        rgba(6,59,143,0.12);

    z-index:100;
}


/* SEARCH LEFT */

.search-left{

    display:flex;

    align-items:center;

    gap:14px;

    width:100%;
}


/* CIRCLE BUTTON */

.circle-btn{

    width:50px;
    height:50px;

    border-radius:50%;

    display:flex;

    align-items:center;
    justify-content:center;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,0.95),
            rgba(224,237,255,0.65)
        );

    border:1px solid rgba(255,255,255,0.95);

    box-shadow:
        inset 0 0 8px rgba(255,255,255,0.8),
        0 6px 16px rgba(6,59,143,0.10);

    cursor:pointer;

    transition:0.2s ease;

    flex-shrink:0;
}

.circle-btn:hover{

    transform:scale(1.05);

    box-shadow:
        0 8px 20px rgba(6,59,143,0.18);
}

.circle-btn span{

    color:var(--blue);

    font-size:24px;

    font-weight:500;
}


/* SEND */

.send-btn{

    background:
        linear-gradient(
            135deg,
            var(--blue),
            var(--blue-light)
        );

    border:none;

    box-shadow:
        0 8px 20px rgba(6,59,143,0.24);
}

.send-btn span{

    color:white;

    font-size:25px;
}


/* INPUT */

.search-input{

    width:100%;

    border:none;
    outline:none;

    background:transparent;

    color:var(--text);

    font-size:17px;

    font-family:'Poppins',sans-serif;
}

.search-input::placeholder{

    color:#7f91ad;
}


/* =========================
   OVERLAY
========================= */

.menu-overlay{

    position:fixed;

    inset:0;

    background:rgba(4,34,76,0.10);

    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);

    opacity:0;

    visibility:hidden;

    transition:0.35s ease;

    z-index:998;
}

.menu-overlay.active{

    opacity:1;

    visibility:visible;
}


/* =========================
   SIDE MENU
========================= */

.side-menu{

    position:fixed;

    top:0;
    left:0;

    width:88%;
    max-width:320px;

    height:100dvh;

    padding:120px 14px 18px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,0.94),
            rgba(232,242,255,0.78)
        );

    border-right:1px solid rgba(255,255,255,0.95);

    border-top-right-radius:32px;

    border-bottom-right-radius:32px;

    backdrop-filter:blur(30px);
    -webkit-backdrop-filter:blur(30px);

    box-shadow:
        10px 0 40px
        rgba(6,59,143,0.12);

    transform:translate3d(-110%,0,0);

    transition:
        transform 0.42s
        cubic-bezier(.77,0,.18,1);

    z-index:100001;

    overflow-y:auto;

    overflow-x:hidden;

    will-change:transform;
}

.side-menu::-webkit-scrollbar{
    display:none;
}


/* =========================
   PROFILE
========================= */

.menu-profile{

    display:flex;

    justify-content:space-between;
    align-items:center;

    padding:14px;

    border-radius:22px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,0.92),
            rgba(230,240,255,0.65)
        );

    border:1px solid rgba(255,255,255,0.95);

    margin-bottom:16px;

    box-shadow:
        0 8px 20px
        rgba(6,59,143,0.06);
}


.profile-left{

    display:flex;

    align-items:center;

    gap:10px;
}


.profile-icon{

    width:52px;
    height:52px;

    border-radius:50%;

    display:flex;

    align-items:center;
    justify-content:center;

    background:
        linear-gradient(
            135deg,
            #dceaff,
            #edf5ff
        );

    color:var(--blue);

    font-size:24px;
}


.menu-profile h2{

    color:var(--blue);

    font-size:26px;

    font-family:'Cormorant Garamond',serif;

    line-height:1;
}

.menu-profile p{

    color:#6680a6;

    font-size:14px;

    margin-top:2px;
}

.profile-star{

    color:var(--blue);

    font-size:20px;
}


/* =========================
   MENU ITEMS
========================= */

.menu-items{

    display:flex;

    flex-direction:column;

    gap:10px;
}


.menu-item{

    height:60px;

    padding:0 16px;

    border-radius:18px;

    display:flex;

    align-items:center;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,0.90),
            rgba(232,242,255,0.58)
        );

    border:1px solid rgba(255,255,255,0.92);

    box-shadow:
        inset 0 0 6px rgba(255,255,255,0.7);

    cursor:pointer;

    transition:0.2s ease;
}

.menu-item:hover{

    transform:translateX(4px);

    background:#ffffff;
}


.menu-item span{

    font-size:20px;

    color:var(--blue);
}

.menu-item p{

    margin-left:14px;

    color:#263f66;

    font-size:16px;

    font-family:'Cormorant Garamond',serif;

    flex:1;
}

.menu-item i{

    font-style:normal;

    color:#7890b0;

    font-size:22px;
}


/* =========================
   ABOUT
========================= */

.about-popup{

    position:fixed;

    inset:0;

    background:rgba(4,34,76,0.10);

    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);

    display:flex;

    align-items:center;
    justify-content:center;

    opacity:0;

    visibility:hidden;

    transition:0.3s ease;

    z-index:9999;
}

.about-popup.active{

    opacity:1;

    visibility:visible;
}


.about-card{

    width:88%;
    max-width:360px;

    padding:30px 24px;

    border-radius:30px;

    text-align:center;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,0.94),
            rgba(232,242,255,0.72)
        );

    border:1px solid rgba(255,255,255,0.95);

    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);

    position:relative;

    box-shadow:
        0 20px 50px
        rgba(6,59,143,0.16);
}


/* ABOUT LOGO */

.about-logo{

    width:72px;
    height:72px;

    margin:auto;

    display:flex;

    align-items:center;
    justify-content:center;

    color:var(--blue);
}

.about-logo svg{

    width:100%;
    height:100%;
}


.about-card h2{

    margin-top:10px;

    color:var(--blue);

    font-size:30px;

    font-family:'Cormorant Garamond',serif;
}


.about-sub{

    color:#6280a8;

    font-size:18px;

    margin-top:4px;

    font-family:'Cormorant Garamond',serif;
}


.about-line{

    width:70px;

    height:2px;

    background:var(--blue);

    margin:18px auto;

    border-radius:5px;
}


.about-text{

    color:#647895;

    line-height:1.6;

    font-size:16px;
}


.founder{

    margin-top:18px;

    color:var(--blue);

    font-size:22px;

    font-family:'Cormorant Garamond',serif;
}


.close-popup{

    position:absolute;

    top:16px;
    right:20px;

    border:none;

    background:none;

    font-size:22px;

    cursor:pointer;

    color:#6d819f;
}


/* =========================
   MOBILE
========================= */

@media (max-width:768px){

    .top-bar{

        padding:22px 18px 0;
    }

    .brand{

        font-size:17px;
    }

    .glass-btn{

        width:44px;
        height:44px;
    }

    .glass-btn i{

        font-size:20px;
    }

    .logo-mark{

        width:105px;
        height:105px;
    }

    .hero-title{

        margin-top:22px;

        font-size:30px;
    }

    .sub{

        font-size:18px;
    }

    .divider{

        width:180px;

        margin:13px auto;
    }

    .divider span{

        width:55px;
    }

    .search-wrap{

        width:93%;

        height:72px;

        bottom:12px;

        border-radius:28px;

        padding:0 12px;
    }

    .chat-area{

        padding-top:72vh;
    }

    .message{

        max-width:86%;
    }

}


/* =========================
   SMALL PHONES
========================= */

@media (max-width:420px){

    .brand{

        font-size:15px;
    }

    .logo-mark{

        width:90px;
        height:90px;
    }

    .hero-title{

        font-size:28px;
    }

    .sub{

        font-size:17px;
    }

}

</style>

</head>

        <div class="about-logo">

                xmlns="http://www.w3.org/2000/svg">

                <rect
                    x="22"
                    y="22"
                    width="156"
                    height="156"
                    rx="
