<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Sanitas Melete AI</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html,body{
width:100%;
height:100%;
overflow:hidden;
font-family:'Poppins',sans-serif;
}

body{
background:#efe3d6;
}

.app{
width:100%;
height:100dvh;
position:relative;
overflow:hidden;

background:
radial-gradient(circle at top,
#f8eee4 0%,
#efe3d6 45%,
#eadccd 100%);
}

/* TOP BAR */

.top-bar{
width:100%;
display:flex;
justify-content:space-between;
align-items:center;

pointer-events:auto;
padding:28px 38px 0;

position:fixed;
top:0;
left:0;

z-index:1000;
transition:0.25s ease;
}

.left-top{
display:flex;
align-items:center;
gap:16px;
}

.glass-btn{
width:58px;
height:58px;

border-radius:50%;

display:flex;
align-items:center;
justify-content:center;

background:
linear-gradient(
145deg,
rgba(255,255,255,0.75),
rgba(255,255,255,0.18)
);

border:1px solid rgba(255,255,255,0.72);

backdrop-filter:blur(18px);
-webkit-backdrop-filter:blur(18px);

box-shadow:
inset 0 1px 1px rgba(255,255,255,0.8),
0 8px 22px rgba(180,140,100,0.10);

cursor:pointer;
}

.glass-btn i{
font-style:normal;
color:#062d71;
font-size:26px;
}

.brand{
color:#062d71;
font-size:30px;
font-family:'Cormorant Garamond',serif;
font-weight:600;
}

/* HERO */

.center{
position:fixed;

top:48%;
left:50%;

transform:translate(-50%,-50%);

width:100%;

text-align:center;

pointer-events:none;

z-index:1;
}

.logo-ring{
width:290px;
height:290px;

margin:auto;

border-radius:50%;

position:relative;

display:flex;
align-items:center;
justify-content:center;

background:
linear-gradient(
145deg,
rgba(255,255,255,0.24),
rgba(255,255,255,0.05)
);

border:1px solid rgba(255,255,255,0.48);

box-shadow:
inset 0 0 18px rgba(255,255,255,0.25),
0 0 45px rgba(255,255,255,0.08);
}

.logo-ring::before{
content:'';

position:absolute;

width:360px;
height:360px;

border-radius:50%;

background:rgba(255,255,255,0.05);

filter:blur(2px);
}

.infinity{
font-size:132px;
color:#062d71;
z-index:2;
}

.hero-title{
margin-top:34px;

color:#062d71;

font-size:64px;

font-family:'Cormorant Garamond',serif;

font-weight:700;

line-height:1;
}

.spark{
color:#c79a3d;
}

.divider{
width:260px;

margin:18px auto;

display:flex;
align-items:center;
justify-content:center;

gap:14px;
}

.divider span{
width:90px;
height:1px;
background:#c79a3d;
}

.divider p{
color:#c79a3d;
font-size:18px;
}

.sub{
color:#b78633;
font-size:30px;
font-family:'Cormorant Garamond',serif;
}

/* CHAT */

.chat-area{

position:absolute;

top:0;
left:0;

width:100%;
height:100dvh;

overflow-y:auto;

padding-top:95vh;
padding-left:20px;
padding-right:20px;
padding-bottom:190px;

display:flex;
flex-direction:column;

gap:14px;

z-index:5;

scroll-behavior:smooth;

}

.chat-area::-webkit-scrollbar{
display:none;
}

.message{
max-width:78%;

padding:15px 18px;

border-radius:24px;

font-size:15px;

line-height:1.6;

word-wrap:break-word;

animation:fadeUp .25s ease;
}

.user-message{
align-self:flex-end;

background:#062d71;

color:white;

border-bottom-right-radius:8px;
}

.ai-message{
align-self:flex-start;

background:
linear-gradient(
145deg,
rgba(255,255,255,0.75),
rgba(255,255,255,0.22)
);

border:1px solid rgba(255,255,255,0.7);

backdrop-filter:blur(18px);
-webkit-backdrop-filter:blur(18px);

color:#333;

border-bottom-left-radius:8px;
}

@keyframes fadeUp{

from{
opacity:0;
transform:translateY(20px);
}

to{
opacity:1;
transform:translateY(0);
}

}

/* SEARCH */

.search-wrap{
position:fixed;

left:50%;
bottom:20px;

transform:translateX(-50%);

width:92%;
height:78px;

border-radius:32px;

padding:0 16px;

display:flex;
align-items:center;
justify-content:space-between;

background:
linear-gradient(
145deg,
rgba(255,255,255,0.58),
rgba(255,255,255,0.18)
);

border:1px solid rgba(255,255,255,0.72);

backdrop-filter:blur(18px);
-webkit-backdrop-filter:blur(18px);

box-shadow:
inset 0 0 12px rgba(255,255,255,0.4),
0 12px 28px rgba(180,140,100,0.10);

z-index:100;
}

.search-left{
display:flex;
align-items:center;
gap:14px;
width:100%;
}

.circle-btn{
width:50px;
height:50px;

border-radius:50%;

display:flex;
align-items:center;
justify-content:center;

background:
linear-gradient(
145deg,
rgba(255,255,255,0.72),
rgba(255,255,255,0.20)
);

border:1px solid rgba(255,255,255,0.7);

box-shadow:
inset 0 0 8px rgba(255,255,255,0.5),
0 5px 16px rgba(180,140,100,0.10);

cursor:pointer;
}

.circle-btn span{
color:#b8862e;
font-size:24px;
}

.search-input{
width:100%;

border:none;
outline:none;

background:transparent;

color:#7d756e;

font-size:17px;

font-family:'Poppins',sans-serif;
}

.search-input::placeholder{
color:#7d756e;
}

/* MENU */

.menu-overlay{
position:fixed;
inset:0;

background:rgba(0,0,0,0.08);

backdrop-filter:blur(8px);
-webkit-backdrop-filter:blur(8px);

opacity:0;
visibility:hidden;

transition:0.
