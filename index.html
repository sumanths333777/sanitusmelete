<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<title>Sanitas Melete AI</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">

<style>

/* =========================================================
   ROOT
========================================================= */

:root{
  --navy:#0b3268;
  --navy-deep:#082b5d;
  --blue:#376eaf;

  --canvas-width:1024px;
  --canvas-height:1536px;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,
body{
  width:100%;
  height:100%;
  overflow:hidden;
}

body{
  font-family:"DM Sans",sans-serif;
  background:#071526;
}


/* =========================================================
   VIEWPORT
   Keeps exact portrait reference proportions on every screen
========================================================= */

.viewport{
  width:100vw;
  height:100vh;

  display:flex;
  align-items:center;
  justify-content:center;

  overflow:hidden;

  background:
    radial-gradient(
      circle at center,
      #243d5b 0%,
      #071526 75%
    );
}


/* =========================================================
   MASTER CANVAS

   IMPORTANT:
   All dimensions below are based on your 1024 x 1536 reference.
========================================================= */

.app{
  position:relative;

  width:1024px;
  height:1536px;

  flex:none;
  overflow:hidden;

  transform-origin:center center;

  background-color:#9bbddd;

  /*
     Replace this URL with your EXACT mountain background
     for pixel-perfect matching.
  */

  background-image:
    linear-gradient(
      180deg,
      rgba(218,233,247,.18) 0%,
      rgba(160,195,226,.08) 45%,
      rgba(115,157,194,.12) 100%
    ),
    url("https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=1800&q=95");

  background-size:cover;
  background-position:center;
}


/* =========================================================
   ATMOSPHERIC BLUE OVERLAY
========================================================= */

.app::before{
  content:"";

  position:absolute;
  inset:0;

  background:
    linear-gradient(
      180deg,
      rgba(232,242,252,.22) 0%,
      rgba(190,215,239,.05) 35%,
      rgba(33,78,123,.08) 70%,
      rgba(230,240,248,.16) 100%
    );

  pointer-events:none;

  z-index:1;
}


/* =========================================================
   BOTTOM FOG
========================================================= */

.app::after{
  content:"";

  position:absolute;

  left:-10%;
  bottom:-10%;

  width:120%;
  height:35%;

  background:
    radial-gradient(
      ellipse,
      rgba(235,245,255,.52) 0%,
      rgba(220,235,248,.20) 45%,
      transparent 75%
    );

  filter:blur(30px);

  pointer-events:none;

  z-index:2;
}


/* =========================================================
   TOP NAVIGATION
========================================================= */

.top-bar{
  position:absolute;

  top:55px;
  left:52px;
  right:52px;

  height:130px;

  display:flex;
  justify-content:space-between;
  align-items:flex-start;

  z-index:20;
}


/* =========================================================
   GLASS CIRCLE BUTTON
========================================================= */

.glass-btn{
  width:124px;
  height:124px;

  border-radius:50%;

  border:2px solid rgba(255,255,255,.65);

  background:
    linear-gradient(
      145deg,
      rgba(240,247,255,.48),
      rgba(195,220,242,.25)
    );

  backdrop-filter:blur(24px);
  -webkit-backdrop-filter:blur(24px);

  box-shadow:
    inset 0 2px 4px rgba(255,255,255,.50),
    0 10px 35px rgba(20,55,95,.08);

  display:flex;
  align-items:center;
  justify-content:center;

  cursor:pointer;

  color:var(--navy);

  transition:.2s ease;
}

.glass-btn:active{
  transform:scale(.94);
}


/* =========================================================
   MENU ICON
========================================================= */

.menu-icon{
  width:55px;
  height:43px;

  display:flex;
  flex-direction:column;
  justify-content:space-between;
}

.menu-icon span{
  display:block;

  width:55px;
  height:5px;

  border-radius:20px;

  background:var(--navy);
}


/* =========================================================
   PROFILE ICON
========================================================= */

.profile-icon{
  width:38px;
  height:38px;

  border:5px solid var(--navy);

  border-radius:50%;

  position:relative;

  margin-top:-23px;
}

.profile-icon::after{
  content:"";

  position:absolute;

  width:58px;
  height:37px;

  border:5px solid var(--navy);
  border-bottom:none;

  border-radius:42px 42px 0 0;

  top:47px;
  left:50%;

  transform:translateX(-50%);
}


/* =========================================================
   BRAND
========================================================= */

.brand{
  position:absolute;

  top:25px;
  left:50%;

  transform:translateX(-50%);

  text-align:center;

  white-space:nowrap;
}

.brand h1{
  font-size:43px;

  font-weight:600;

  letter-spacing:.5px;

  line-height:1;

  color:#123767;
}

.brand p{
  margin-top:17px;

  font-size:17px;

  font-weight:500;

  letter-spacing:12px;

  color:#163967;
}


/* =========================================================
   LEFT HERO
========================================================= */

.hero-content{
  position:absolute;

  top:264px;
  left:66px;

  z-index:10;
}

.hero-line{
  width:72px;
  height:4px;

  background:var(--navy);

  margin-bottom:24px;
}


/* =========================================================
   MAIN TITLE
========================================================= */

.hero-title{
  font-family:"Playfair Display",serif;

  font-size:73px;

  font-weight:400;

  line-height:1.01;

  letter-spacing:-2px;

  color:#092e63;
}


/* =========================================================
   HERO SUBTEXT
========================================================= */

.hero-bottom-line{
  width:72px;
  height:4px;

  background:var(--navy);

  margin-top:24px;
  margin-bottom:26px;
}

.hero-sub{
  font-size:17px;

  font-weight:500;

  letter-spacing:8px;

  line-height:2.05;

  color:#153966;
}

.hero-last-line{
  width:72px;
  height:4px;

  background:var(--navy);

  margin-top:17px;
}


/* =========================================================
   RIGHT QUOTE
========================================================= */

.quote{
  position:absolute;

  top:274px;
  right:60px;

  width:165px;

  z-index:10;
}

.quote p{
  font-family:"Playfair Display",serif;

  font-size:25px;

  font-weight:400;

  line-height:1.3;

  color:#102e58;
}

.quote-line{
  width:67px;
  height:4px;

  background:var(--navy);

  margin-top:23px;
}


/* =========================================================
   BIRDS
========================================================= */

.birds{
  position:absolute;

  top:270px;
  right:270px;

  display:flex;
  gap:12px;

  z-index:8;
}

.bird{
  width:20px;
  height:10px;

  border-top:2px solid var(--navy);

  border-radius:50%;

  transform:rotate(-8deg);
}

.bird:nth-child(2){
  transform:
    translateY(18px)
    scale(.7)
    rotate(-5deg);
}

.bird:nth-child(3){
  transform:
    translateX(22px)
    translateY(-18px)
    scale(.85)
    rotate(-15deg);
}


/* =========================================================
   MAIN MEBI GLASS CARD
========================================================= */

.mebi-card{
  position:absolute;

  left:50%;
  top:823px;

  transform:translateX(-50%);

  width:680px;
  height:452px;

  border-radius:55px;

  display:flex;
  flex-direction:column;

  align-items:center;
  justify-content:center;

  background:
    linear-gradient(
      135deg,
      rgba(238,247,255,.48),
      rgba(188,215,240,.28)
    );

  border:2px solid rgba(255,255,255,.70);

  backdrop-filter:blur(28px);
  -webkit-backdrop-filter:blur(28px);

  box-shadow:
    inset 0 2px 3px rgba(255,255,255,.58),
    0 22px 55px rgba(18,55,98,.12);

  z-index:15;
}


/* =========================================================
   MEBI LOGO

   SVG-like construction kept inside CSS
========================================================= */

.mebi-logo{
  width:184px;
  height:184px;

  position:relative;

  margin-bottom:27px;
}


/* Outer rounded square */

.logo-frame{
  position:absolute;

  inset:0;

  border:10px solid var(--navy);

  border-radius:43px;

  overflow:hidden;
}


/* Curved diagonal stroke */

.logo-curve{
  position:absolute;

  width:80px;
  height:150px;

  left:23px;
  top:-4px;

  border-left:16px solid var(--navy);
  border-bottom:16px solid var(--navy);

  border-radius:0 0 0 95px;

  transform:rotate(-42deg);

  z-index:3;
}


/* Main diagonal */

.logo-diagonal{
  position:absolute;

  width:175px;
  height:16px;

  background:var(--navy);

  border-radius:20px;

  left:5px;
  top:84px;

  transform:rotate(-45deg);

  z-index:4;
}


/* Bottom diagonal */

.logo-bottom{
  position:absolute;

  width:95px;
  height:16px;

  background:var(--navy);

  border-radius:20px;

  right:3px;
  bottom:30px;

  transform:rotate(-45deg);

  z-index:4;
}


/* =========================================================
   MEBI TEXT
========================================================= */

.mebi-title{
  font-size:63px;

  font-weight:600;

  letter-spacing:-1.5px;

  color:#123a71;

  line-height:1;
}

.mebi-sub{
  margin-top:28px;

  font-size:18px;

  font-weight:500;

  text-align:center;

  letter-spacing:10px;

  line-height:2.2;

  color:#173b6a;
}


/* =========================================================
   CHAT AREA

   Hidden initially.
   When messages exist, they scroll above the search bar.
========================================================= */

.chat-area{
  position:absolute;

  inset:0;

  padding:
    1280px
    70px
    210px;

  display:flex;
  flex-direction:column;

  gap:18px;

  overflow-y:auto;

  pointer-events:none;

  z-index:25;

  scrollbar-width:none;
}

.chat-area::-webkit-scrollbar{
  display:none;
}

.message{
  max-width:75%;

  padding:17px 22px;

  border-radius:23px;

  font-size:16px;

  line-height:1.6;

  pointer-events:auto;

  animation:messageIn .3s ease;
}

.user-message{
  align-self:flex-end;

  background:rgba(10,45,104,.92);

  color:white;

  border-bottom-right-radius:7px;
}

.ai-message{
  align-self:flex-start;

  background:rgba(245,250,255,.72);

  color:#153866;

  border:1px solid rgba(255,255,255,.75);

  backdrop-filter:blur(20px);

  border-bottom-left-radius:7px;
}

@keyframes messageIn{
  from{
    opacity:0;
    transform:translateY(15px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }
}


/* =========================================================
   BOTTOM SEARCH BAR
========================================================= */

.search-wrap{
  position:absolute;

  left:31px;
  bottom:38px;

  width:962px;
  height:160px;

  padding:12px 27px;

  display:flex;
  align-items:center;

  gap:20px;

  border-radius:82px;

  background:
    linear-gradient(
      135deg,
      rgba(240,248,255,.56),
      rgba(195,220,243,.36)
    );

  border:2px solid rgba(255,255,255,.72);

  backdrop-filter:blur(28px);
  -webkit-backdrop-filter:blur(28px);

  box-shadow:
    inset 0 2px 3px rgba(255,255,255,.72),
    0 18px 45px rgba(25,60,100,.12);

  z-index:100;
}


/* =========================================================
   ADD BUTTON
========================================================= */

.add-btn{
  width:116px;
  height:116px;

  flex-shrink:0;

  border-radius:50%;

  border:1px solid rgba(255,255,255,.72);

  background:
    linear-gradient(
      145deg,
      rgba(245,250,255,.56),
      rgba(205,225,244,.28)
    );

  display:flex;
  align-items:center;
  justify-content:center;

  cursor:pointer;

  position:relative;
}

.plus-icon{
  position:relative;

  width:52px;
  height:52px;
}

.plus-icon::before,
.plus-icon::after{
  content:"";

  position:absolute;

  background:#16457f;

  border-radius:10px;
}

.plus-icon::before{
  width:5px;
  height:52px;

  left:23px;
  top:0;
}

.plus-icon::after{
  width:52px;
  height:5px;

  top:23px;
  left:0;
}


/* =========================================================
   INPUT
========================================================= */

.search-input{
  flex:1;

  min-width:0;

  height:100%;

  border:none;
  outline:none;

  background:transparent;

  font-family:"DM Sans",sans-serif;

  font-size:37px;

  font-weight:400;

  color:#25466d;
}

.search-input::placeholder{
  color:#38597e;

  opacity:.95;
}


/* =========================================================
   MICROPHONE
========================================================= */

.mic-btn{
  width:70px;
  height:70px;

  flex-shrink:0;

  border:none;

  background:transparent;

  cursor:pointer;

  position:relative;
}

.mic-icon{
  position:absolute;

  width:24px;
  height:43px;

  border:5px solid var(--navy);

  border-radius:20px;

  top:7px;
  left:23px;
}

.mic-icon::before{
  content:"";

  position:absolute;

  width:42px;
  height:30px;

  border:4px solid var(--navy);
  border-top:none;

  border-radius:0 0 30px 30px;

  left:50%;
  top:20px;

  transform:translateX(-50%);
}

.mic-icon::after{
  content:"";

  position:absolute;

  width:5px;
  height:15px;

  background:var(--navy);

  left:50%;
  bottom:-18px;

  transform:translateX(-50%);
}


/* =========================================================
   SEND BUTTON
========================================================= */

.send-btn{
  width:120px;
  height:120px;

  flex-shrink:0;

  border:none;

  border-radius:50%;

  background:
    linear-gradient(
      135deg,
      #5d8ed0,
      #17457f
    );

  box-shadow:
    inset 0 2px 3px rgba(255,255,255,.28),
    0 12px 28px rgba(25,62,110,.25);

  cursor:pointer;

  display:flex;
  align-items:center;
  justify-content:center;
}

.send-arrow{
  width:45px;
  height:60px;

  position:relative;
}

.send-arrow::before{
  content:"";

  position:absolute;

  width:6px;
  height:57px;

  background:white;

  border-radius:10px;

  left:20px;
  top:3px;
}

.send-arrow::after{
  content:"";

  position:absolute;

  width:31px;
  height:31px;

  border-left:6px solid white;
  border-top:6px solid white;

  transform:rotate(45deg);

  top:2px;
  left:7px;
}


/* =========================================================
   MENU OVERLAY
========================================================= */

.menu-overlay{
  position:absolute;

  inset:0;

  background:rgba(5,24,50,.25);

  backdrop-filter:blur(10px);

  opacity:0;
  visibility:hidden;

  transition:.3s ease;

  z-index:500;
}

.menu-overlay.active{
  opacity:1;
  visibility:visible;
}


/* =========================================================
   SIDE MENU
========================================================= */

.side-menu{
  position:absolute;

  top:0;
  left:0;

  width:440px;
  height:100%;

  padding:150px 28px 40px;

  background:
    linear-gradient(
      145deg,
      rgba(232,243,253,.95),
      rgba(172,203,233,.90)
    );

  border-right:2px solid rgba(255,255,255,.7);

  backdrop-filter:blur(35px);

  transform:translateX(-110%);

  transition:.4s cubic-bezier(.77,0,.18,1);

  z-index:600;
}

.side-menu.active{
  transform:translateX(0);
}

.menu-profile{
  display:flex;
  align-items:center;

  gap:18px;

  padding:22px;

  border-radius:25px;

  background:rgba(255,255,255,.32);

  border:1px solid rgba(255,255,255,.55);

  margin-bottom:25px;
}

.profile-circle{
  width:65px;
  height:65px;

  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  background:rgba(255,255,255,.45);

  font-size:30px;
}

.menu-profile h2{
  font-size:26px;
  color:var(--navy);
}

.menu-profile p{
  margin-top:4px;
  font-size:14px;
  color:#55769b;
}

.menu-items{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.menu-item{
  height:70px;

  padding:0 20px;

  border-radius:18px;

  display:flex;
  align-items:center;

  gap:15px;

  background:rgba(255,255,255,.28);

  border:1px solid rgba(255,255,255,.45);

  color:var(--navy);

  cursor:pointer;
}

.menu-item span{
  font-size:23px;
  width:30px;
}

.menu-item p{
  flex:1;
  font-size:16px;
}


/* =========================================================
   ABOUT POPUP
========================================================= */

.about-popup{
  position:absolute;

  inset:0;

  display:flex;
  align-items:center;
  justify-content:center;

  background:rgba(5,25,55,.25);

  backdrop-filter:blur(12px);

  opacity:0;
  visibility:hidden;

  transition:.3s ease;

  z-index:700;
}

.about-popup.active{
  opacity:1;
  visibility:visible;
}

.about-card{
  width:650px;

  padding:60px 45px;

  text-align:center;

  border-radius:40px;

  background:
    linear-gradient(
      145deg,
      rgba(240,248,255,.92),
      rgba(185,211,239,.82)
    );

  border:2px solid rgba(255,255,255,.7);

  color:var(--navy);

  position:relative;
}

.about-card h2{
  font-size:34px;
  margin-bottom:15px;
}

.about-card p{
  font-size:16px;
  line-height:1.7;
  color:#3e628c;
}

.close-popup{
  position:absolute;

  top:18px;
  right:25px;

  border:none;
  background:none;

  font-size:32px;

  color:var(--navy);

  cursor:pointer;
}


/* =========================================================
   RESPONSIVE MASTER SCALE

   DO NOT rearrange the UI.
   Scale the exact 1024x1536 composition.
========================================================= */

@media (max-aspect-ratio: 2/3){

  .app{
    transform:scale(
      calc(100vw / 1024)
    );
  }

}


/*
   Desktop / Laptop:

   Fit canvas vertically first.
*/

@media (min-aspect-ratio: 2/3){

  .app{
    transform:scale(
      calc(100vh / 1536)
    );
  }

}


/* =========================================================
   VERY SMALL SCREENS
========================================================= */

@media(max-width:400px){

  .app{
    transform:scale(
      calc(100vw / 1024)
    );
  }

}

</style>
</head>
