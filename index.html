<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Sanitas Melete AI</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:'Poppins',sans-serif;
}

body{
  background:#efe3d6;
}

.app{
  width:100%;
  height:100dvh;
  position:relative;
  overflow:hidden;

  background:
  radial-gradient(circle at top,
  #f8eee4 0%,
  #efe3d6 45%,
  #eadccd 100%);
}

/* TOP BAR */

.top-bar{
  width:100%;
  display:flex;
  justify-content:space-between;
  align-items:center;

  padding:28px 38px 0;

  position:relative;
  z-index:1000;
}

.left-top{
  display:flex;
  align-items:center;
  gap:16px;
}

.glass-btn{
  width:58px;
  height:58px;

  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  background:
  linear-gradient(
  145deg,
  rgba(255,255,255,0.75),
  rgba(255,255,255,0.18)
  );

  border:1px solid rgba(255,255,255,0.72);

  backdrop-filter:blur(18px);

  box-shadow:
  inset 0 1px 1px rgba(255,255,255,0.8),
  0 8px 22px rgba(180,140,100,0.10);

  cursor:pointer;
}

.glass-btn i{
  font-style:normal;
  color:#062d71;
  font-size:26px;
}

.brand{
  color:#062d71;
  font-size:30px;
  font-family:'Cormorant Garamond',serif;
  font-weight:600;
}

/* CHAT AREA */

.chat-area{
  position:absolute;

  top:110px;
  left:0;

  width:100%;
  height:calc(100vh - 220px);

  overflow-y:auto;

  padding:20px;

  display:flex;
  flex-direction:column;

  gap:14px;

  z-index:3;
}

/* CENTER */

.center{
  position:absolute;

  top:48%;
  left:50%;

  transform:translate(-50%,-50%);

  width:100%;

  text-align:center;

  pointer-events:none;
}

/* LOGO */

.logo-ring{
  width:290px;
  height:290px;

  margin:auto;

  border-radius:50%;

  position:relative;

  display:flex;
  align-items:center;
  justify-content:center;

  background:
  linear-gradient(
  145deg,
  rgba(255,255,255,0.24),
  rgba(255,255,255,0.05)
  );

  border:1px solid rgba(255,255,255,0.48);

  box-shadow:
  inset 0 0 18px rgba(255,255,255,0.25),
  0 0 45px rgba(255,255,255,0.08);
}

.logo-ring::before{
  content:'';

  position:absolute;

  width:360px;
  height:360px;

  border-radius:50%;

  background:rgba(255,255,255,0.05);

  filter:blur(2px);
}

.infinity{
  font-size:132px;
  color:#062d71;
  z-index:2;
}

.hero-title{
  margin-top:34px;

  color:#062d71;

  font-size:64px;

  font-family:'Cormorant Garamond',serif;

  font-weight:700;

  line-height:1;
}

.spark{
  color:#c79a3d;
}

.divider{
  width:260px;

  margin:18px auto;

  display:flex;
  align-items:center;
  justify-content:center;

  gap:14px;
}

.divider span{
  width:90px;
  height:1px;
  background:#c79a3d;
}

.divider p{
  color:#c79a3d;
  font-size:18px;
}

.sub{
  color:#b78633;

  font-size:30px;

  font-family:'Cormorant Garamond',serif;
}

/* MESSAGES */

.message{
  max-width:75%;

  padding:18px 22px;

  border-radius:24px;

  font-size:16px;

  line-height:1.6;

  animation:fadeUp 0.25s ease;

  word-wrap:break-word;
}

.user-message{
  margin-left:auto;

  background:#062d71;

  color:white;

  border-bottom-right-radius:8px;
}

.ai-message{
  margin-right:auto;

  background:
  linear-gradient(
  145deg,
  rgba(255,255,255,0.75),
  rgba(255,255,255,0.22)
  );

  border:1px solid rgba(255,255,255,0.7);

  backdrop-filter:blur(16px);

  color:#222;

  border-bottom-left-radius:8px;
}

@keyframes fadeUp{

  from{
    opacity:0;
    transform:translateY(20px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }

}

/* SEARCH */

.search-wrap{
  position:absolute;

  left:50%;
  bottom:20px;

  transform:translateX(-50%);

  width:92%;
  height:78px;

  border-radius:32px;

  padding:0 16px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  background:
  linear-gradient(
  145deg,
  rgba(255,255,255,0.58),
  rgba(255,255,255,0.18)
  );

  border:1px solid rgba(255,255,255,0.72);

  backdrop-filter:blur(18px);

  box-shadow:
  inset 0 0 12px rgba(255,255,255,0.4),
  0 12px 28px rgba(180,140,100,0.10);

  z-index:1000;
}

.search-left{
  display:flex;
  align-items:center;
  gap:14px;

  width:100%;
}

.circle-btn{
  width:50px;
  height:50px;

  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  background:
  linear-gradient(
  145deg,
  rgba(255,255,255,0.72),
  rgba(255,255,255,0.20)
  );

  border:1px solid rgba(255,255,255,0.7);

  box-shadow:
  inset 0 0 8px rgba(255,255,255,0.5),
  0 5px 16px rgba(180,140,100,0.10);

  cursor:pointer;
}

.circle-btn span{
  color:#b8862e;
  font-size:24px;
}

.search-input{
  width:100%;

  border:none;
  outline:none;

  background:transparent;

  color:#7d756e;

  font-size:17px;

  font-family:'Poppins',sans-serif;
}

.search-input::placeholder{
  color:#7d756e;
}

/* MOBILE */

@media (max-width:768px){

  .top-bar{
    padding:22px 18px 0;
  }

  .brand{
    font-size:15px;
  }

  .glass-btn{
    width:44px;
    height:44px;
  }

  .glass-btn i{
    font-size:20px;
  }

  .logo-ring{
    width:190px;
    height:190px;
  }

  .logo-ring::before{
    width:240px;
    height:240px;
  }

  .infinity{
    font-size:92px;
  }

  .hero-title{
    margin-top:24px;
    font-size:30px;
  }

  .divider{
    width:170px;
    margin:12px auto;
    gap:10px;
  }

  .divider span{
    width:55px;
  }

  .divider p{
    font-size:14px;
  }

  .sub{
    font-size:18px;
  }

  .search-wrap{
    width:93%;
    height:72px;
    bottom:12px;
    border-radius:28px;
    padding:0 12px;
  }

}

</style>
</head>

<body>

<div class="app">

<!-- TOP -->

<div class="top-bar">

<div class="left-top">

<div class="glass-btn">
<i>☰</i>
</div>

<div class="brand">
Sanitas Melete
</div>

</div>

<div class="glass-btn">
<i>∞</i>
</div>

</div>

<!-- CHAT -->

<div class="chat-area" id="chatArea"></div>

<!-- CENTER -->

<div class="center">

<div class="logo-ring">
<div class="infinity">∞</div>
</div>

<div class="hero-title">
Hi iam mebi<span class="spark">✦</span>
</div>

<div class="divider">
<span></span>
<p>✦</p>
<span></span>
</div>

<div class="sub">
your study buddy
</div>

</div>

<!-- SEARCH -->

<div class="search-wrap">

<div class="search-left">

<div class="circle-btn">
<span>⌘</span>
</div>

<input
type="text"
class="search-input"
placeholder="type your questions here"
/>

</div>

<div class="circle-btn send-btn">
<span>↑</span>
</div>

</div>

</div>

<script>

const input =
document.querySelector(".search-input");

const sendBtn =
document.querySelector(".send-btn");

const chatArea =
document.getElementById("chatArea");

/* API KEY */

const API_KEY =
"PASTE_YOUR_GEMINI_API_KEY";

/* ADD MESSAGE */

function addMessage(text, type){

  const div =
  document.createElement("div");

  div.classList.add("message");

  if(type === "user"){
    div.classList.add("user-message");
  }else{
    div.classList.add("ai-message");
  }

  div.innerText = text;

  chatArea.appendChild(div);

  chatArea.scrollTop =
  chatArea.scrollHeight;
}

/* SEND MESSAGE */

async function sendMessage(){

  const text =
  input.value.trim();

  if(text === "") return;

  addMessage(text, "user");

  input.value = "";

  try{

    const response =
    await fetch(

      "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=" + API_KEY,

      {
        method:"POST",

        headers:{
          "Content-Type":"application/json"
        },

        body:JSON.stringify({

          contents:[
            {
              parts:[
                {
                  text:text
                }
              ]
            }
          ]

        })

      }

    );

    const data =
    await response.json();

    const aiText =
    data.candidates[0]
    .content.parts[0].text;

    addMessage(aiText, "ai");

  }

  catch(error){

    addMessage(
    "Error from AI service.",
    "ai"
    );

    console.log(error);

  }

}

/* BUTTON */

sendBtn.addEventListener(
"click",
sendMessage
);

/* ENTER */

input.addEventListener(
"keypress",
e=>{

if(e.key === "Enter"){
sendMessage();
}

});

</script>

</body>
</html>
