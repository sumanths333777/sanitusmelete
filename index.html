<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Sanitas Melete AI</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:'Poppins',sans-serif;
}

body{
  background:#efe3d6;
}

.app{
  width:100%;
  height:100dvh;
  position:relative;
  overflow:hidden;

  background:
  radial-gradient(circle at top,
  #f8eee4 0%,
  #efe3d6 45%,
  #eadccd 100%);
}

/* TOP */

.top-bar{
  width:100%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:28px 38px 0;
}

.left-top{
  display:flex;
  align-items:center;
  gap:16px;
}

.glass-btn{
  width:58px;
  height:58px;
  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  background:
  linear-gradient(
  145deg,
  rgba(255,255,255,0.75),
  rgba(255,255,255,0.18)
  );

  border:1px solid rgba(255,255,255,0.72);

  backdrop-filter:blur(18px);

  box-shadow:
  inset 0 1px 1px rgba(255,255,255,0.8),
  0 8px 22px rgba(180,140,100,0.10);

  cursor:pointer;
}

.glass-btn i{
  font-style:normal;
  color:#062d71;
  font-size:26px;
}

.brand{
  color:#062d71;
  font-size:30px;
  font-family:'Cormorant Garamond',serif;
  font-weight:600;
}

/* CENTER */

.center{
  position:absolute;
  top:48%;
  left:50%;
  transform:translate(-50%,-50%);
  width:100%;
  text-align:center;
}

.logo-ring{
  width:290px;
  height:290px;
  margin:auto;
  border-radius:50%;
  position:relative;

  display:flex;
  align-items:center;
  justify-content:center;

  background:
  linear-gradient(
  145deg,
  rgba(255,255,255,0.24),
  rgba(255,255,255,0.05)
  );

  border:1px solid rgba(255,255,255,0.48);

  box-shadow:
  inset 0 0 18px rgba(255,255,255,0.25),
  0 0 45px rgba(255,255,255,0.08);
}

.logo-ring::before{
  content:'';
  position:absolute;

  width:360px;
  height:360px;

  border-radius:50%;

  background:rgba(255,255,255,0.05);

  filter:blur(2px);
}

.infinity{
  font-size:132px;
  color:#062d71;
  z-index:2;
}

.hero-title{
  margin-top:34px;
  color:#062d71;
  font-size:64px;
  font-family:'Cormorant Garamond',serif;
  font-weight:700;
  line-height:1;
}

.spark{
  color:#c79a3d;
}

.divider{
  width:260px;
  margin:18px auto;

  display:flex;
  align-items:center;
  justify-content:center;

  gap:14px;
}

.divider span{
  width:90px;
  height:1px;
  background:#c79a3d;
}

.divider p{
  color:#c79a3d;
  font-size:18px;
}

.sub{
  color:#b78633;
  font-size:30px;
  font-family:'Cormorant Garamond',serif;
}

/* SEARCH */

.search-wrap{
  position:absolute;

  left:50%;
  bottom:20px;

  transform:translateX(-50%);

  width:92%;
  height:78px;

  border-radius:32px;

  padding:0 16px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  background:
  linear-gradient(
  145deg,
  rgba(255,255,255,0.58),
  rgba(255,255,255,0.18)
  );

  border:1px solid rgba(255,255,255,0.72);

  backdrop-filter:blur(18px);

  box-shadow:
  inset 0 0 12px rgba(255,255,255,0.4),
  0 12px 28px rgba(180,140,100,0.10);
}

.search-left{
  display:flex;
  align-items:center;
  gap:14px;
  width:100%;
}

.circle-btn{
  width:50px;
  height:50px;

  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  background:
  linear-gradient(
  145deg,
  rgba(255,255,255,0.72),
  rgba(255,255,255,0.20)
  );

  border:1px solid rgba(255,255,255,0.7);

  box-shadow:
  inset 0 0 8px rgba(255,255,255,0.5),
  0 5px 16px rgba(180,140,100,0.10);

  cursor:pointer;
}

.circle-btn span{
  color:#b8862e;
  font-size:24px;
}

.search-input{
  width:100%;
  border:none;
  outline:none;
  background:transparent;
  color:#7d756e;
  font-size:17px;
  font-family:'Poppins',sans-serif;
}

.search-input::placeholder{
  color:#7d756e;
}

/* SIDE MENU */

.menu-overlay{
  position:fixed;
  inset:0;

  background:rgba(0,0,0,0.08);

  backdrop-filter:blur(8px);

  opacity:0;
  visibility:hidden;

  transition:0.35s ease;

  z-index:999;
}

.menu-overlay.active{
  opacity:1;
  visibility:visible;
}

.side-menu{
  position:fixed;
  top:0;
  left:0;

  width:285px;
  max-width:82%;
  height:100dvh;

  padding:18px 14px;

  background:
  linear-gradient(
  145deg,
  rgba(255,255,255,0.75),
  rgba(255,255,255,0.25)
  );

  border-right:1px solid rgba(255,255,255,0.7);

  backdrop-filter:blur(24px);

  box-shadow:
  0 10px 40px rgba(0,0,0,0.08);

  transform:translateX(-100%);
  transition:transform 0.35s ease;

  z-index:1000;
}

.side-menu.active{
  transform:translateX(0);
}

/* ABOUT */

.about-popup{
  position:fixed;
  inset:0;

  background:rgba(0,0,0,0.10);

  backdrop-filter:blur(10px);

  display:flex;
  align-items:center;
  justify-content:center;

  opacity:0;
  visibility:hidden;

  transition:0.3s ease;

  z-index:9999;
}

.about-popup.active{
  opacity:1;
  visibility:visible;
}

.about-card{
  width:88%;
  max-width:360px;

  padding:30px 24px;

  border-radius:30px;

  text-align:center;

  background:
  linear-gradient(
  145deg,
  rgba(255,255,255,0.72),
  rgba(255,255,255,0.18)
  );

  border:1px solid rgba(255,255,255,0.7);

  backdrop-filter:blur(18px);
}

.about-logo{
  font-size:52px;
  color:#062d71;
}

.close-popup{
  position:absolute;
  top:16px;
  right:20px;

  border:none;
  background:none;

  font-size:22px;
  color:#7b7066;

  cursor:pointer;
}

/* MOBILE */

@media (max-width:768px){

.top-bar{
padding:22px 18px 0;
}

.brand{
font-size:15px;
}

.glass-btn{
width:44px;
height:44px;
}

.glass-btn i{
font-size:20px;
}

.logo-ring{
width:190px;
height:190px;
}

.logo-ring::before{
width:240px;
height:240px;
}

.infinity{
font-size:92px;
}

.hero-title{
margin-top:24px;
font-size:30px;
}

.divider{
width:170px;
margin:12px auto;
gap:10px;
}

.divider span{
width:55px;
}

.divider p{
font-size:14px;
}

.sub{
font-size:18px;
}

.search-wrap{
width:93%;
height:72px;
bottom:12px;
border-radius:28px;
padding:0 12px;
}

}

</style>
</head>

<body>

<div class="app">

<div class="menu-overlay" id="menuOverlay" onclick="closeMenu()"></div>

<div class="side-menu" id="sideMenu"></div>

<!-- TOP -->

<div class="top-bar">

<div class="left-top">

<div class="glass-btn" onclick="openMenu()">
<i>☰</i>
</div>

<div class="brand">
Sanitas Melete
</div>

</div>

<div class="glass-btn" onclick="openAbout()">
<i>∞</i>
</div>

</div>

<!-- CENTER -->

<div class="center">

<div class="logo-ring">
<div class="infinity">∞</div>
</div>

<div class="hero-title">
Hi iam mebi<span class="spark">✦</span>
</div>

<div class="divider">
<span></span>
<p>✦</p>
<span></span>
</div>

<div class="sub">
your study buddy
</div>

</div>

<!-- SEARCH -->

<div class="search-wrap">

<div class="search-left">

<div class="circle-btn">
<span>⌘</span>
</div>

<input
id="userInput"
type="text"
class="search-input"
placeholder="type your questions here"
/>

</div>

<div
class="circle-btn"
onclick="sendMessage()"
>
<span>↑</span>
</div>

</div>

</div>

<!-- ABOUT -->

<div class="about-popup" id="aboutPopup">

<div class="about-card">

<button class="close-popup" onclick="closeAbout()">
✕
</button>

<div class="about-logo">∞</div>

<h2 style="color:#062d71;font-family:'Cormorant Garamond',serif;font-size:34px;margin-top:10px;">
Sanitas Melete AI
</h2>

<p style="color:#b8862e;font-size:18px;margin-top:6px;">
your study buddy
</p>

<div style="width:70px;height:1px;background:#d2a34f;margin:18px auto;"></div>

<p style="color:#6f645b;line-height:1.7;font-size:16px;">
Premium AI learning platform crafted for students with elegant design and intelligent study experience.
</p>

<p style="margin-top:18px;color:#062d71;font-size:22px;font-family:'Cormorant Garamond',serif;">
Founder — SK
</p>

</div>

</div>

<script>

function openAbout(){
document
.getElementById("aboutPopup")
.classList.add("active");
}

function closeAbout(){
document
.getElementById("aboutPopup")
.classList.remove("active");
}

const sideMenu =
document.getElementById("sideMenu");

const menuOverlay =
document.getElementById("menuOverlay");

function openMenu(){
sideMenu.classList.add("active");
menuOverlay.classList.add("active");
}

function closeMenu(){
sideMenu.classList.remove("active");
menuOverlay.classList.remove("active");
}

/* AI SEARCH */

async function sendMessage(){

const input =
document.getElementById("userInput");

const message =
input.value.trim();

if(message === "") return;

try{

const response = await fetch("/api/ask",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
message:message
})

});

const data =
await response.json();

alert(data.reply);

input.value = "";

}catch(err){

alert("AI connection error");

}

}

/* ENTER */

document
.getElementById("userInput")
.addEventListener("keypress", function(e){

if(e.key === "Enter"){
sendMessage();
}

});

</script>

</body>
</html>
