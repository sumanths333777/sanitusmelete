<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1,
  maximum-scale=1"/>"/>

<title>Sanitas Melete AI</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Instrument+Serif&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#efe1d2;
  overflow:hidden;
  font-family:'Poppins',sans-serif;
}

.app{
  width:100%;
  height:100vh;
  position:relative;
  background:
  radial-gradient(circle at top,#f7ecdf 0%,#efe1d2 45%,#ead9c6 100%);
}

/* TOP BAR */

.top-bar{
  width:100%;
  padding:28px 24px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.left-top{
  display:flex;
  align-items:center;
  gap:18px;
}

.brand{
  font-size:30px;
  color:#062b67;
  font-family:'Cormorant Garamond',serif;
  font-weight:600;
  letter-spacing:.3px;
}

/* GLASS BUTTONS */

.glass-btn{
  width:66px;
  height:66px;
  border-radius:50%;
  background:
  linear-gradient(
  145deg,
  rgba(255,255,255,0.75),
  rgba(255,255,255,0.28)
  );

  border:1px solid rgba(255,255,255,0.7);

  box-shadow:
  inset 1px 1px 1px rgba(255,255,255,0.8),
  inset -2px -2px 6px rgba(210,190,160,0.3),
  0 10px 30px rgba(170,140,100,0.12);

  backdrop-filter:blur(12px);

  display:flex;
  justify-content:center;
  align-items:center;
}

.glass-btn i{
  color:#062b67;
  font-size:32px;
  font-style:normal;
  font-weight:600;
}

/* CENTER AREA */

.center{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  width:100%;
  text-align:center;
}

/* MAIN LOGO */

.logo-ring{
  width:430px;
  height:430px;
  margin:auto;
  border-radius:50%;

  background:
  radial-gradient(circle at top left,
  rgba(255,255,255,0.55),
  rgba(255,255,255,0.08));

  border:1px solid rgba(255,255,255,0.5);

  box-shadow:
  inset 0 0 18px rgba(255,255,255,0.45),
  0 0 40px rgba(255,248,230,0.7),
  0 0 80px rgba(255,255,255,0.35);

  display:flex;
  justify-content:center;
  align-items:center;

  position:relative;
}

.logo-ring::before{
  content:'';
  position:absolute;
  width:520px;
  height:520px;
  border-radius:50%;
  background:rgba(255,255,255,0.07);
  filter:blur(2px);
}

.infinity{
  font-size:220px;
  color:#022d72;
  z-index:2;
  font-weight:600;
}

/* TEXT */

.hero-title{
  margin-top:70px;
  font-size:76px;
  color:#062b67;
  font-family:'Cormorant Garamond',serif;
  font-weight:700;
  letter-spacing:.4px;
}

.spark{
  color:#c79a3d;
}

.divider{
  margin:18px auto 16px;
  width:320px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:16px;
}

.divider span{
  width:120px;
  height:1px;
  background:#cda55a;
}

.divider p{
  color:#cda55a;
  font-size:20px;
}

.sub{
  color:#b78633;
  font-size:34px;
  font-family:'Cormorant Garamond',serif;
  font-weight:500;
}

/* SEARCH BAR */

.search-wrap{
  position:absolute;
  bottom:34px;
  left:50%;
  transform:translateX(-50%);

  width:92%;
  height:118px;

  border-radius:42px;

  background:
  linear-gradient(
  135deg,
  rgba(255,255,255,0.52),
  rgba(255,255,255,0.18)
  );

  border:1px solid rgba(255,255,255,0.7);

  backdrop-filter:blur(18px);

  box-shadow:
  inset 0 0 8px rgba(255,255,255,0.55),
  0 18px 35px rgba(180,140,100,0.15);

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 24px;
}

.search-left{
  display:flex;
  align-items:center;
  gap:22px;
}

.circle-btn{
  width:72px;
  height:72px;
  border-radius:50%;

  background:
  linear-gradient(
  145deg,
  rgba(255,255,255,0.7),
  rgba(255,255,255,0.28)
  );

  border:1px solid rgba(255,255,255,0.7);

  display:flex;
  align-items:center;
  justify-content:center;

  box-shadow:
  inset 0 0 8px rgba(255,255,255,0.6),
  0 8px 20px rgba(180,140,100,0.15);
}

.circle-btn span{
  font-size:42px;
  color:#b8862e;
}

.placeholder{
  color:#7c746c;
  font-size:20px;
  font-weight:400;
}
@media(max-width:768px){

  .top-bar{
    padding:22px 20px;
  }

  .brand{
    font-size:16px;
  }

  .glass-btn{
    width:48px;
    height:48px;
  }

  .glass-btn i{
    font-size:22px;
  }

  /* MAIN CENTER FIX */

  .center{
    position:absolute;
    top:52%;
    left:50%;
    transform:translate(-50%,-50%);
    width:100%;
    padding:0 20px;
    text-align:center;
  }

  /* LOGO */

  .logo-ring{
    width:220px;
    height:220px;
    margin:auto;
  }

  .logo-ring::before{
    width:270px;
    height:270px;
  }

  .infinity{
    font-size:105px;
  }

  /* TEXT */

  .hero-title{
    margin-top:28px;
    font-size:30px;
    line-height:1;
  }

  .divider{
    width:180px;
    margin:12px auto 10px;
    gap:12px;
  }

  .divider span{
    width:60px;
  }

  .divider p{
    font-size:16px;
  }

  .sub{
    font-size:18px;
    line-height:1;
  }

  /* SEARCH BAR */

  .search-wrap{
    width:92%;
    height:78px;
    bottom:14px;
    border-radius:30px;
    padding:0 14px;
  }

  .search-left{
    gap:12px;
  }

  .circle-btn{
    width:50px;
    height:50px;
  }

  .circle-btn span{
    font-size:26px;
  }

  .placeholder{
    font-size:14px;
    white-space:nowrap;
  }

}
}

}

</style>
</head>

<body>

<div class="app">

  <!-- TOP -->

  <div class="top-bar">

    <div class="left-top">

      <div class="glass-btn">
        <i>☰</i>
      </div>

      <div class="brand">
        Sanitas Melete
      </div>

    </div>

    <div class="glass-btn">
      <i>∞</i>
    </div>

  </div>

  <!-- CENTER -->

  <div class="center">

    <div class="logo-ring">
      <div class="infinity">∞</div>
    </div>

    <div class="hero-title">
      Hi iam mebi<span class="spark">✦</span>
    </div>

    <div class="divider">
      <span></span>
      <p>✦</p>
      <span></span>
    </div>

    <div class="sub">
      your study buddy
    </div>

  </div>

  <!-- SEARCH BAR -->

  <div class="search-wrap">

    <div class="search-left">

      <div class="circle-btn">
        <span>⌘</span>
      </div>

      <div class="placeholder">
        type your questions here
      </div>

    </div>

    <div class="circle-btn">
      <span>↑</span>
    </div>

  </div>

</div>

</body>
</html>
