<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Sanitas Melete AI</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Cormorant+Garamond:wght@400;500;600&display=swap" rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
}

body{
  font-family:'Cormorant Garamond',serif;

  background:
  radial-gradient(circle at top,
  #f8eee4 0%,
  #efe3d6 45%,
  #eadccd 100%);
}

/* MAIN */

.app{
  width:100%;
  height:100dvh;
  position:relative;
  overflow:hidden;
}

/* SOFT LIGHTS */

.app::before{
  content:'';

  position:absolute;
  inset:-20%;

  background:
  radial-gradient(circle at 20% 20%, rgba(255,255,255,0.28), transparent 25%),
  radial-gradient(circle at 80% 70%, rgba(255,255,255,0.18), transparent 30%);

  filter:blur(60px);

  z-index:0;
}

/* TOP BAR */

.top-bar{
  position:relative;
  z-index:2;

  width:100%;

  display:flex;
  justify-content:space-between;
  align-items:center;

  padding:28px 34px 0;
}

.left-top{
  display:flex;
  align-items:center;
  gap:16px;
}

/* GLASS BUTTON */

.glass-btn{
  width:58px;
  height:58px;

  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  background:
  linear-gradient(
  145deg,
  rgba(255,255,255,0.75),
  rgba(255,255,255,0.18)
  );

  border:1px solid rgba(255,255,255,0.72);

  backdrop-filter:blur(18px);

  box-shadow:
  inset 0 1px 1px rgba(255,255,255,0.8),
  0 8px 24px rgba(220,180,120,0.18),
  0 0 18px rgba(255,240,220,0.45);
}

.glass-btn i{
  font-style:normal;
  color:#062d71;
  font-size:26px;
}

/* BRAND */

.brand{
  color:#062d71;

  font-size:30px;

  font-family:'Playfair Display',serif;

  font-weight:700;

  letter-spacing:0.3px;
}

/* CENTER */

.center{
  position:absolute;

  top:50%;
  left:50%;

  transform:translate(-50%,-50%);

  width:100%;

  text-align:center;

  z-index:2;
}

/* LOGO RING */

.logo-ring{
  width:320px;
  height:320px;

  margin:auto;

  border-radius:50%;

  position:relative;

  display:flex;
  align-items:center;
  justify-content:center;

  background:
  linear-gradient(
  145deg,
  rgba(255,255,255,0.28),
  rgba(255,255,255,0.08)
  );

  border:1px solid rgba(255,255,255,0.55);

  backdrop-filter:blur(22px);

  box-shadow:
  inset 0 0 28px rgba(255,255,255,0.35),
  0 0 40px rgba(255,230,180,0.35),
  0 0 90px rgba(255,240,220,0.18);
}

.logo-ring::before{
  content:'';

  position:absolute;

  width:390px;
  height:390px;

  border-radius:50%;

  border:1px solid rgba(255,255,255,0.14);

  opacity:0.6;
}

/* LOGO */

.infinity{
  font-size:145px;
  color:#062d71;
  z-index:2;
}

/* TITLE */

.hero-title{
  margin-top:42px;

  color:#062d71;

  font-size:68px;

  font-family:'Playfair Display',serif;

  font-weight:700;

  line-height:1;
}

.spark{
  color:#c79a3d;
}

/* DIVIDER */

.divider{
  width:260px;

  margin:18px auto;

  display:flex;
  align-items:center;
  justify-content:center;

  gap:14px;
}

.divider span{
  width:90px;
  height:1px;
  background:#c79a3d;
}

.divider p{
  color:#c79a3d;
  font-size:18px;
}

/* SUBTEXT */

.sub{
  color:#b78633;

  font-size:34px;

  font-family:'Cormorant Garamond',serif;

  font-weight:500;
}

/* SEARCH BAR */

.search-wrap{
  position:absolute;

  left:50%;
  bottom:20px;

  transform:translateX(-50%);

  width:92%;
  height:82px;

  border-radius:34px;

  padding:0 18px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  z-index:2;

  background:
  linear-gradient(
  145deg,
  rgba(255,255,255,0.58),
  rgba(255,255,255,0.16)
  );

  border:1px solid rgba(255,255,255,0.78);

  backdrop-filter:blur(22px);

  box-shadow:
  inset 0 0 14px rgba(255,255,255,0.45),
  0 12px 28px rgba(220,180,120,0.14),
  0 0 22px rgba(255,240,220,0.22);
}

.search-left{
  display:flex;
  align-items:center;
  gap:14px;
}

/* CIRCLE BUTTONS */

.circle-btn{
  width:54px;
  height:54px;

  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  background:
  linear-gradient(
  145deg,
  rgba(255,255,255,0.76),
  rgba(255,255,255,0.20)
  );

  border:1px solid rgba(255,255,255,0.75);

  box-shadow:
  inset 0 0 8px rgba(255,255,255,0.5),
  0 6px 18px rgba(220,180,120,0.14),
  0 0 14px rgba(255,240,220,0.22);
}

.circle-btn span{
  color:#b8862e;
  font-size:28px;
}

/* PLACEHOLDER */

.placeholder{
  color:#7d756e;

  font-size:20px;

  font-family:'Cormorant Garamond',serif;

  font-weight:500;
}

/* MOBILE */

@media (max-width:768px){

  .top-bar{
    padding:24px 22px 0;
  }

  .brand{
    font-size:18px;
  }

  .glass-btn{
    width:48px;
    height:48px;
  }

  .glass-btn i{
    font-size:22px;
  }

  .logo-ring{
    width:210px;
    height:210px;
  }

  .logo-ring::before{
    width:260px;
    height:260px;
  }

  .infinity{
    font-size:96px;
  }

  .hero-title{
    margin-top:28px;
    font-size:42px;
  }

  .divider{
    width:180px;
    margin:14px auto;
  }

  .divider span{
    width:58px;
  }

  .divider p{
    font-size:15px;
  }

  .sub{
    font-size:22px;
  }

  .search-wrap{
    width:94%;
    height:76px;

    bottom:14px;

    border-radius:30px;

    padding:0 14px;
  }

  .circle-btn{
    width:46px;
    height:46px;
  }

  .circle-btn span{
    font-size:22px;
  }

  .placeholder{
    font-size:16px;
  }

}

</style>
</head>

<body>

<div class="app">

  <!-- TOP -->

  <div class="top-bar">

    <div class="left-top">

      <div class="glass-btn">
        <i>☰</i>
      </div>

      <div class="brand">
        Sanitas Melete
      </div>

    </div>

    <div class="glass-btn">
      <i>∞</i>
    </div>

  </div>

  <!-- CENTER -->

  <div class="center">

    <div class="logo-ring">
      <div class="infinity">∞</div>
    </div>

    <div class="hero-title">
      Hi iam mebi<span class="spark"> ✦</span>
    </div>

    <div class="divider">
      <span></span>
      <p>✦</p>
      <span></span>
    </div>

    <div class="sub">
      your study buddy
    </div>

  </div>

  <!-- SEARCH -->

  <div class="search-wrap">

    <div class="search-left">

      <div class="circle-btn">
        <span>⌘</span>
      </div>

      <div class="placeholder">
        Put your documents or photos...
      </div>

    </div>

    <div class="circle-btn">
      <span>↑</span>
    </div>

  </div>

</div>

</body>
</html>
