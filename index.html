<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Sanitas Melete AI</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:'Poppins',sans-serif;
}

body{
  background:#efe3d6;
}

/* APP */

.app{
  width:100%;
  height:100dvh;

  position:relative;
  overflow:hidden;

  display:flex;
  flex-direction:column;

  background:
  radial-gradient(circle at top,
  #f8eee4 0%,
  #efe3d6 45%,
  #eadccd 100%);
}

/* TOP BAR */

.top-bar{
  width:100%;

  display:flex;
  justify-content:space-between;
  align-items:center;

  padding:clamp(18px,2vw,30px)
          clamp(18px,2.5vw,38px)
          0;
}

.left-top{
  display:flex;
  align-items:center;
  gap:clamp(10px,1vw,16px);
}

/* GLASS BUTTON */

.glass-btn{
  width:clamp(44px,4vw,62px);
  height:clamp(44px,4vw,62px);

  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  background:
  linear-gradient(
  145deg,
  rgba(255,255,255,0.76),
  rgba(255,255,255,0.18)
  );

  border:1px solid rgba(255,255,255,0.72);

  backdrop-filter:blur(16px);

  box-shadow:
  inset 0 1px 1px rgba(255,255,255,0.8),
  0 8px 22px rgba(180,140,100,0.10);
}

.glass-btn i{
  font-style:normal;
  color:#062d71;
  font-size:clamp(18px,1.7vw,28px);
}

/* BRAND */

.brand{
  color:#062d71;

  font-size:clamp(15px,2vw,32px);

  font-family:'Cormorant Garamond',serif;

  font-weight:600;
}

/* CENTER */

.center{
  flex:1;

  display:flex;
  flex-direction:column;

  align-items:center;
  justify-content:center;

  text-align:center;

  padding:20px;

  margin-top:clamp(-10px,-2vw,-40px);
}

/* LOGO */

.logo-ring{
  width:clamp(190px,24vw,330px);
  height:clamp(190px,24vw,330px);

  border-radius:50%;

  position:relative;

  display:flex;
  align-items:center;
  justify-content:center;

  background:
  linear-gradient(
  145deg,
  rgba(255,255,255,0.24),
  rgba(255,255,255,0.05)
  );

  border:1px solid rgba(255,255,255,0.48);

  box-shadow:
  inset 0 0 18px rgba(255,255,255,0.25),
  0 0 45px rgba(255,255,255,0.08);
}

.logo-ring::before{
  content:'';

  position:absolute;

  width:clamp(240px,30vw,420px);
  height:clamp(240px,30vw,420px);

  border-radius:50%;

  background:rgba(255,255,255,0.05);

  filter:blur(2px);
}

.infinity{
  font-size:clamp(92px,10vw,160px);

  color:#062d71;

  z-index:2;
}

/* TITLE */

.hero-title{
  margin-top:clamp(24px,3vw,42px);

  color:#062d71;

  font-size:clamp(30px,5vw,62px);

  font-family:'Cormorant Garamond',serif;

  font-weight:700;

  line-height:1;
}

.spark{
  color:#c79a3d;
}

/* DIVIDER */

.divider{
  width:clamp(170px,22vw,280px);

  margin:clamp(12px,1.5vw,18px) auto;

  display:flex;
  align-items:center;
  justify-content:center;

  gap:clamp(10px,1vw,16px);
}

.divider span{
  width:clamp(55px,8vw,95px);
  height:1px;
  background:#c79a3d;
}

.divider p{
  color:#c79a3d;

  font-size:clamp(14px,1vw,18px);
}

/* SUBTEXT */

.sub{
  color:#b78633;

  font-size:clamp(18px,2vw,32px);

  font-family:'Cormorant Garamond',serif;
}

/* SEARCH BAR */

.search-wrap{
  position:absolute;

  left:50%;
  bottom:clamp(12px,2vw,20px);

  transform:translateX(-50%);

  width:min(94%,1500px);

  height:clamp(72px,6vw,92px);

  border-radius:clamp(28px,3vw,36px);

  padding:0 clamp(12px,1.5vw,20px);

  display:flex;
  align-items:center;
  justify-content:space-between;

  background:
  linear-gradient(
  145deg,
  rgba(255,255,255,0.58),
  rgba(255,255,255,0.18)
  );

  border:1px solid rgba(255,255,255,0.72);

  backdrop-filter:blur(18px);

  box-shadow:
  inset 0 0 12px rgba(255,255,255,0.4),
  0 12px 28px rgba(180,140,100,0.10);
}

.search-left{
  display:flex;
  align-items:center;
  gap:clamp(10px,1vw,16px);
}

/* BUTTONS */

.circle-btn{
  width:clamp(44px,4vw,58px);
  height:clamp(44px,4vw,58px);

  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  background:
  linear-gradient(
  145deg,
  rgba(255,255,255,0.72),
  rgba(255,255,255,0.20)
  );

  border:1px solid rgba(255,255,255,0.7);

  box-shadow:
  inset 0 0 8px rgba(255,255,255,0.5),
  0 5px 16px rgba(180,140,100,0.10);
}

.circle-btn span{
  color:#b8862e;

  font-size:clamp(20px,1.6vw,28px);
}

/* PLACEHOLDER */

.placeholder{
  color:#7d756e;

  font-size:clamp(14px,1.2vw,18px);
}

</style>
</head>

<body>

<div class="app">

  <!-- TOP BAR -->

  <div class="top-bar">

    <div class="left-top">

      <div class="glass-btn">
        <i>☰</i>
      </div>

      <div class="brand">
        Sanitas Melete
      </div>

    </div>

    <div class="glass-btn">
      <i>∞</i>
    </div>

  </div>

  <!-- CENTER -->

  <div class="center">

    <div class="logo-ring">
      <div class="infinity">∞</div>
    </div>

    <div class="hero-title">
      Hi iam mebi<span class="spark">✦</span>
    </div>

    <div class="divider">
      <span></span>
      <p>✦</p>
      <span></span>
    </div>

    <div class="sub">
      your study buddy
    </div>

  </div>

  <!-- SEARCH -->

  <div class="search-wrap">

    <div class="search-left">

      <div class="circle-btn">
        <span>⌘</span>
      </div>

      <div class="placeholder">
        type your questions here
      </div>

    </div>

    <div class="circle-btn">
      <span>↑</span>
    </div>

  </div>

</div>

</body>
</html>
