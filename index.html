<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1"/>

<title>Sanitas Melete AI</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:'Poppins',sans-serif;
  overflow:hidden;
  background:#efe1d2;
}

/* MAIN */

.app{
  width:100%;
  height:100vh;
  overflow:hidden;
  position:relative;

  background:
  radial-gradient(circle at top,
  #f8eee2 0%,
  #efe1d2 45%,
  #eadbc9 100%);
}

/* TOP BAR */

.top-bar{
  width:100%;
  display:flex;
  justify-content:space-between;
  align-items:center;

  padding:26px 28px;
}

.left-top{
  display:flex;
  align-items:center;
  gap:16px;
}

/* GLASS BUTTON */

.glass-btn{
  width:58px;
  height:58px;

  border-radius:50%;

  background:
  linear-gradient(
  145deg,
  rgba(255,255,255,0.75),
  rgba(255,255,255,0.18)
  );

  border:1px solid rgba(255,255,255,0.65);

  backdrop-filter:blur(12px);

  box-shadow:
  inset 0 1px 1px rgba(255,255,255,0.7),
  0 8px 22px rgba(180,140,100,0.10);

  display:flex;
  align-items:center;
  justify-content:center;
}

.glass-btn i{
  font-style:normal;
  color:#062d71;
  font-size:26px;
}

/* BRAND */

.brand{
  color:#062d71;
  font-size:28px;
  font-family:'Cormorant Garamond',serif;
  font-weight:600;
}

/* CENTER */

.center{
  position:absolute;
  top:53%;
  left:50%;
  transform:translate(-50%,-50%);
  width:100%;
  text-align:center;
}

/* LOGO */

.logo-ring{
  width:320px;
  height:320px;

  margin:auto;

  border-radius:50%;

  background:
  linear-gradient(
  145deg,
  rgba(255,255,255,0.24),
  rgba(255,255,255,0.05)
  );

  border:1px solid rgba(255,255,255,0.45);

  position:relative;

  display:flex;
  align-items:center;
  justify-content:center;

  box-shadow:
  inset 0 0 18px rgba(255,255,255,0.22),
  0 0 45px rgba(255,255,255,0.08);
}

.logo-ring::before{
  content:'';
  position:absolute;

  width:400px;
  height:400px;

  border-radius:50%;

  background:rgba(255,255,255,0.04);

  filter:blur(2px);
}

.infinity{
  font-size:150px;
  color:#062d71;
  z-index:2;
}

/* TITLE */

.hero-title{
  margin-top:40px;

  color:#062d71;

  font-size:56px;

  font-family:'Cormorant Garamond',serif;

  font-weight:700;
}

.spark{
  color:#c79a3d;
}

/* DIVIDER */

.divider{
  width:260px;

  margin:16px auto;

  display:flex;
  align-items:center;
  justify-content:center;

  gap:14px;
}

.divider span{
  width:90px;
  height:1px;
  background:#c79a3d;
}

.divider p{
  color:#c79a3d;
  font-size:18px;
}

/* SUBTEXT */

.sub{
  color:#b78633;

  font-size:30px;

  font-family:'Cormorant Garamond',serif;
}

/* SEARCH BAR */

.search-wrap{
  position:absolute;

  bottom:18px;
  left:50%;

  transform:translateX(-50%);

  width:94%;
  height:88px;

  border-radius:34px;

  padding:0 18px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  background:
  linear-gradient(
  145deg,
  rgba(255,255,255,0.58),
  rgba(255,255,255,0.18)
  );

  border:1px solid rgba(255,255,255,0.72);

  backdrop-filter:blur(16px);

  box-shadow:
  inset 0 0 12px rgba(255,255,255,0.4),
  0 12px 28px rgba(180,140,100,0.10);
}

.search-left{
  display:flex;
  align-items:center;
  gap:14px;
}

/* SEARCH BUTTONS */

.circle-btn{
  width:56px;
  height:56px;

  border-radius:50%;

  background:
  linear-gradient(
  145deg,
  rgba(255,255,255,0.72),
  rgba(255,255,255,0.20)
  );

  border:1px solid rgba(255,255,255,0.7);

  display:flex;
  align-items:center;
  justify-content:center;

  box-shadow:
  inset 0 0 8px rgba(255,255,255,0.5),
  0 5px 16px rgba(180,140,100,0.10);
}

.circle-btn span{
  color:#b8862e;
  font-size:28px;
}

.placeholder{
  color:#7d756e;
  font-size:18px;
}

/* MOBILE */

@media (max-width:768px){

  .top-bar{
    padding:22px 20px 0;
  }

  .left-top{
    gap:12px;
  }

  .brand{
    font-size:14px;
  }

  .glass-btn{
    width:44px;
    height:44px;
  }

  .glass-btn i{
    font-size:20px;
  }

  .center{
    top:52%;
    padding:0 16px;
  }

  .logo-ring{
    width:170px;
    height:170px;
  }

  .logo-ring::before{
    width:220px;
    height:220px;
  }

  .infinity{
    font-size:82px;
  }

  .hero-title{
    margin-top:22px;
    font-size:25px;
    line-height:1;
  }

  .divider{
    width:150px;
    margin:10px auto;
    gap:8px;
  }

  .divider span{
    width:48px;
  }

  .divider p{
    font-size:13px;
  }

  .sub{
    font-size:15px;
  }

  .search-wrap{
    width:94%;
    height:70px;
    bottom:10px;
    border-radius:26px;
    padding:0 12px;
  }

  .search-left{
    gap:10px;
  }

  .circle-btn{
    width:42px;
    height:42px;
  }

  .circle-btn span{
    font-size:21px;
  }

  .placeholder{
    font-size:13px;
  }

}

</style>
</head>

<body>

<div class="app">

  <!-- TOP BAR -->

  <div class="top-bar">

    <div class="left-top">

      <div class="glass-btn">
        <i>☰</i>
      </div>

      <div class="brand">
        Sanitas Melete
      </div>

    </div>

    <div class="glass-btn">
      <i>∞</i>
    </div>

  </div>

  <!-- CENTER -->

  <div class="center">

    <div class="logo-ring">
      <div class="infinity">∞</div>
    </div>

    <div class="hero-title">
      Hi iam mebi<span class="spark">✦</span>
    </div>

    <div class="divider">
      <span></span>
      <p>✦</p>
      <span></span>
    </div>

    <div class="sub">
      your study buddy
    </div>

  </div>

  <!-- SEARCH -->

  <div class="search-wrap">

    <div class="search-left">

      <div class="circle-btn">
        <span>⌘</span>
      </div>

      <div class="placeholder">
        type your questions here
      </div>

    </div>

    <div class="circle-btn">
      <span>↑</span>
    </div>

  </div>

</div>

</body>
</html>
