<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1"
/>

<title>Sanitas Melete AI</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:'Poppins',sans-serif;
  background:#efe1d2;
}

/* APP */

.app{
  width:100%;
  min-height:100dvh;

  position:relative;
  overflow:hidden;

  display:flex;
  flex-direction:column;

  background:
  radial-gradient(circle at top,
  #f8eee2 0%,
  #efe1d2 45%,
  #eadbc9 100%);
}

/* TOP BAR */

.top-bar{
  width:100%;

  display:flex;
  justify-content:space-between;
  align-items:center;

  padding:24px 22px 0;
}

.left-top{
  display:flex;
  align-items:center;
  gap:12px;
}

/* GLASS BUTTON */

.glass-btn{
  width:46px;
  height:46px;

  border-radius:50%;

  background:
  linear-gradient(
  145deg,
  rgba(255,255,255,0.75),
  rgba(255,255,255,0.18)
  );

  border:1px solid rgba(255,255,255,0.65);

  backdrop-filter:blur(12px);

  box-shadow:
  inset 0 1px 1px rgba(255,255,255,0.7),
  0 8px 22px rgba(180,140,100,0.10);

  display:flex;
  align-items:center;
  justify-content:center;

  flex-shrink:0;
}

.glass-btn i{
  font-style:normal;
  color:#062d71;
  font-size:20px;
}

/* BRAND */

.brand{
  color:#062d71;

  font-size:15px;

  font-family:'Cormorant Garamond',serif;

  font-weight:600;
}

/* CENTER */

.center{
  flex:1;

  display:flex;
  flex-direction:column;

  align-items:center;
  justify-content:center;

  text-align:center;

  padding:20px;

  margin-top:-20px;
}

/* LOGO */

.logo-ring{
  width:170px;
  height:170px;

  border-radius:50%;

  position:relative;

  display:flex;
  align-items:center;
  justify-content:center;

  background:
  linear-gradient(
  145deg,
  rgba(255,255,255,0.25),
  rgba(255,255,255,0.05)
  );

  border:1px solid rgba(255,255,255,0.45);

  box-shadow:
  inset 0 0 18px rgba(255,255,255,0.25),
  0 0 45px rgba(255,255,255,0.08);
}

.logo-ring::before{
  content:'';

  position:absolute;

  width:215px;
  height:215px;

  border-radius:50%;

  background:rgba(255,255,255,0.05);

  filter:blur(2px);
}

.infinity{
  font-size:82px;
  color:#062d71;
  z-index:2;
}

/* TITLE */

.hero-title{
  margin-top:24px;

  color:#062d71;

  font-size:28px;

  font-family:'Cormorant Garamond',serif;

  font-weight:700;

  line-height:1;
}

.spark{
  color:#c79a3d;
}

/* DIVIDER */

.divider{
  width:150px;

  margin:12px auto;

  display:flex;
  align-items:center;
  justify-content:center;

  gap:10px;
}

.divider span{
  width:48px;
  height:1px;
  background:#c79a3d;
}

.divider p{
  color:#c79a3d;
  font-size:14px;
}

/* SUBTEXT */

.sub{
  color:#b78633;

  font-size:16px;

  font-family:'Cormorant Garamond',serif;
}

/* SEARCH BAR */

.search-wrap{
  position:absolute;

  left:50%;
  bottom:14px;

  transform:translateX(-50%);

  width:94%;
  height:66px;

  border-radius:26px;

  padding:0 12px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  background:
  linear-gradient(
  145deg,
  rgba(255,255,255,0.58),
  rgba(255,255,255,0.18)
  );

  border:1px solid rgba(255,255,255,0.72);

  backdrop-filter:blur(16px);

  box-shadow:
  inset 0 0 12px rgba(255,255,255,0.4),
  0 12px 28px rgba(180,140,100,0.10);
}

.search-left{
  display:flex;
  align-items:center;
  gap:10px;
}

/* BUTTONS */

.circle-btn{
  width:40px;
  height:40px;

  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  flex-shrink:0;

  background:
  linear-gradient(
  145deg,
  rgba(255,255,255,0.72),
  rgba(255,255,255,0.20)
  );

  border:1px solid rgba(255,255,255,0.7);

  box-shadow:
  inset 0 0 8px rgba(255,255,255,0.5),
  0 5px 16px rgba(180,140,100,0.10);
}

.circle-btn span{
  color:#b8862e;
  font-size:18px;
}

/* PLACEHOLDER */

.placeholder{
  color:#7d756e;
  font-size:13px;
}

/* DESKTOP */

@media (min-width:769px){

  .top-bar{
    padding:28px 34px 0;
  }

  .brand{
    font-size:28px;
  }

  .glass-btn{
    width:58px;
    height:58px;
  }

  .glass-btn i{
    font-size:26px;
  }

  .center{
    margin-top:-30px;
  }

  .logo-ring{
    width:320px;
    height:320px;
  }

  .logo-ring::before{
    width:400px;
    height:400px;
  }

  .infinity{
    font-size:150px;
  }

  .hero-title{
    margin-top:38px;
    font-size:56px;
  }

  .divider{
    width:260px;
    margin:18px auto;
  }

  .divider span{
    width:90px;
  }

  .divider p{
    font-size:18px;
  }

  .sub{
    font-size:30px;
  }

  .search-wrap{
    width:94%;
    height:88px;
    border-radius:34px;
    bottom:18px;
    padding:0 18px;
  }

  .circle-btn{
    width:56px;
    height:56px;
  }

  .circle-btn span{
    font-size:26px;
  }

  .placeholder{
    font-size:18px;
  }

}

</style>
</head>

<body>

<div class="app">

  <!-- TOP -->

  <div class="top-bar">

    <div class="left-top">

      <div class="glass-btn">
        <i>☰</i>
      </div>

      <div class="brand">
        Sanitas Melete
      </div>

    </div>

    <div class="glass-btn">
      <i>∞</i>
    </div>

  </div>

  <!-- CENTER -->

  <div class="center">

    <div class="logo-ring">
      <div class="infinity">∞</div>
    </div>

    <div class="hero-title">
      Hi iam mebi<span class="spark">✦</span>
    </div>

    <div class="divider">
      <span></span>
      <p>✦</p>
      <span></span>
    </div>

    <div class="sub">
      your study buddy
    </div>

  </div>

  <!-- SEARCH BAR -->

  <div class="search-wrap">

    <div class="search-left">

      <div class="circle-btn">
        <span>⌘</span>
      </div>

      <div class="placeholder">
        type your questions here
      </div>

    </div>

    <div class="circle-btn">
      <span>↑</span>
    </div>

  </div>

</div>

</body>
</html>
