<!-- REPLACE YOUR FULL <style>...</style> WITH THIS -->

<style>

@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html,body{
height:100%;
overflow:hidden;
font-family:'Inter',sans-serif;
background:linear-gradient(180deg,#fbf8f3 0%,#f6efe5 100%);
color:#111827;
}

/* SOFT BACKGROUND */

body::before{
content:'';
position:fixed;
width:320px;
height:320px;
background:rgba(255,255,255,0.8);
filter:blur(100px);
border-radius:50%;
top:-120px;
left:-120px;
z-index:-1;
}

body::after{
content:'';
position:fixed;
width:320px;
height:320px;
background:rgba(255,240,220,0.6);
filter:blur(100px);
border-radius:50%;
bottom:-120px;
right:-120px;
z-index:-1;
}

/* APP */

.app{
width:100%;
height:100vh;
padding:18px;
display:flex;
justify-content:center;
overflow:hidden;
}

.main-layout{
width:100%;
max-width:1450px;
height:100%;
display:grid;
grid-template-columns:320px 1fr;
gap:24px;
overflow:hidden;
}

/* SIDEBAR */

.sidebar{
background:rgba(255,255,255,0.42);
backdrop-filter:blur(22px);
border:1px solid rgba(255,255,255,0.55);
border-radius:34px;
padding:24px;
display:flex;
flex-direction:column;
gap:24px;
box-shadow:0 10px 40px rgba(0,0,0,0.04);
}

/* TOPBAR */

.topbar{
display:flex;
align-items:center;
justify-content:space-between;
margin-bottom:12px;
}

.menu-btn{
width:58px;
height:58px;
border:none;
background:white;
border-radius:22px;
font-size:28px;
cursor:pointer;
box-shadow:0 6px 20px rgba(0,0,0,0.05);
}

.profile{
padding:16px 20px;
background:white;
border-radius:22px;
font-weight:700;
box-shadow:0 6px 20px rgba(0,0,0,0.05);
}

.brand{
display:flex;
align-items:center;
gap:14px;
}

.infinity-mini{
font-size:52px;
font-weight:800;
color:#0d2f87;
}

.brand-text{
display:flex;
flex-direction:column;
line-height:1;
}

.brand-text span{
font-size:14px;
font-weight:800;
letter-spacing:2px;
color:#0d2f87;
}

/* QUICK ACCESS */

.quick-card{
background:rgba(255,255,255,0.48);
border-radius:28px;
padding:22px;
backdrop-filter:blur(18px);
box-shadow:0 10px 30px rgba(15,23,42,0.04);
}

.quick-title{
font-size:28px;
font-weight:800;
margin-bottom:20px;
}

.quick-grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:16px;
}

.quick-item{
background:rgba(255,255,255,0.8);
border-radius:24px;
padding:22px 14px;
text-align:center;
transition:0.25s ease;
box-shadow:0 5px 18px rgba(0,0,0,0.04);
}

.quick-item:hover{
transform:translateY(-4px);
}

.quick-icon{
width:64px;
height:64px;
border-radius:22px;
margin:auto;
margin-bottom:14px;
display:flex;
align-items:center;
justify-content:center;
font-size:28px;
}

.yellow{background:#fff3d7;}
.purple{background:#f1ddff;}
.green{background:#e8f6d8;}
.blue{background:#dde8ff;}

.quick-item h3{
font-size:18px;
font-weight:700;
}

/* CENTER */

.center{
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
overflow:hidden;
padding:10px;
}

.infinity{
width:260px;
height:260px;
border-radius:50%;
background:rgba(255,255,255,0.55);
backdrop-filter:blur(24px);
display:flex;
align-items:center;
justify-content:center;
font-size:140px;
font-weight:800;
color:#0d2f87;
box-shadow:0 18px 50px rgba(0,0,0,0.05);
margin-bottom:28px;
animation:float 4s ease-in-out infinite;
flex-shrink:0;
}

@keyframes float{
0%{transform:translateY(0px);}
50%{transform:translateY(-10px);}
100%{transform:translateY(0px);}
}

.hero{
font-size:72px;
font-weight:800;
letter-spacing:-0.04em;
margin-bottom:12px;
text-align:center;
}

.gold{
background:linear-gradient(90deg,#d9a43c,#f2d578);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.sub{
font-size:28px;
color:#6b7280;
text-align:center;
margin-bottom:34px;
}

/* INFO CARD */

.info-card{
width:100%;
max-width:850px;
background:rgba(255,255,255,0.48);
backdrop-filter:blur(18px);
border-radius:34px;
padding:28px;
display:flex;
align-items:center;
gap:18px;
box-shadow:0 10px 30px rgba(15,23,42,0.04);
margin-bottom:34px;
}

.spark{
width:68px;
height:68px;
border-radius:22px;
background:#fff2d7;
display:flex;
align-items:center;
justify-content:center;
font-size:28px;
flex-shrink:0;
}

.info-card h3{
font-size:28px;
margin-bottom:8px;
}

.info-card p{
font-size:21px;
color:#4b5563;
line-height:1.5;
}

/* TRY ASKING */

.try{
width:100%;
max-width:920px;
}

.try-title{
font-size:34px;
font-weight:800;
color:#7a6554;
margin-bottom:20px;
}

.try-grid{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:18px;
}

.try-card{
background:rgba(255,255,255,0.52);
backdrop-filter:blur(16px);
border-radius:30px;
padding:24px;
min-height:210px;
display:flex;
flex-direction:column;
justify-content:space-between;
transition:0.25s ease;
box-shadow:0 8px 24px rgba(15,23,42,0.04);
}

.try-card:hover{
transform:translateY(-5px);
}

.try-icon{
width:70px;
height:70px;
border-radius:22px;
display:flex;
align-items:center;
justify-content:center;
font-size:28px;
margin-bottom:18px;
}

.try-card h4{
font-size:28px;
line-height:1.3;
font-weight:700;
}

.arrow{
font-size:42px;
}

/* INPUT BAR */

.bottom{
width:100%;
max-width:980px;
margin-top:28px;
}

.input-wrap{
height:92px;
background:rgba(255,255,255,0.62);
backdrop-filter:blur(22px);
border-radius:999px;
display:flex;
align-items:center;
padding:0 16px;
gap:16px;
box-shadow:0 10px 35px rgba(15,23,42,0.06);
}

.attach{
width:64px;
height:64px;
border-radius:50%;
background:white;
display:flex;
align-items:center;
justify-content:center;
font-size:28px;
box-shadow:0 6px 18px rgba(0,0,0,0.05);
}

.input-wrap input{
flex:1;
border:none;
outline:none;
background:transparent;
font-size:24px;
font-weight:500;
color:#111827;
}

.input-wrap input::placeholder{
color:#8b8b8b;
}

.mic{
font-size:28px;
}

.send{
width:72px;
height:72px;
border:none;
border-radius:50%;
background:linear-gradient(180deg,#153aa8,#08256d);
color:white;
font-size:28px;
cursor:pointer;
box-shadow:0 12px 30px rgba(20,59,168,0.35);
}

/* MOBILE */

@media(max-width:1000px){

html,body{
overflow:auto;
}

.app{
height:auto;
overflow:auto;
padding:12px;
}

.main-layout{
grid-template-columns:1fr;
height:auto;
overflow:visible;
}

.sidebar{
order:1;
}

.center{
order:2;
padding-bottom:120px;
}

.try-grid{
grid-template-columns:repeat(2,1fr);
}

.hero{
font-size:52px;
}

.infinity{
width:210px;
height:210px;
font-size:110px;
}

.sub{
font-size:20px;
}

.info-card h3{
font-size:22px;
}

.info-card p{
font-size:17px;
}

.input-wrap{
height:78px;
}

.input-wrap input{
font-size:18px;
}

.bottom{
position:sticky;
bottom:10px;
z-index:100;
}

}

@media(max-width:640px){

.quick-grid{
grid-template-columns:repeat(2,1fr);
}

.try-grid{
grid-template-columns:repeat(2,1fr);
gap:14px;
}

.try-card{
min-height:170px;
padding:18px;
}

.try-card h4{
font-size:20px;
}

.hero{
font-size:44px;
}

.infinity{
width:180px;
height:180px;
font-size:92px;
}

.info-card{
padding:22px;
}

.info-card h3{
font-size:20px;
}

.info-card p{
font-size:15px;
}

.input-wrap{
height:72px;
}

.attach{
width:54px;
height:54px;
font-size:24px;
}

.send{
width:60px;
height:60px;
font-size:24px;
}

}

</style>
