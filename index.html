<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<meta name="author" content="SK">
<meta name="creator" content="SK">
<meta name="publisher" content="Sanitas Melete AI">

<meta name="description"
content="Sanitas Melete AI is a premium AI-powered educational platform for NEET and JEE students, created by SK.">

<meta name="keywords"
content="SK, Sanitas Melete AI, NEET AI, JEE AI, AI study platform">

<title>Sanitas Melete AI</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

/* =========================
   RESET
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    min-height:100%;
    font-family:'Poppins',sans-serif;
}

body{
    overflow:hidden;
    background:#0d2035;
}


/* =========================
   APP
========================= */

.app{
    position:relative;
    width:100%;
    height:100dvh;
    min-height:100vh;
    overflow:hidden;

    color:#123560;

    background:
    linear-gradient(
        rgba(217,231,242,0.18),
        rgba(217,231,242,0.12)
    ),
    url("https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=2000&q=90");

    background-size:cover;
    background-position:center;
}


/* atmospheric overlay */

.app::before{
    content:"";

    position:absolute;
    inset:0;

    background:
    linear-gradient(
        to bottom,
        rgba(220,235,245,0.25) 0%,
        rgba(220,235,245,0.05) 35%,
        rgba(15,42,70,0.05) 70%,
        rgba(10,30,50,0.15) 100%
    );

    pointer-events:none;
    z-index:0;
}


/* =========================
   TOP HEADER
========================= */

.top-bar{

    position:absolute;

    top:0;
    left:0;

    width:100%;

    padding:
    max(28px, env(safe-area-inset-top))
    5vw
    0;

    display:grid;

    grid-template-columns:
    70px 1fr 70px;

    align-items:center;

    z-index:100;
}


.brand-wrap{
    text-align:center;
}


.brand{

    font-size:clamp(24px,3vw,42px);

    font-weight:500;

    letter-spacing:1px;

    color:#123560;

    white-space:nowrap;

    line-height:1;
}


.tagline{

    margin-top:10px;

    font-size:clamp(8px,1vw,14px);

    letter-spacing:9px;

    color:#173b65;

    font-weight:400;

    white-space:nowrap;
}


/* =========================
   GLASS BUTTONS
========================= */

.glass-btn{

    width:70px;
    height:70px;

    border-radius:50%;

    border:
    1px solid rgba(255,255,255,0.75);

    background:
    linear-gradient(
        145deg,
        rgba(255,255,255,0.40),
        rgba(255,255,255,0.12)
    );

    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);

    box-shadow:
    inset 0 1px 1px rgba(255,255,255,0.8),
    0 8px 25px rgba(12,47,84,0.10);

    display:flex;
    align-items:center;
    justify-content:center;

    cursor:pointer;

    color:#123560;

    transition:.25s ease;

    flex-shrink:0;
}


.glass-btn:active{
    transform:scale(.94);
}


.menu-lines{

    width:35px;
    height:28px;

    display:flex;
    flex-direction:column;

    justify-content:space-between;
}


.menu-lines span{

    width:100%;
    height:4px;

    background:#123560;

    border-radius:10px;
}


/* =========================
   PROFILE ICON
========================= */

.profile-symbol{

    width:42px;
    height:42px;

    position:relative;
}


.profile-symbol::before{

    content:"";

    position:absolute;

    width:18px;
    height:18px;

    border:4px solid #123560;

    border-radius:50%;

    top:0;
    left:50%;

    transform:translateX(-50%);
}


.profile-symbol::after{

    content:"";

    position:absolute;

    width:38px;
    height:21px;

    border:
    4px solid #123560;

    border-bottom:none;

    border-radius:
    25px 25px 0 0;

    bottom:0;
    left:50%;

    transform:translateX(-50%);
}


/* =========================
   MAIN HERO
========================= */

.hero{

    position:absolute;

    inset:0;

    z-index:2;

    pointer-events:none;
}


/* LEFT TITLE */

.left-content{

    position:absolute;

    left:6vw;
    top:28%;
}


.small-line{

    width:75px;
    height:4px;

    background:#173b65;

    margin-bottom:24px;
}


.hero-title{

    font-family:
    'Cormorant Garamond',
    serif;

    font-size:
    clamp(52px,7vw,105px);

    font-weight:600;

    line-height:.88;

    color:#123560;

    letter-spacing:-2px;
}


.hero-title span{
    display:block;
}


.bottom-lines{

    margin-top:30px;
}


.bottom-lines .line{

    width:75px;
    height:4px;

    background:#173b65;

    margin:0 0 25px;
}


.bottom-lines p{

    font-size:12px;

    letter-spacing:7px;

    line-height:2.5;

    color:#123560;

    font-weight:500;
}


/* =========================
   QUOTE
========================= */

.quote{

    position:absolute;

    right:6vw;
    top:27%;

    width:220px;

    font-family:
    'Cormorant Garamond',
    serif;

    font-size:27px;

    line-height:1.05;

    color:#123560;
}


.quote-line{

    width:70px;
    height:4px;

    background:#173b65;

    margin-top:20px;
}


/* =========================
   MEBI CARD
========================= */

.mebi-card{

    position:absolute;

    left:50%;
    top:57%;

    transform:
    translate(-50%,-50%);

    width:min(660px,58vw);

    min-height:440px;

    border-radius:42px;

    padding:50px 30px;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    text-align:center;

    background:
    linear-gradient(
        145deg,
        rgba(245,250,255,0.52),
        rgba(205,220,235,0.28)
    );

    border:
    1.5px solid rgba(255,255,255,0.72);

    backdrop-filter:blur(22px);
    -webkit-backdrop-filter:blur(22px);

    box-shadow:
    inset 0 1px 1px rgba(255,255,255,.8),
    0 25px 60px rgba(9,38,70,.18);

    z-index:5;
}


/* MEBI LOGO */

.mebi-logo{

    width:150px;
    height:150px;

    position:relative;

    margin-bottom:28px;
}


.mebi-logo::before{

    content:"";

    position:absolute;

    inset:8px;

    border:
    10px solid #173f77;

    border-radius:
    42px 42px 42px 42px;
}


/* diagonal leaf */

.mebi-logo::after{

    content:"";

    position:absolute;

    width:12px;
    height:92px;

    background:#173f77;

    border-radius:20px;

    transform:rotate(45deg);

    top:27px;
    left:70px;

    box-shadow:
    24px 24px 0 -2px #173f77;
}


.mebi-title{

    color:#173f77;

    font-size:
    clamp(38px,4vw,65px);

    font-weight:500;

    letter-spacing:1px;

    margin-bottom:22px;
}


.mebi-sub{

    font-size:15px;

    letter-spacing:9px;

    line-height:2.5;

    color:#173f77;

    font-weight:500;
}


/* =========================
   CHAT AREA
========================= */

.chat-area{

    position:absolute;

    left:0;
    top:0;

    width:100%;
    height:100%;

    overflow-y:auto;

    padding:
    85vh
    5vw
    150px;

    display:flex;
    flex-direction:column;

    gap:14px;

    z-index:20;

    pointer-events:auto;

    scrollbar-width:none;
}


.chat-area::-webkit-scrollbar{
    display:none;
}


.message{

    max-width:75%;

    padding:15px 18px;

    border-radius:22px;

    font-size:15px;

    line-height:1.6;

    animation:fadeUp .3s ease;

    box-shadow:
    0 10px 30px rgba(0,0,0,.10);
}


.user-message{

    align-self:flex-end;

    background:#173f77;

    color:white;

    border-bottom-right-radius:6px;
}


.ai-message{

    align-self:flex-start;

    background:
    rgba(255,255,255,.65);

    backdrop-filter:blur(15px);

    color:#183b64;

    border:
    1px solid rgba(255,255,255,.7);

    border-bottom-left-radius:6px;
}


@keyframes fadeUp{

    from{
        opacity:0;
        transform:translateY(20px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}


/* =========================
   SEARCH BAR
========================= */

.search-wrap{

    position:absolute;

    left:50%;
    bottom:max(22px, env(safe-area-inset-bottom));

    transform:translateX(-50%);

    width:min(1100px,92%);

    height:94px;

    padding:10px 12px;

    display:flex;

    align-items:center;

    gap:15px;

    border-radius:50px;

    background:
    linear-gradient(
        145deg,
        rgba(245,250,255,.62),
        rgba(210,225,240,.32)
    );

    border:
    1.5px solid rgba(255,255,255,.75);

    backdrop-filter:blur(25px);
    -webkit-backdrop-filter:blur(25px);

    box-shadow:
    inset 0 1px 1px rgba(255,255,255,.8),
    0 15px 40px rgba(8,35,65,.16);

    z-index:200;
}


.circle-btn{

    width:72px;
    height:72px;

    flex-shrink:0;

    border:none;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    cursor:pointer;

    background:
    linear-gradient(
        145deg,
        rgba(255,255,255,.52),
        rgba(230,240,250,.22)
    );

    border:
    1px solid rgba(255,255,255,.8);

    color:#173f77;

    font-size:40px;

    transition:.2s ease;
}


.circle-btn:active{
    transform:scale(.93);
}


.search-input{

    width:100%;
    height:100%;

    border:none;
    outline:none;

    background:transparent;

    font-family:'Poppins',sans-serif;

    font-size:22px;

    color:#173f77;

    padding:0 5px;
}


.search-input::placeholder{
    color:rgba(23,63,119,.65);
}


.mic-btn{

    border:none;

    background:transparent;

    color:#173f77;

    font-size:34px;

    cursor:pointer;
}


.send-btn{

    background:
    linear-gradient(
        145deg,
        #3d6fb5,
        #173f77
    );

    color:white;

    font-size:42px;

    box-shadow:
    0 10px 25px rgba(20,60,115,.25);
}


/* =========================
   MENU OVERLAY
========================= */

.menu-overlay{

    position:fixed;

    inset:0;

    background:
    rgba(7,25,45,.25);

    backdrop-filter:blur(8px);

    opacity:0;
    visibility:hidden;

    transition:.3s ease;

    z-index:500;
}


.menu-overlay.active{

    opacity:1;
    visibility:visible;
}


/* =========================
   SIDE MENU
========================= */

.side-menu{

    position:fixed;

    top:0;
    left:0;

    width:min(360px,88vw);

    height:100dvh;

    padding:
    max(100px, env(safe-area-inset-top))
    18px
    25px;

    background:
    linear-gradient(
        145deg,
        rgba(235,245,252,.88),
        rgba(180,205,225,.55)
    );

    border-right:
    1px solid rgba(255,255,255,.7);

    border-radius:
    0 32px 32px 0;

    backdrop-filter:blur(30px);

    transform:
    translateX(-110%);

    transition:
    transform .42s cubic-bezier(.77,0,.18,1);

    z-index:501;

    overflow-y:auto;
}


.side-menu.active{
    transform:translateX(0);
}


.menu-profile{

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:16px;

    border-radius:22px;

    background:
    rgba(255,255,255,.35);

    border:
    1px solid rgba(255,255,255,.7);

    margin-bottom:18px;
}


.profile-left{

    display:flex;

    align-items:center;

    gap:12px;
}


.profile-icon{

    width:52px;
    height:52px;

    border-radius:50%;

    display:flex;

    align-items:center;
    justify-content:center;

    background:
    rgba(255,255,255,.55);

    font-size:24px;
}


.menu-profile h2{

    font-family:
    'Cormorant Garamond',
    serif;

    font-size:28px;

    color:#173f77;
}


.menu-profile p{

    font-size:12px;

    color:#547399;
}


.profile-star{

    font-size:22px;

    color:#173f77;
}


.menu-items{

    display:flex;

    flex-direction:column;

    gap:10px;
}


.menu-item{

    height:62px;

    padding:0 17px;

    display:flex;

    align-items:center;

    border-radius:18px;

    background:
    rgba(255,255,255,.34);

    border:
    1px solid rgba(255,255,255,.6);

    cursor:pointer;
}


.menu-item span{
    font-size:20px;
}


.menu-item p{

    flex:1;

    margin-left:14px;

    font-size:16px;

    color:#173f77;
}


.menu-item i{

    font-style:normal;

    font-size:24px;

    color:#547399;
}


/* =========================
   ABOUT POPUP
========================= */

.about-popup{

    position:fixed;

    inset:0;

    display:flex;

    align-items:center;
    justify-content:center;

    background:
    rgba(8,30,55,.28);

    backdrop-filter:blur(10px);

    opacity:0;
    visibility:hidden;

    transition:.3s ease;

    z-index:600;
}


.about-popup.active{

    opacity:1;
    visibility:visible;
}


.about-card{

    width:min(380px,88%);

    padding:40px 28px;

    border-radius:32px;

    text-align:center;

    background:
    linear-gradient(
        145deg,
        rgba(245,250,255,.75),
        rgba(190,215,235,.45)
    );

    border:
    1px solid rgba(255,255,255,.8);

    backdrop-filter:blur(25px);

    color:#173f77;

    position:relative;
}


.close-popup{

    position:absolute;

    right:18px;
    top:14px;

    border:none;

    background:none;

    font-size:24px;

    color:#173f77;

    cursor:pointer;
}


.about-logo{

    font-size:60px;

    color:#173f77;
}


.about-card h2{

    font-family:
    'Cormorant Garamond',
    serif;

    font-size:34px;

    margin-top:10px;
}


.about-sub{

    margin-top:5px;

    letter-spacing:3px;

    font-size:12px;
}


.about-line{

    width:70px;
    height:2px;

    background:#173f77;

    margin:20px auto;
}


.about-text{

    font-size:14px;

    line-height:1.7;

    color:#36587d;
}


.founder{

    margin-top:18px;

    font-family:
    'Cormorant Garamond',
    serif;

    font-size:22px;
}


/* =========================
   MOBILE
========================= */

@media(max-width:768px){

    .app{

        background-position:center center;
    }


    .top-bar{

        padding:
        max(18px, env(safe-area-inset-top))
        34px
        0;

        grid-template-columns:
        90px 1fr 90px;
    }


    .glass-btn{

        width:88px;
        height:88px;
    }


    .menu-lines{

        width:45px;
        height:38px;
    }


    .menu-lines span{
        height:5px;
    }


    .profile-symbol{

        transform:scale(1.25);
    }


    .brand{

        font-size:43px;

        letter-spacing:0;
    }


    .tagline{

        font-size:12px;

        letter-spacing:8px;

        margin-top:14px;
    }


    .left-content{

        left:8%;

        top:31%;
    }


    .small-line{

        width:80px;

        margin-bottom:30px;
    }


    .hero-title{

        font-size:78px;

        line-height:.95;

        letter-spacing:-2px;
    }


    .quote{
        display:none;
    }


    .bottom-lines{

        margin-top:25px;
    }


    .bottom-lines p{

        font-size:10px;

        letter-spacing:5px;
    }


    .mebi-card{

        width:calc(100% - 196px);

        min-width:500px;

        height:490px;

        top:63%;

        padding:45px 25px;

        border-radius:45px;
    }


    .mebi-logo{

        width:140px;
        height:140px;

        margin-bottom:25px;
    }


    .mebi-title{

        font-size:62px;
    }


    .mebi-sub{

        font-size:14px;

        letter-spacing:8px;
    }


    .search-wrap{

        width:94%;

        height:108px;

        bottom:
        max(24px, env(safe-area-inset-bottom));

        border-radius:55px;

        padding:10px;
    }


    .circle-btn{

        width:86px;
        height:86px;

        font-size:45px;
    }


    .search-input{

        font-size:25px;
    }


    .mic-btn{
        display:none;
    }


    .chat-area{

        padding-top:85vh;

        padding-left:20px;
        padding-right:20px;

        padding-bottom:150px;
    }
}


/* =========================
   SMALL MOBILE FIX
========================= */

@media(max-width:500px){

    .top-bar{

        padding-left:18px;
        padding-right:18px;

        grid-template-columns:
        70px 1fr 70px;
    }


    .glass-btn{

        width:64px;
        height:64px;
    }


    .menu-lines{

        width:34px;
        height:29px;
    }


    .menu-lines span{
        height:4px;
    }


    .profile-symbol{
        transform:scale(.95);
    }


    .brand{

        font-size:29px;
    }


    .tagline{

        font-size:8px;

        letter-spacing:5px;

        margin-top:8px;
    }


    .left-content{

        top:29%;

        left:9%;
    }


    .small-line{

        width:65px;

        height:3px;

        margin-bottom:22px;
    }


    .hero-title{

        font-size:62px;

        line-height:.95;
    }


    .bottom-lines{

        display:none;
    }


    /* PERFECT MOBILE CARD */

    .mebi-card{

        width:calc(100% - 80px);

        min-width:0;

        min-height:0;

        height:390px;

        top:63%;

        padding:30px 15px;

        border-radius:38px;
    }


    .mebi-logo{

        width:110px;
        height:110px;

        margin-bottom:20px;
    }


    .mebi-logo::before{

        inset:5px;

        border-width:8px;

        border-radius:32px;
    }


    .mebi-logo::after{

        width:9px;
        height:70px;

        top:19px;
        left:51px;

        box-shadow:
        18px 18px 0 -2px #173f77;
    }


    .mebi-title{

        font-size:45px;

        margin-bottom:14px;
    }


    .mebi-sub{

        font-size:10px;

        letter-spacing:5px;

        line-height:2.8;
    }


    .search-wrap{

        height:82px;

        width:94%;

        bottom:18px;

        border-radius:42px;
    }


    .circle-btn{

        width:62px;
        height:62px;

        font-size:34px;
    }


    .search-input{

        font-size:17px;
    }


    .message{

        max-width:85%;
    }
}

</style>
</head>


<body>

<div class="app" id="app">


<!-- MENU OVERLAY -->

<div
class="menu-overlay"
id="menuOverlay"
onclick="closeMenu()">
</div>


<!-- SIDE MENU -->

<div class="side-menu" id="sideMenu">

    <div class="menu-profile">

        <div class="profile-left">

            <div class="profile-icon">👤</div>

            <div>
                <h2>SK</h2>
                <p>Premium User</p>
            </div>

        </div>

        <div class="profile-star">✦</div>

    </div>


    <div class="menu-items">

        <div class="menu-item">
            <span>☷</span>
            <p>Dashboard</p>
            <i>›</i>
        </div>

        <div class="menu-item">
            <span>💬</span>
            <p>My Chats</p>
            <i>›</i>
        </div>

        <div class="menu-item">
            <span>📄</span>
            <p>My Documents</p>
            <i>›</i>
        </div>

        <div class="menu-item">
            <span>🔖</span>
            <p>Saved Answers</p>
            <i>›</i>
        </div>

        <div class="menu-item">
            <span>🗓</span>
            <p>Study Planner</p>
            <i>›</i>
        </div>

        <div class="menu-item">
            <span>✦</span>
            <p>AI Tools</p>
            <i>›</i>
        </div>

    </div>

</div>



<!-- HEADER -->

<div class="top-bar">


    <button
    class="glass-btn"
    onclick="openMenu()"
    aria-label="Open menu">

        <div class="menu-lines">
            <span></span>
            <span></span>
            <span></span>
        </div>

    </button>


    <div class="brand-wrap">

        <div class="brand">
            Sanitas Melete
        </div>

        <div class="tagline">
            YOUR STUDY BUDDY
        </div>
