<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Sanitas Melete</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  overflow:hidden;

  background:#f3e7da;

  font-family:
  -apple-system,
  BlinkMacSystemFont,
  "SF Pro Display",
  sans-serif;
}

/* ========================= */
/* APP */
/* ========================= */

.app{
  width:100%;
  height:100vh;

  position:relative;

  overflow:hidden;

  background:
  radial-gradient(circle at top,
  #f7ede3 0%,
  #f3e7da 55%,
  #efe2d5 100%);
}

/* SOFT BACK LIGHT */

.app::before{
  content:"";

  position:absolute;

  width:460px;
  height:460px;

  left:50%;
  top:180px;

  transform:translateX(-50%);

  border-radius:50%;

  background:rgba(255,255,255,0.16);

  filter:blur(90px);
}

/* ========================= */
/* TOPBAR */
/* ========================= */

.topbar{
  height:92px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 28px;

  position:relative;
  z-index:5;
}

/* GLASS BUTTON */

.glass-btn{
  width:54px;
  height:54px;

  border:none;

  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  background:
  linear-gradient(
  180deg,
  rgba(255,255,255,0.82),
  rgba(255,255,255,0.42));

  border:1px solid rgba(255,255,255,0.75);

  backdrop-filter:blur(20px);

  box-shadow:
  0 8px 24px rgba(190,160,120,0.10),
  inset 0 2px 4px rgba(255,255,255,0.95);

  color:#082b67;

  font-size:23px;

  cursor:pointer;
}

/* BRAND */

.brand{
  position:absolute;

  left:50%;
  transform:translateX(-50%);

  font-family:Georgia,serif;

  font-size:20px;

  font-weight:600;

  color:#082b67;

  letter-spacing:-0.03em;
}

/* ========================= */
/* CENTER */
/* ========================= */

.hero{
  height:calc(100vh - 92px);

  display:flex;
  flex-direction:column;
  align-items:center;

  padding-top:120px;

  position:relative;
  z-index:2;
}

/* ========================= */
/* LOGO */
/* ========================= */

.logo-wrapper{
  position:relative;

  width:330px;
  height:330px;

  display:flex;
  align-items:center;
  justify-content:center;
}

/* RINGS */

.ring{
  position:absolute;

  border-radius:50%;

  border:1px solid rgba(255,255,255,0.12);
}

.ring1{
  width:230px;
  height:230px;
}

.ring2{
  width:300px;
  height:300px;
}

.ring3{
  width:360px;
  height:360px;
}

/* MAIN ORB */

.logo-orb{
  width:215px;
  height:215px;

  border-radius:50%;

  position:relative;

  display:flex;
  align-items:center;
  justify-content:center;

  background:
  linear-gradient(
  180deg,
  rgba(255,255,255,0.32),
  rgba(255,255,255,0.10));

  border:1px solid rgba(255,255,255,0.42);

  backdrop-filter:blur(30px);

  box-shadow:
  0 0 40px rgba(255,255,255,0.28),
  inset 0 2px 12px rgba(255,255,255,0.42);
}

/* ORB REFLECTION */

.logo-orb::before{
  content:"";

  position:absolute;

  width:120px;
  height:240px;

  left:-10px;
  top:-30px;

  transform:rotate(18deg);

  background:rgba(255,255,255,0.08);

  filter:blur(10px);
}

/* INFINITY */

.infinity{
  font-size:118px;

  font-weight:700;

  color:#082b67;

  line-height:1;

  filter:
  drop-shadow(
  0 4px 10px rgba(11,43,103,0.10));
}

/* ========================= */
/* TEXTS */
/* ========================= */

.title{
  margin-top:34px;

  font-size:40px;

  font-family:Georgia,serif;

  font-weight:700;

  color:#082b67;

  letter-spacing:-0.05em;
}

.spark{
  color:#d4aa5c;
}

/* DIVIDER */

.divider{
  margin-top:16px;

  display:flex;
  align-items:center;
  gap:14px;
}

.line{
  width:92px;
  height:1px;

  background:#d4aa5c;

  opacity:0.42;
}

.star-small{
  color:#d4aa5c;

  font-size:16px;
}

/* SUBTITLE */

.subtitle{
  margin-top:12px;

  font-size:18px;

  font-family:Georgia,serif;

  color:#b58b45;

  letter-spacing:0.01em;
}

/* ========================= */
/* INPUT BAR */
/* ========================= */

.bottom-bar{
  position:absolute;

  left:18px;
  right:18px;
  bottom:22px;

  z-index:5;
}

/* INPUT CONTAINER */

.input-box{
  height:76px;

  border-radius:999px;

  position:relative;

  overflow:hidden;

  display:flex;
  align-items:center;

  gap:12px;

  padding:0 14px;

  background:
  linear-gradient(
  180deg,
  rgba(255,255,255,0.42),
  rgba(255,255,255,0.20));

  border:1px solid rgba(255,255,255,0.52);

  backdrop-filter:blur(24px);

  box-shadow:
  0 18px 35px rgba(190,160,120,0.12),
  inset 0 1px 2px rgba(255,255,255,0.42);
}

/* INPUT REFLECTION */

.input-box::before{
  content:"";

  position:absolute;

  width:160px;
  height:240px;

  left:120px;
  top:-60px;

  transform:rotate(18deg);

  background:rgba(255,255,255,0.10);

  filter:blur(12px);
}

/* BUTTONS */

.attach-btn,
.send-btn{
  width:50px;
  height:50px;

  border:none;

  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  cursor:pointer;

  z-index:2;
}

/* ATTACH */

.attach-btn{
  background:
  linear-gradient(
  180deg,
  rgba(255,255,255,0.82),
  rgba(255,255,255,0.42));

  color:#b58b45;

  font-size:22px;

  box-shadow:
  0 6px 16px rgba(181,139,69,0.10);
}

/* SEND */

.send-btn{
  background:
  linear-gradient(
  180deg,
  #f0d5a2,
  #e5bf78);

  color:#8a5f1c;

  font-size:24px;

  box-shadow:
  0 8px 18px rgba(181,139,69,0.16);
}

/* INPUT */

.input-box input{
  flex:1;

  border:none;
  outline:none;

  background:transparent;

  font-size:15px;

  color:#7d7268;

  z-index:2;
}

.input-box input::placeholder{
  color:#8f847a;
}

/* MOBILE */

@media(max-width:480px){

  .brand{
    font-size:18px;
  }

  .logo-wrapper{
    transform:scale(0.95);
  }

}

</style>
</head>

<body>

<div class="app">

  <!-- TOPBAR -->

  <header class="topbar">

    <button class="glass-btn">
      ☰
    </button>

    <div class="brand">
      Sanitas Melete
    </div>

    <button class="glass-btn">
      ∞
    </button>

  </header>

  <!-- HERO -->

  <section class="hero">

    <div class="logo-wrapper">

      <div class="ring ring1"></div>
      <div class="ring ring2"></div>
      <div class="ring ring3"></div>

      <div class="logo-orb">

        <div class="infinity">
          ∞
        </div>

      </div>

    </div>

    <div class="title">
      Hi iam mebi<span class="spark">✦</span>
    </div>

    <div class="divider">

      <div class="line"></div>

      <div class="star-small">
        ✦
      </div>

      <div class="line"></div>

    </div>

    <div class="subtitle">
      your study buddy
    </div>

  </section>

  <!-- INPUT -->

  <div class="bottom-bar">

    <div class="input-box">

      <button class="attach-btn">
        📎
      </button>

      <input
      type="text"
      placeholder="Put your documents or photos..."
      >

      <button class="send-btn">
        ↑
      </button>

    </div>

  </div>

</div>

</body>
</html>
