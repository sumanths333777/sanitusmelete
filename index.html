<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Sanitas Melete</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#f4e8dc;
  font-family:
  -apple-system,
  BlinkMacSystemFont,
  "SF Pro Display",
  sans-serif;

  overflow:hidden;
}

/* MAIN APP */

.app{
  width:100%;
  height:100vh;

  background:
  radial-gradient(circle at top,
  #f7ede3 0%,
  #f3e7da 55%,
  #efe2d5 100%);

  position:relative;

  overflow:hidden;
}

/* SOFT BACKGROUND LIGHT */

.app::before{
  content:"";

  position:absolute;

  width:420px;
  height:420px;

  border-radius:50%;

  background:rgba(255,255,255,0.18);

  filter:blur(90px);

  left:50%;
  top:140px;

  transform:translateX(-50%);
}

/* ========================= */
/* TOPBAR */
/* ========================= */

.topbar{
  height:88px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 26px;

  position:relative;
  z-index:5;
}

/* BUTTONS */

.glass-btn{
  width:58px;
  height:58px;

  border:none;

  border-radius:50%;

  background:
  linear-gradient(
  180deg,
  rgba(255,255,255,0.85),
  rgba(255,255,255,0.45));

  border:1px solid rgba(255,255,255,0.75);

  backdrop-filter:blur(20px);

  box-shadow:
  0 10px 30px rgba(190,160,120,0.14),
  inset 0 2px 4px rgba(255,255,255,0.95);

  color:#082b67;

  font-size:24px;

  display:flex;
  align-items:center;
  justify-content:center;

  cursor:pointer;
}

/* TITLE */

.brand{
  position:absolute;

  left:50%;
  transform:translateX(-50%);

  font-family:Georgia,serif;

  font-size:20px;

  font-weight:600;

  color:#082b67;

  letter-spacing:-0.03em;
}

/* ========================= */
/* CENTER AREA */
/* ========================= */

.hero{
  height:calc(100vh - 88px);

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  padding-bottom:120px;

  position:relative;
  z-index:2;
}

/* LOGO WRAPPER */

.logo-wrapper{
  position:relative;

  width:340px;
  height:340px;

  display:flex;
  align-items:center;
  justify-content:center;
}

/* RINGS */

.ring{
  position:absolute;

  border-radius:50%;

  border:1px solid rgba(255,255,255,0.14);
}

.ring1{
  width:240px;
  height:240px;
}

.ring2{
  width:300px;
  height:300px;
}

.ring3{
  width:360px;
  height:360px;
}

/* ORB */

.logo-orb{
  width:220px;
  height:220px;

  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  background:
  linear-gradient(
  180deg,
  rgba(255,255,255,0.88),
  rgba(255,255,255,0.48));

  border:1px solid rgba(255,255,255,0.85);

  backdrop-filter:blur(25px);

  box-shadow:
  0 0 60px rgba(255,255,255,0.55),
  0 20px 60px rgba(214,184,146,0.14),
  inset 0 2px 10px rgba(255,255,255,0.95);

  overflow:hidden;

  position:relative;
}

/* REFLECTION */

.logo-orb::before{
  content:"";

  position:absolute;

  width:120px;
  height:240px;

  background:rgba(255,255,255,0.18);

  left:-10px;
  top:-20px;

  transform:rotate(18deg);

  filter:blur(10px);
}

/* INFINITY */

.infinity{
  font-size:120px;

  font-weight:700;

  color:#082b67;

  filter:
  drop-shadow(
  0 6px 14px rgba(11,43,103,0.12));
}

/* TEXT */

.title{
  margin-top:8px;

  font-size:62px;

  font-family:Georgia,serif;

  font-weight:700;

  color:#082b67;

  letter-spacing:-0.05em;

  line-height:1;
}

.spark{
  color:#d3ab63;
}

/* DIVIDER */

.divider{
  margin-top:22px;

  display:flex;
  align-items:center;
  gap:14px;
}

.line{
  width:90px;
  height:1px;

  background:#d4aa5c;

  opacity:0.45;
}

.small-star{
  color:#d4aa5c;

  font-size:18px;
}

/* SUBTITLE */

.subtitle{
  margin-top:14px;

  font-size:26px;

  font-family:Georgia,serif;

  color:#b58b45;
}

/* ========================= */
/* INPUT BAR */
/* ========================= */

.bottom-bar{
  position:absolute;

  left:20px;
  right:20px;
  bottom:24px;

  z-index:10;
}

/* INPUT CONTAINER */

.input-box{
  height:84px;

  border-radius:999px;

  background:
  linear-gradient(
  180deg,
  rgba(255,255,255,0.82),
  rgba(255,255,255,0.42));

  border:1px solid rgba(255,255,255,0.82);

  backdrop-filter:blur(24px);

  box-shadow:
  0 20px 45px rgba(190,160,120,0.14),
  inset 0 1px 3px rgba(255,255,255,0.95);

  display:flex;
  align-items:center;

  padding:0 14px;

  gap:12px;

  overflow:hidden;

  position:relative;
}

/* REFLECTION */

.input-box::before{
  content:"";

  position:absolute;

  width:150px;
  height:220px;

  background:rgba(255,255,255,0.18);

  left:70px;
  top:-40px;

  transform:rotate(18deg);

  filter:blur(12px);
}

/* BUTTONS */

.attach-btn,
.send-btn{
  width:52px;
  height:52px;

  border:none;

  border-radius:50%;

  flex-shrink:0;

  cursor:pointer;
}

/* ATTACH */

.attach-btn{
  background:
  linear-gradient(
  180deg,
  rgba(255,255,255,0.92),
  rgba(255,255,255,0.52));

  color:#b58b45;

  font-size:22px;

  box-shadow:
  0 8px 20px rgba(181,139,69,0.12);

  z-index:2;
}

/* SEND */

.send-btn{
  background:
  linear-gradient(
  180deg,
  #f0d5a2,
  #e5bf78);

  color:#8a5f1c;

  font-size:24px;

  box-shadow:
  0 10px 25px rgba(181,139,69,0.22);

  z-index:2;
}

/* INPUT */

.input-box input{
  flex:1;

  border:none;
  outline:none;

  background:transparent;

  font-size:16px;

  color:#7d7268;

  z-index:2;
}

.input-box input::placeholder{
  color:#8f847a;
}

/* MOBILE */

@media(max-width:480px){

  .brand{
    font-size:18px;
  }

  .logo-wrapper{
    transform:scale(0.94);
  }

  .title{
    font-size:56px;
  }

  .subtitle{
    font-size:22px;
  }

}

</style>
</head>

<body>

<div class="app">

  <!-- TOPBAR -->

  <header class="topbar">

    <button class="glass-btn">
      ☰
    </button>

    <div class="brand">
      Sanitas Melete
    </div>

    <button class="glass-btn">
      ∞
    </button>

  </header>

  <!-- HERO -->

  <section class="hero">

    <div class="logo-wrapper">

      <div class="ring ring1"></div>
      <div class="ring ring2"></div>
      <div class="ring ring3"></div>

      <div class="logo-orb">

        <div class="infinity">
          ∞
        </div>

      </div>

    </div>

    <div class="title">
      Hi iam mebi<span class="spark">✦</span>
    </div>

    <div class="divider">

      <div class="line"></div>

      <div class="small-star">
        ✦
      </div>

      <div class="line"></div>

    </div>

    <div class="subtitle">
      your study buddy
    </div>

  </section>

  <!-- INPUT -->

  <div class="bottom-bar">

    <div class="input-box">

      <button class="attach-btn">
        ⎋
      </button>

      <input
      type="text"
      placeholder="Put your documents or photos..."
      >

      <button class="send-btn">
        ↑
      </button>

    </div>

  </div>

</div>

</body>
</html>
