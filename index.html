<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sanitas Melete AI</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    min-height:100%;
}

body{
    background:#f8f1e8;
    font-family:'Poppins',sans-serif;
    color:#0b2c74;
    overflow-x:hidden;
}

/* SOFT GLOW */

body::before{
    content:"";
    position:fixed;
    inset:0;

    background:
    radial-gradient(circle at top left, rgba(255,255,255,0.75), transparent 35%),
    radial-gradient(circle at bottom right, rgba(255,255,255,0.45), transparent 35%);

    z-index:-1;
}

/* TOPBAR */

.topbar{
    position:fixed;

    top:0;
    left:0;
    right:0;

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:24px 34px;

    z-index:1000;
}

.left-top{
    display:flex;
    align-items:center;
    gap:18px;
}

.menu-btn,
.logo-btn{
    width:68px;
    height:68px;

    border-radius:50%;

    border:none;
    outline:none;
    cursor:pointer;

    background:rgba(255,255,255,0.28);

    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);

    border:1px solid rgba(255,255,255,0.55);

    display:flex;
    align-items:center;
    justify-content:center;

    color:#0b2c74;

    box-shadow:
    inset 0 1px 1px rgba(255,255,255,0.8),
    0 8px 25px rgba(0,0,0,0.04);

    transition:0.25s ease;
}

.menu-btn:hover,
.logo-btn:hover{
    transform:scale(1.05);
}

.menu-btn{
    font-size:30px;
}

.logo-btn{
    font-size:34px;
}

.brand{
    font-size:34px;

    font-family:'Cormorant Garamond',serif;
    font-weight:600;
}

/* HERO */

.hero{
    width:100%;
    min-height:100vh;

    display:flex;
    flex-direction:column;

    justify-content:center;
    align-items:center;

    text-align:center;

    padding:120px 20px 50px;
}

.hero-logo-circle{
    width:min(32vw,380px);
    height:min(32vw,380px);

    border-radius:50%;

    background:rgba(255,255,255,0.18);

    border:1px solid rgba(255,255,255,0.5);

    display:flex;
    justify-content:center;
    align-items:center;

    margin-bottom:34px;

    box-shadow:
    inset 0 1px 1px rgba(255,255,255,0.7),
    0 18px 50px rgba(0,0,0,0.03);
}

.hero-logo{
    font-size:min(9vw,120px);
}

.hero h1{
    font-size:min(5vw,78px);

    font-family:'Cormorant Garamond',serif;

    font-weight:700;

    margin-bottom:10px;
}

.hero-line{
    display:flex;
    align-items:center;
    gap:16px;

    color:#c79c36;

    margin-bottom:14px;
}

.hero-line span{
    width:min(9vw,120px);
    height:1px;

    background:#c79c36;
}

.hero p{
    font-size:min(1.7vw,26px);

    color:#b48a2f;
}

/* CHAT */

#chatContainer{
    width:100%;

    display:flex;
    flex-direction:column;

    gap:22px;

    padding:20px 34px 160px;
}

.message{
    width:fit-content;
    max-width:700px;

    padding:20px 26px;

    border-radius:32px;

    font-size:20px;

    line-height:1.7;
}

.user{
    align-self:flex-end;

    background:#0b2c74;
    color:white;
}

.ai{
    align-self:flex-start;

    background:rgba(255,255,255,0.42);

    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);

    border:1px solid rgba(255,255,255,0.55);

    color:#0b2c74;
}

/* INPUT */

.input-area{
    position:fixed;

    left:24px;
    right:24px;
    bottom:18px;

    height:84px;

    background:rgba(255,255,255,0.4);

    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);

    border-radius:50px;

    border:1px solid rgba(255,255,255,0.55);

    display:flex;
    align-items:center;

    padding:0 16px;

    z-index:1000;
}

.left-icon{
    width:54px;
    height:54px;

    border-radius:50%;

    background:rgba(255,255,255,0.65);

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:26px;

    color:#c79c36;

    margin-right:12px;
}

#userInput{
    flex:1;

    border:none;
    outline:none;

    background:transparent;

    font-size:20px;

    color:#555;
}

#sendBtn{
    width:56px;
    height:56px;

    border:none;
    border-radius:50%;

    background:white;

    color:#b48a2f;

    font-size:28px;

    cursor:pointer;
}

/* SIDEBAR */

.sidebar{
    position:fixed;

    top:0;
    left:-320px;

    width:300px;
    height:100vh;

    background:rgba(255,255,255,0.55);

    backdrop-filter:blur(22px);

    border-right:1px solid rgba(255,255,255,0.5);

    padding:28px;

    transition:0.35s ease;

    z-index:2000;
}

.sidebar.active{
    left:0;
}

.close-btn{
    font-size:30px;

    cursor:pointer;

    margin-bottom:30px;
}

.sidebar h2{
    font-family:'Cormorant Garamond',serif;
    font-size:38px;

    margin-bottom:20px;
}

.sidebar a{
    display:block;

    margin-bottom:18px;

    color:#0b2c74;

    text-decoration:none;

    font-size:18px;
}

/* MOBILE */

@media(max-width:768px){

    .topbar{
        padding:20px 18px;
    }

    .menu-btn,
    .logo-btn{
        width:58px;
        height:58px;
    }

    .brand{
        font-size:22px;
    }

    .hero{
        padding-top:120px;
    }

    .hero-logo-circle{
        width:240px;
        height:240px;
    }

    .hero-logo{
        font-size:82px;
    }

    .hero h1{
        font-size:52px;
    }

    .hero-line span{
        width:70px;
    }

    .hero p{
        font-size:20px;
    }

    #chatContainer{
        padding:20px 18px 150px;
    }

    .message{
        max-width:85%;

        font-size:17px;

        padding:18px 20px;
    }

    .input-area{
        left:16px;
        right:16px;
        bottom:16px;

        height:76px;
    }

    .left-icon,
    #sendBtn{
        width:50px;
        height:50px;
    }

    #userInput{
        font-size:18px;
    }

}

</style>
</head>

<body>

<!-- SIDEBAR -->

<div class="sidebar" id="sidebar">

    <div class="close-btn" onclick="closeSidebar()">
        ✕
    </div>

    <h2>Sanitas Melete</h2>

    <a href="#">Home</a>
    <a href="about.html">About</a>
    <a href="#">Features</a>
    <a href="#">Contact</a>

</div>

<!-- TOPBAR -->

<div class="topbar">

    <div class="left-top">

        <button class="menu-btn" onclick="openSidebar()">
            ☰
        </button>

        <div class="brand">
            Sanitas Melete
        </div>

    </div>

    <button class="logo-btn" onclick="scrollToTopHero()">
        ∞
    </button>

</div>

<!-- HERO -->

<section class="hero" id="hero">

    <div class="hero-logo-circle">
        <div class="hero-logo">∞</div>
    </div>

    <h1>Hi iam mebi</h1>

    <div class="hero-line">
        <span></span>
        ✦
        <span></span>
    </div>

    <p>your study buddy</p>

</section>

<!-- CHAT -->

<section id="chatContainer"></section>

<!-- INPUT -->

<div class="input-area">

    <div class="left-icon">
        ⌘
    </div>

    <input
        type="text"
        id="userInput"
        placeholder="type your questions here"
    >

    <button id="sendBtn">
        ↑
    </button>

</div>

<script>

const userInput = document.getElementById("userInput");
const sendBtn = document.getElementById("sendBtn");
const chatContainer = document.getElementById("chatContainer");
const hero = document.getElementById("hero");
const sidebar = document.getElementById("sidebar");

/* CHAT */

function addMessage(text,type){

    const msg = document.createElement("div");

    msg.classList.add("message");
    msg.classList.add(type);

    msg.innerText = text;

    chatContainer.appendChild(msg);

    window.scrollTo({
        top:document.body.scrollHeight,
        behavior:"smooth"
    });
}

function sendMessage(){

    const text = userInput.value.trim();

    if(text === "") return;

    addMessage(text,"user");

    userInput.value = "";

    setTimeout(()=>{

        addMessage(
`Hello there! 😊

I am MEBI, your study buddy.
How can I help you today?`,
        "ai");

    },700);
}

sendBtn.addEventListener("click",sendMessage);

userInput.addEventListener("keypress",function(e){

    if(e.key === "Enter"){
        sendMessage();
    }

});

/* SIDEBAR */

function openSidebar(){
    sidebar.classList.add("active");
}

function closeSidebar(){
    sidebar.classList.remove("active");
}

/* HERO SCROLL */

function scrollToTopHero(){

    hero.scrollIntoView({
        behavior:"smooth"
    });

}

</script>

</body>
</html>
