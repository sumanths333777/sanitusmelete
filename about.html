<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Sanitas Melete AI</title>

<!-- GOOGLE FONTS -->
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#f8f1e8;
    overflow-x:hidden;

    font-family:'Poppins',sans-serif;
}

/* SOFT GLOW BACKGROUND */

body::before{
    content:"";

    position:fixed;
    inset:0;

    background:
    radial-gradient(circle at top left, rgba(255,255,255,0.65), transparent 35%),
    radial-gradient(circle at bottom right, rgba(255,255,255,0.45), transparent 35%);

    z-index:-1;
}

/* TOP BAR */

.topbar{
    position:fixed;

    top:0;
    left:0;
    right:0;

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:24px 24px;

    z-index:100;
}

.left-top{
    display:flex;
    align-items:center;
    gap:18px;
}

.menu-btn,
.logo-btn{
    width:86px;
    height:86px;

    border-radius:50%;

    background:rgba(255,255,255,0.28);

    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);

    border:1px solid rgba(255,255,255,0.55);

    display:flex;
    align-items:center;
    justify-content:center;

    box-shadow:
    inset 0 1px 1px rgba(255,255,255,0.7),
    0 10px 25px rgba(0,0,0,0.04);
}

.menu-btn{
    font-size:42px;
    color:#0b2c74;
}

.logo-btn{
    font-size:42px;
    color:#0b2c74;
}

.brand{
    font-size:28px;
    color:#0b2c74;

    font-family:'Cormorant Garamond',serif;
}

/* HERO SECTION */

.hero{
    min-height:100vh;

    display:flex;
    flex-direction:column;

    justify-content:center;
    align-items:center;

    text-align:center;

    padding:160px 20px 60px;
}

.hero-logo-circle{
    width:380px;
    height:380px;

    border-radius:50%;

    background:rgba(255,255,255,0.16);

    border:1px solid rgba(255,255,255,0.45);

    display:flex;
    align-items:center;
    justify-content:center;

    margin-bottom:40px;

    box-shadow:
    inset 0 1px 1px rgba(255,255,255,0.6),
    0 15px 40px rgba(0,0,0,0.03);
}

.hero-logo{
    font-size:120px;
    color:#0b2c74;
}

.hero h1{
    font-size:72px;

    color:#0b2c74;

    font-family:'Cormorant Garamond',serif;

    margin-bottom:10px;
}

.hero-line{
    display:flex;
    align-items:center;
    gap:16px;

    color:#c79c36;

    margin-bottom:16px;
}

.hero-line span{
    width:120px;
    height:1px;
    background:#c79c36;
}

.hero p{
    color:#b68b2e;
    font-size:24px;
}

/* CHAT AREA */

#chatContainer{
    width:100%;

    padding:30px 22px 180px;

    display:flex;
    flex-direction:column;

    gap:22px;
}

/* MESSAGE */

.message{
    max-width:78%;

    padding:22px 26px;

    border-radius:32px;

    font-size:20px;

    line-height:1.7;

    word-wrap:break-word;
}

/* USER */

.user{
    align-self:flex-end;

    background:#0b2c74;

    color:white;
}

/* AI */

.ai{
    align-self:flex-start;

    background:rgba(255,255,255,0.4);

    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);

    border:1px solid rgba(255,255,255,0.5);

    color:#0b2c74;
}

/* INPUT BAR */

.input-area{
    position:fixed;

    left:20px;
    right:20px;
    bottom:18px;

    height:92px;

    background:rgba(255,255,255,0.38);

    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);

    border-radius:48px;

    border:1px solid rgba(255,255,255,0.55);

    display:flex;
    align-items:center;

    padding:0 18px;

    z-index:200;

    box-shadow:
    inset 0 1px 1px rgba(255,255,255,0.65),
    0 10px 30px rgba(0,0,0,0.05);
}

.left-icon{
    width:62px;
    height:62px;

    border-radius:50%;

    background:rgba(255,255,255,0.6);

    display:flex;
    align-items:center;
    justify-content:center;

    color:#c79c36;

    font-size:34px;

    margin-right:16px;
}

#userInput{
    flex:1;

    border:none;
    outline:none;

    background:transparent;

    font-size:22px;

    color:#666;
}

#sendBtn{
    width:62px;
    height:62px;

    border:none;
    border-radius:50%;

    background:white;

    color:#b48a2f;

    font-size:34px;

    margin-left:12px;
}

/* MOBILE */

@media(max-width:768px){

    .menu-btn,
    .logo-btn{
        width:62px;
        height:62px;
        font-size:30px;
    }

    .brand{
        font-size:22px;
    }

    .hero-logo-circle{
        width:240px;
        height:240px;
    }

    .hero-logo{
        font-size:80px;
    }

    .hero h1{
        font-size:44px;
    }

    .hero p{
        font-size:18px;
    }

    .hero-line span{
        width:70px;
    }

    .message{
        font-size:16px;
        padding:18px 20px;
    }

    .input-area{
        height:78px;
    }

    #userInput{
        font-size:18px;
    }

    .left-icon,
    #sendBtn{
        width:52px;
        height:52px;
        font-size:28px;
    }

}

</style>
</head>

<body>

<!-- TOP BAR -->

<div class="topbar">

    <div class="left-top">

        <div class="menu-btn">
            ☰
        </div>

        <div class="brand">
            Sanitas Melete
        </div>

    </div>

    <div class="logo-btn">
        ∞
    </div>

</div>

<!-- HERO -->

<section class="hero">

    <div class="hero-logo-circle">
        <div class="hero-logo">∞</div>
    </div>

    <h1>Hi iam mebi</h1>

    <div class="hero-line">
        <span></span>
        ✦
        <span></span>
    </div>

    <p>your study buddy</p>

</section>

<!-- CHAT -->

<section id="chatContainer"></section>

<!-- INPUT -->

<div class="input-area">

    <div class="left-icon">
        ⌘
    </div>

    <input
        type="text"
        id="userInput"
        placeholder="type your questions here"
    >

    <button id="sendBtn">
        ↑
    </button>

</div>

<script>

const userInput = document.getElementById("userInput");
const sendBtn = document.getElementById("sendBtn");
const chatContainer = document.getElementById("chatContainer");

function addMessage(text,type){

    const msg = document.createElement("div");

    msg.classList.add("message");
    msg.classList.add(type);

    msg.innerText = text;

    chatContainer.appendChild(msg);

    window.scrollTo({
        top:document.body.scrollHeight,
        behavior:"smooth"
    });
}

function sendMessage(){

    const text = userInput.value.trim();

    if(text === "") return;

    addMessage(text,"user");

    userInput.value = "";

    setTimeout(()=>{

        addMessage(
            "Hello there! 😊\n\nI am MEBI, your study buddy.\nHow can I help you today?",
            "ai"
        );

    },700);
}

sendBtn.addEventListener("click",sendMessage);

userInput.addEventListener("keypress",function(e){

    if(e.key === "Enter"){
        sendMessage();
    }

});

</script>

</body>
</html>
