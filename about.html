<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sanitas Melete AI</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#f8f1e8;
    overflow-x:hidden;
    font-family:'Poppins',sans-serif;
    color:#0b2c74;
}

/* BACKGROUND GLOW */

body::before{
    content:"";
    position:fixed;
    inset:0;

    background:
    radial-gradient(circle at top left, rgba(255,255,255,0.7), transparent 35%),
    radial-gradient(circle at bottom right, rgba(255,255,255,0.45), transparent 35%);

    z-index:-1;
}

/* TOPBAR */

.topbar{
    position:fixed;
    top:0;
    left:0;
    right:0;

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:30px 50px;

    z-index:1000;
}

.left-top{
    display:flex;
    align-items:center;
    gap:22px;
}

.menu-btn,
.logo-btn{
    width:78px;
    height:78px;

    border-radius:50%;

    background:rgba(255,255,255,0.25);

    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);

    border:1px solid rgba(255,255,255,0.55);

    display:flex;
    align-items:center;
    justify-content:center;

    box-shadow:
    inset 0 1px 1px rgba(255,255,255,0.8),
    0 8px 25px rgba(0,0,0,0.04);
}

.menu-btn{
    font-size:34px;
}

.logo-btn{
    font-size:38px;
}

.brand{
    font-size:38px;
    font-family:'Cormorant Garamond',serif;
    font-weight:600;
}

/* HERO */

.hero{
    width:100%;
    min-height:100vh;

    display:flex;
    flex-direction:column;

    justify-content:center;
    align-items:center;

    text-align:center;

    padding:140px 20px 80px;
}

.hero-logo-circle{
    width:520px;
    height:520px;

    border-radius:50%;

    background:rgba(255,255,255,0.18);

    border:1px solid rgba(255,255,255,0.5);

    display:flex;
    justify-content:center;
    align-items:center;

    margin-bottom:45px;

    box-shadow:
    inset 0 1px 1px rgba(255,255,255,0.7),
    0 20px 50px rgba(0,0,0,0.03);
}

.hero-logo{
    font-size:180px;
    color:#0b2c74;
}

.hero h1{
    font-size:110px;
    font-family:'Cormorant Garamond',serif;
    font-weight:700;

    margin-bottom:12px;
}

.hero-line{
    display:flex;
    align-items:center;
    gap:18px;

    color:#c79c36;

    margin-bottom:16px;
}

.hero-line span{
    width:150px;
    height:1px;
    background:#c79c36;
}

.hero p{
    font-size:34px;
    color:#b68b2e;
}

/* CHAT */

#chatContainer{
    width:100%;

    display:flex;
    flex-direction:column;

    gap:26px;

    padding:40px 40px 180px;
}

/* MESSAGES */

.message{
    width:fit-content;
    max-width:700px;

    padding:22px 28px;

    border-radius:34px;

    font-size:22px;

    line-height:1.7;
}

.user{
    align-self:flex-end;

    background:#0b2c74;
    color:white;
}

.ai{
    align-self:flex-start;

    background:rgba(255,255,255,0.42);

    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);

    border:1px solid rgba(255,255,255,0.55);

    color:#0b2c74;
}

/* INPUT BAR */

.input-area{
    position:fixed;

    left:30px;
    right:30px;
    bottom:22px;

    height:92px;

    background:rgba(255,255,255,0.38);

    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);

    border:1px solid rgba(255,255,255,0.55);

    border-radius:50px;

    display:flex;
    align-items:center;

    padding:0 18px;

    z-index:1000;

    box-shadow:
    inset 0 1px 1px rgba(255,255,255,0.7),
    0 10px 30px rgba(0,0,0,0.04);
}

.left-icon{
    width:60px;
    height:60px;

    border-radius:50%;

    background:rgba(255,255,255,0.65);

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:30px;

    color:#c79c36;

    margin-right:16px;
}

#userInput{
    flex:1;

    border:none;
    outline:none;

    background:transparent;

    font-size:24px;

    color:#555;
}

#sendBtn{
    width:62px;
    height:62px;

    border:none;
    border-radius:50%;

    background:white;

    color:#b68b2e;

    font-size:34px;

    cursor:pointer;
}

/* MOBILE */

@media(max-width:768px){

    .topbar{
        padding:22px 22px;
    }

    .menu-btn,
    .logo-btn{
        width:62px;
        height:62px;
    }

    .menu-btn{
        font-size:28px;
    }

    .logo-btn{
        font-size:30px;
    }

    .brand{
        font-size:22px;
    }

    .hero{
        padding-top:130px;
    }

    .hero-logo-circle{
        width:240px;
        height:240px;
    }

    .hero-logo{
        font-size:85px;
    }

    .hero h1{
        font-size:52px;
    }

    .hero-line span{
        width:70px;
    }

    .hero p{
        font-size:20px;
    }

    #chatContainer{
        padding:30px 18px 160px;
    }

    .message{
        font-size:17px;
        padding:18px 20px;
        max-width:85%;
    }

    .input-area{
        left:16px;
        right:16px;
        bottom:16px;

        height:78px;
    }

    .left-icon,
    #sendBtn{
        width:52px;
        height:52px;

        font-size:26px;
    }

    #userInput{
        font-size:18px;
    }

}

</style>
</head>

<body>

<!-- TOPBAR -->

<div class="topbar">

    <div class="left-top">

        <div class="menu-btn">
            ☰
        </div>

        <div class="brand">
            Sanitas Melete
        </div>

    </div>

    <div class="logo-btn">
        ∞
    </div>

</div>

<!-- HERO SECTION -->

<section class="hero">

    <div class="hero-logo-circle">
        <div class="hero-logo">∞</div>
    </div>

    <h1>Hi iam mebi</h1>

    <div class="hero-line">
        <span></span>
        ✦
        <span></span>
    </div>

    <p>your study buddy</p>

</section>

<!-- CHAT AREA -->

<section id="chatContainer"></section>

<!-- INPUT -->

<div class="input-area">

    <div class="left-icon">
        ⌘
    </div>

    <input
        type="text"
        id="userInput"
        placeholder="type your questions here"
    >

    <button id="sendBtn">
        ↑
    </button>

</div>

<script>

const userInput = document.getElementById("userInput");
const sendBtn = document.getElementById("sendBtn");
const chatContainer = document.getElementById("chatContainer");

function addMessage(text,type){

    const msg = document.createElement("div");

    msg.classList.add("message");
    msg.classList.add(type);

    msg.innerText = text;

    chatContainer.appendChild(msg);

    window.scrollTo({
        top:document.body.scrollHeight,
        behavior:"smooth"
    });
}

function sendMessage(){

    const text = userInput.value.trim();

    if(text === "") return;

    addMessage(text,"user");

    userInput.value = "";

    setTimeout(()=>{

        addMessage(
            "Hello there! 😊\n\nI am MEBI, your study buddy.\nHow can I help you today?",
            "ai"
        );

    },700);
}

sendBtn.addEventListener("click",sendMessage);

userInput.addEventListener("keypress",function(e){

    if(e.key === "Enter"){
        sendMessage();
    }

});

</script>

</body>
</html>
